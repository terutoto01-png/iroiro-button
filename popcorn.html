<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>ぽっぷこーん</title>
<link rel="stylesheet" href="common.css?v=10">
<style>
  body { background: repeating-linear-gradient(90deg, #ff5a5a 0 60px, #fff 60px 120px); }
  .big-btn { --c1: #ffcc00; --c2: #b38f00; }
  .bottom-center { bottom: max(24px, env(safe-area-inset-bottom) + 12px); }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🍿</span></button></div>
<script src="common.js?v=10"></script>
<script>
// ぽっぷこーん: おすたびに なべの なかで はじけて つもる。いっぱいに なると ふちから あふれる
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const btn = document.getElementById('btn');
const COL = 12;
let dpr = 1, heap = [], inPot = [], flying = [], floor = [], last = 0, combo = 0, shake = 0;

// ポップコーンの つぶを 1かいだけ えにしておく
const kernel = document.createElement('canvas');
kernel.width = kernel.height = 64;
(() => {
  const k = kernel.getContext('2d');
  for (const [x, y, r, c] of [[24, 30, 15, '#fffaf0'], [40, 26, 13, '#fff6e0'], [34, 42, 14, '#fffdf7'], [22, 44, 10, '#ffeec8'], [32, 32, 6, '#f4c46a']]) {
    k.fillStyle = c; k.beginPath(); k.arc(x, y, r, 0, 7); k.fill();
  }
  k.strokeStyle = 'rgba(200,150,60,.45)'; k.lineWidth = 1.5;
  k.beginPath(); k.arc(24, 30, 15, 0, 7); k.arc(40, 26, 13, 0, 7); k.arc(34, 42, 14, 0, 7); k.stroke();
})();
const drawK = (x, y, s, rot) => { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(kernel, -s / 2, -s / 2, s, s); ctx.restore(); };

// なべ（ボタンの うえ）。y は ふちの たかさ
function pot() {
  const W = innerWidth, top = btn.getBoundingClientRect().top;
  const h = 150, w = Math.min(380, W * 0.6);
  return { x: W / 2, y: Math.max(160, top - h - 70), w, h, bottom: Math.max(160, top - h - 70) + h };
}
function cols(p) { return Math.floor((p.w - 24) / COL); }
function colX(p, i) { return p.x - p.w / 2 + 12 + (i + 0.5) * COL; }
function colOf(p, x) { return Math.floor((x - (p.x - p.w / 2 + 12)) / COL); }
function resize() { dpr = fitCanvas(cv, ctx); heap = new Array(cols(pot())).fill(0); inPot = []; }
resize(); addEventListener('resize', resize);

btn.addEventListener('pointerdown', () => {
  const now = performance.now();
  combo = now - last < 400 ? combo + 1 : 0; last = now;
  const p = pot(), n = 1 + Math.min(4, Math.floor(combo / 3));
  shake = 1;
  for (let i = 0; i < n; i++) {
    const c = Math.floor(Math.random() * heap.length);
    const wide = Math.random() < 0.12; // ときどき そとまで とんでいく
    flying.push({ x: colX(p, c), y: p.bottom - heap[c] - 10, vx: wide ? rand(-420, 420) : rand(-120, 120),
                  vy: -rand(500, 850), rot: rand(0, 6), vr: rand(-10, 10), s: rand(34, 44) });
  }
  Sfx.tone(rand(700, 1300), 0.05, 'square', 0.08, 0, rand(300, 500)); // ぽん
  Sfx.noise(0.05, 0.5, 2500, 0, 'bandpass');
});

// なべの なかに つもる
function settle(f, p) {
  let c = Math.max(0, Math.min(heap.length - 1, colOf(p, f.x)));
  // ひくい ほうへ ころがって やまの かたちに なる
  for (let step = 0; step < 8; step++) {
    const l = c > 0 ? heap[c - 1] : Infinity, r = c < heap.length - 1 ? heap[c + 1] : Infinity;
    const lo = Math.min(l, r);
    if (heap[c] - lo < f.s * 0.35) break;
    c = l < r ? c - 1 : l > r ? c + 1 : (Math.random() < 0.5 ? c - 1 : c + 1);
  }
  const y = p.bottom - heap[c] - f.s * 0.3;
  inPot.push({ x: colX(p, c) + rand(-4, 4), y, s: f.s, rot: f.rot });
  for (let d = -2; d <= 2; d++) {
    const j = c + d; if (j < 0 || j >= heap.length) continue;
    heap[j] = Math.max(heap[j], heap[c] + f.s * 0.42 - Math.abs(d) * f.s * 0.16);
  }
  const avg = heap.reduce((a, b) => a + b, 0) / heap.length;
  if (avg > p.h + 40) overflow(p); // やま ぜんたいが ふちより たかく なったら
}

// あふれる！ ふちより うえの ぶんが そとへ こぼれる
function overflow(p) {
  const level = p.h * 0.55; // のこるのは なべの はんぶん くらい
  const cut = p.bottom - level;
  const keep = [];
  for (const k of inPot) {
    if (k.y < cut) {
      const side = k.x < p.x ? -1 : 1;
      flying.push({ x: k.x, y: k.y, vx: side * rand(120, 380), vy: -rand(80, 320), rot: k.rot, vr: rand(-12, 12), s: k.s, spill: true });
    } else keep.push(k);
  }
  inPot = keep;
  heap = heap.map(h => Math.min(h, level));
  shake = 2;
  Sfx.noise(1.2, 0.5, 2500, 0, 'bandpass'); // ざざーっ
  Sfx.yay();
  popText('あふれた〜！', p.x, p.y - 160, '#ff3b3b', 64);
}

let lastT = performance.now();
(function loop(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now;
  const W = innerWidth, H = innerHeight, p = pot();
  shake *= Math.pow(0.01, dt);
  const sx = Math.sin(now / 25) * shake * 6;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // ゆかに おちた つぶ（しばらくして きえる）
  for (const k of floor) {
    k.t += dt;
    ctx.globalAlpha = Math.max(0, Math.min(1, (5 - k.t)));
    drawK(k.x, k.y, k.s, k.rot);
  }
  ctx.globalAlpha = 1;
  floor = floor.filter(k => k.t < 5);
  if (floor.length > 200) floor.splice(0, floor.length - 200);

  // ガラスの なべ（なかが みえる）
  ctx.save(); ctx.translate(p.x + sx, p.y);
  ctx.fillStyle = '#444'; ctx.fillRect(-p.w / 2 - 34, 24, 34, 18); ctx.fillRect(p.w / 2, 24, 34, 18);
  ctx.fillStyle = 'rgba(255,248,225,0.85)'; ctx.beginPath(); ctx.roundRect(-p.w / 2, 0, p.w, p.h, [0, 0, 34, 34]); ctx.fill();
  ctx.restore();
  // なかの ポップコーン
  for (const k of inPot) drawK(k.x + sx, k.y, k.s, k.rot);
  ctx.save(); ctx.translate(p.x + sx, p.y);
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 8; ctx.beginPath(); ctx.roundRect(-p.w / 2, 0, p.w, p.h, [0, 0, 34, 34]); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-p.w / 2 + 18, 18, 14, p.h - 44); // ガラスの ひかり
  ctx.fillStyle = '#c0392b'; ctx.fillRect(-p.w / 2 - 8, -6, p.w + 16, 12); // ふち
  ctx.restore();
  // ひ
  for (let i = 0; i < 5; i++) drawEmoji(ctx, '🔥', p.x - 80 + i * 40 + Math.sin(now / 90 + i) * 3, p.bottom + 26, 36 + shake * 6);

  // とんでいる つぶ（いちばん てまえ）
  for (const f of flying) {
    f.vy += 1500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
    if (f.x < 15) { f.x = 15; f.vx = Math.abs(f.vx) * 0.5; }
    if (f.x > W - 15) { f.x = W - 15; f.vx = -Math.abs(f.vx) * 0.5; }
    if (f.vy > 0) {
      const inside = Math.abs(f.x - p.x) < p.w / 2 - 14;
      if (inside && !f.spill) {
        const c = Math.max(0, Math.min(heap.length - 1, colOf(p, f.x)));
        if (f.y >= p.bottom - heap[c] - f.s * 0.3) { f.done = true; settle(f, p); continue; }
      } else if (f.y >= H - 14 - rand(0, 30)) { // ゆかに おちた
        f.done = true; floor.push({ x: f.x, y: f.y, s: f.s, rot: f.rot, t: 0 }); continue;
      }
    }
    drawK(f.x, f.y, f.s, f.rot);
  }
  flying = flying.filter(f => !f.done);
  if (flying.length > 400) flying.splice(0, flying.length - 400);
  requestAnimationFrame(loop);
})(lastT);
</script>
</body>
</html>
