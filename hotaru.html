<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>ほたる</title>
<link rel="stylesheet" href="common.css?v=23">
<style>
  body { background: linear-gradient(#030716, #0b1a3a 55%, #0d2a2a 80%, #071a12); }
  .moon { position: fixed; right: 9%; top: 8%; width: 90px; height: 90px; border-radius: 50%; background: #fff6d0;
          box-shadow: 0 0 60px 20px rgba(255,240,180,.25); pointer-events: none; }
  .grass { position: fixed; left: 0; right: 0; bottom: 0; height: 22%; pointer-events: none;
           background: radial-gradient(ellipse 60px 120px at 20px 100%, #06150c 60%, transparent 62%) 0 0 / 70px 100% repeat-x,
                       radial-gradient(ellipse 50px 90px at 50px 100%, #0a2214 60%, transparent 62%) 0 0 / 90px 100% repeat-x; }
  canvas.full { touch-action: none; }
  .big-btn { --c1: #b7e34a; --c2: #6e9420; }
</style>
</head>
<body>
<div class="moon"></div>
<div class="grass"></div>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🌟</span></button></div>
<script src="common.js?v=19"></script>
<script src="gpu-particles.js?v=3"></script>
<script>
// ほたる: てんめつする ひかりが たくさん。おすと いっせいに とびたつ。ゆびを おくと あつまってくる
const cv = document.getElementById('cv'), btn = document.getElementById('btn');
const fingers = new Map();
let combo = 0, lastPress = 0, hue = 0.22;
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];

function color(rainbow) {
  return rainbow ? GPUParticles.hsv(Math.random(), 0.7, 1) : [0.75 + rand(-0.1, 0.1), 1, 0.3 + rand(-0.1, 0.15)];
}

(async () => {
  const sys = await GPUParticles.create(cv, { count: 40000 });
  sys.params.drag = 0.55; sys.params.turb = 45; sys.params.grav = [0, -6];

  // さいしょから とんでいる ほたる
  const amb = [];
  for (let i = 0; i < 900; i++) amb.push({ x: rand(0, innerWidth), y: rand(innerHeight * 0.3, innerHeight), vx: rand(-20, 20), vy: rand(-20, 20),
    ...rgb(color(false)), life: rand(8, 22), size: rand(6, 11), shape: 1 });
  sys.emit(amb);

  btn.addEventListener('pointerdown', () => {
    const now = performance.now();
    combo = now - lastPress < 450 ? combo + 1 : 0; lastPress = now;
    const r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const n = 250 + Math.min(combo, 12) * 60, rainbow = combo >= 4;
    const list = [];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + rand(-1.3, 1.3), sp = rand(150, 650) * (1 + Math.min(combo, 10) * 0.08);
      list.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, ...rgb(color(rainbow)), life: rand(6, 14), size: rand(7, 13) + Math.min(combo, 8), shape: combo >= 8 && Math.random() < 0.3 ? 3 : 1 });
    }
    sys.emit(list);
    // ちりりん
    const k = Math.min(combo, PENTA.length - 1);
    Sfx.tone(PENTA[k], 0.6, 'sine', 0.15); Sfx.tone(PENTA[k] * 2, 0.4, 'sine', 0.05, 0.05);
  });

  // ゆびに あつまる（なんぼんでも）
  cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); fingers.set(e.pointerId, { x: e.clientX, y: e.clientY }); Sfx.tone(pick(PENTA), 0.4, 'sine', 0.08); });
  cv.addEventListener('pointermove', (e) => { const f = fingers.get(e.pointerId); if (f) { f.x = e.clientX; f.y = e.clientY; } });
  for (const t of ['pointerup', 'pointercancel']) cv.addEventListener(t, (e) => fingers.delete(e.pointerId));

  let spawn = 0;
  sys.start((dt) => {
    sys.attractors = [...fingers.values()].map(f => ({ x: f.x, y: f.y, s: 1600, swirl: 700 }));
    // くさむらから すこしずつ うまれる
    spawn += dt * 70;
    const list = [];
    while (spawn > 1) { spawn--; list.push({ x: rand(0, innerWidth), y: rand(innerHeight * 0.75, innerHeight), vx: rand(-15, 15), vy: rand(-40, -10), ...rgb(color(false)), life: rand(10, 20), size: rand(6, 10), shape: 1 }); }
    if (list.length) sys.emit(list);
  });
})();
function rgb([r, g, b]) { return { r, g, b }; }
</script>
</body>
</html>
