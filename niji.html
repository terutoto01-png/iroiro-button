<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>にじ</title>
<link rel="stylesheet" href="common.css?v=11">
<style>
  body { background: #140f33; }
  .big-btn { --c1: #7b5cff; --c2: #4b2fc4; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🌈</span></button></div>
<script src="common.js?v=11"></script>
<script>
// にじの波紋: WebGPU のフラグメントシェーダー
const MAX = 16;
const canvas = document.getElementById('cv');
const btn = document.getElementById('btn');
const ripples = new Float32Array(MAX * 4); // x, y, start, hue
let rIdx = 0, gpu, dpr = 1;
const t0 = performance.now();
const now = () => (performance.now() - t0) / 1000;

const SHADER = /* wgsl */`
struct U { res: vec2f, time: f32, pad: f32, rip: array<vec4f, ${MAX}> };
@group(0) @binding(0) var<uniform> u: U;

@vertex
fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  var p = array<vec2f, 3>(vec2f(-1.0, -3.0), vec2f(-1.0, 1.0), vec2f(3.0, 1.0));
  return vec4f(p[i], 0.0, 1.0);
}

fn hsv(h: f32, s: f32, v: f32) -> vec3f {
  let k = vec3f(1.0, 2.0 / 3.0, 1.0 / 3.0);
  let p = abs(fract(vec3f(h) + k) * 6.0 - 3.0);
  return v * mix(vec3f(1.0), clamp(p - 1.0, vec3f(0.0), vec3f(1.0)), s);
}

@fragment
fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let uv = fc.xy / u.res;
  // ゆっくり動くそら
  var col = mix(vec3f(0.08, 0.06, 0.2), vec3f(0.18, 0.1, 0.32), uv.y + 0.1 * sin(u.time * 0.5 + uv.x * 3.0));
  let width = u.res.y * 0.22;
  for (var i = 0; i < ${MAX}; i++) {
    let r = u.rip[i];
    let age = u.time - r.z;
    if (r.z <= 0.0 || age < 0.0 || age > 4.0) { continue; }
    let d = distance(fc.xy, r.xy);
    let rad = age * u.res.y * 0.5;
    let t = (rad - d) / width;
    let fade = 1.0 - age / 4.0;
    if (t > 0.0 && t < 1.0) {
      let wob = 0.03 * sin(atan2(fc.y - r.y, fc.x - r.x) * 8.0 + u.time * 4.0);
      let c = hsv(r.w + t * 0.85 + wob, 0.75, 1.0);
      col = mix(col, c, sin(t * 3.14159) * fade * 0.9);
    }
    // まんなかの きらきら
    let glow = exp(-d / (40.0 + age * 200.0)) * fade * 0.4;
    col = col + vec3f(glow);
  }
  // ほし
  let g = floor(fc.xy / 6.0);
  let h = fract(sin(dot(g, vec2f(12.9898, 78.233))) * 43758.5453);
  if (h > 0.997) { col = col + vec3f(0.5 + 0.5 * sin(u.time * 3.0 + h * 100.0)); }
  return vec4f(col, 1.0);
}`;

function addRipple(x, y) {
  const o = rIdx * 4;
  ripples[o] = x * dpr; ripples[o+1] = y * dpr; ripples[o+2] = now(); ripples[o+3] = Math.random();
  rIdx = (rIdx + 1) % MAX;
  const base = pick([261.6, 293.7, 329.6, 392, 440]);
  [0, 4, 7, 12].forEach((s, i) => Sfx.tone(base * Math.pow(2, s / 12), 0.6, 'sine', 0.15, i * 0.06));
}

btn.addEventListener('pointerdown', () => {
  const r = btn.getBoundingClientRect();
  addRipple(r.left + r.width / 2, r.top + r.height / 2);
  btn.style.setProperty('--c1', `hsl(${Math.random() * 360}, 90%, 62%)`);
  btn.style.setProperty('--c2', `hsl(${Math.random() * 360}, 70%, 40%)`);
});
canvas.addEventListener('pointerdown', (e) => addRipple(e.clientX, e.clientY));

(async () => {
  gpu = await initWebGPU(canvas);
  const { device, ctx, format } = gpu;
  const mod = device.createShaderModule({ code: SHADER });
  const pipe = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: mod, entryPoint: 'vs' },
    fragment: { module: mod, entryPoint: 'fs', targets: [{ format }] },
  });
  const ubuf = device.createBuffer({ size: 16 + MAX * 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });
  const resize = () => { dpr = fitCanvas(canvas); };
  resize(); addEventListener('resize', resize);
  const u = new Float32Array(4 + MAX * 4);
  const loop = () => {
    u[0] = canvas.width; u[1] = canvas.height; u[2] = now();
    u.set(ripples, 4);
    device.queue.writeBuffer(ubuf, 0, u);
    const enc = device.createCommandEncoder();
    const p = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store' }] });
    p.setPipeline(pipe); p.setBindGroup(0, bg); p.draw(3); p.end();
    device.queue.submit([enc.finish()]);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
