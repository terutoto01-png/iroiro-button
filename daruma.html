<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>だるまさんがころんだ</title>
<link rel="stylesheet" href="common.css?v=23">
<style>
  body { background: linear-gradient(#9ee0ff, #d4f3ff 30%, #8fd36a 30%, #6fbf4d); }
  .big-btn { --c1: #ff7b54; --c2: #b84a26; }
  .bottom-center .big-btn { width: min(30vw, 150px); height: min(30vw, 150px); }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">👣</span></button></div>
<script src="common.js?v=20"></script>
<script src="multi.js?v=11"></script>
<script>
// だるまさんがころんだ（タッチする がわ）: ボタンを おしている あいだ まえに すすむ。
// おにが「だるまさんが ころんだ」と いいおわって ふりむいた とき うごいていたら スタートに もどる。おにに とどいたら タッチ！
// 家族部屋で 2人の とき: 子は いままで どおり 👣 で すすむ。親は おに（🙈 を ながおし で「だるまさんが…」、はなすと「ころんだ！」で ふりむく）。
//   うごいたか の はんていと すすみぐあいは 子の がめんが きめて 親へ おくる。おにの うごきは 親の がめんが きめて 子へ おくる。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx);
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); });
const WORDS = ['だ', 'る', 'ま', 'さ', 'ん', 'が', 'こ', 'ろ', 'ん', 'だ'];
const PITCH = [523, 523, 587, 523, 494, 440, 523, 587, 659, 523];
const RUNNERS = ['🐰', '🐥', '🐶', '🐱', '🐻', '🐸'];
let lookDur = 2, prog = 0, holding = false, walkT = 0, state = 'chant', st = 0, wi = 0, wordT = 0, speed = 1, round = 0, back = 0, runner = pick(RUNNERS), win = 0, sparks = [], said = [];
let role = 'solo';           // 'solo' | 'ko'（はしる） | 'oya'（おに）
let oniHold = false;         // おにの ボタン（親の ゆび）
const remote = { prog: 0, moving: false }; // 親の がめんで みる 子の ようす
const duo = () => role !== 'solo';

function newChant() {
  state = 'chant'; st = 0; wi = 0; wordT = 0; said = [];
  // はやさを まいかい かえる（さいごだけ はやい ことも）
  speed = rand(0.8, 1.25) + round * 0.08;
}
// 2人の とき: おには さいしょ こちらを みている。親が おすと うしろを むいて となえはじめる
function oniWatch() { state = 'look'; st = 0; said = []; wi = 0; }
function resetRound() { prog = 0; back = 0; win = 0; remote.prog = 0; remote.moving = false; if (duo()) oniWatch(); else newChant(); }
newChant();

// おにの ボタン（親）: おす → だるまさんが…（おしている あいだ すすむ）/ はなす → ころんだ！
function oniPress(on) {
  if (on === oniHold) return;
  oniHold = on;
  if (on) {
    if (win || state === 'chant' || state === 'koro') return;
    state = 'chant'; st = 0; wi = 0; wordT = 0; said = []; speed = 1;
  } else if (state === 'chant') {
    state = 'koro'; st = 0; wordT = 1; if (wi < 6) wi = 6; // のこりは「ころんだ」だけ
  }
}
const press = (on) => {
  if (role === 'oya') {
    if (on === oniHold) return;
    oniPress(on);
    Multi.send({ a: 'g', i: on ? 1 : 0 }, 0);
  } else holding = on;
};
btn.addEventListener('pointerdown', () => press(true));
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) btn.addEventListener(ev, () => press(false));

function setBtn() { btn.querySelector('.emoji').textContent = role === 'oya' ? '🙈' : '👣'; }
Multi.duo('daruma', {
  onRole(r) {
    if (r === role) return;
    role = r; holding = false; oniHold = false; setBtn(); resetRound();
  },
  onMsg(m) {
    if (m.a !== 'g') return;
    if (role === 'ko') {
      if (m.i === 1) oniPress(true);
      else if (m.i === 0) oniPress(false);
    } else if (role === 'oya') {
      if (m.i === 2) { remote.prog = m.x ?? 0; remote.moving = !!m.k; if (typeof m.s === 'number' && RUNNERS[m.s]) runner = RUNNERS[m.s]; }
      else if (m.i === 3) caught();
      else if (m.i === 4) touched();
    }
  },
});

const L = () => {
  const W = innerWidth, H = innerHeight, bTop = btn.getBoundingClientRect().top;
  const size = Math.min(W * 0.2, 100);
  return { W, H, oniY: Math.max(H * 0.22, 100 + size * 1.1), startY: bTop - 60, size }; // ことばが 🏠 と 🔊 に かからない たかさ
};
function caught() {
  const { W, oniY, size } = L();
  state = 'caught'; st = 0; back = 1;
  Sfx.tone(300, 0.4, 'sawtooth', 0.12, 0, 120);
  popText('うごいた〜！', W / 2, oniY + size, '#ff4d4d', 52);
}
function touched() {
  if (win) return;
  const { W, oniY, size } = L();
  win = 0.001; round++;
  Sfx.yay(); setTimeout(() => Sfx.chime(), 300);
  popText('タッチ！', W / 2, oniY + size * 1.3, '#ffeb3b', 70);
  for (let i = 0; i < 90; i++) { const a = rand(0, 7), v = rand(100, 450); sparks.push({ x: W / 2, y: oniY, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.6, 1.2), hue: rand(0, 360) }); }
}
function say(i) { said.push({ w: WORDS[i], t: 0 }); Sfx.tone(PITCH[i], 0.16, 'triangle', 0.14); }
function turnAround() { state = 'look'; st = 0; lookDur = rand(1.5, 2.5); Sfx.tone(880, 0.15, 'square', 0.08); Sfx.tone(1175, 0.2, 'square', 0.08, 0.08); }

let last = performance.now(), sentAt = 0, sentKey = '';
(function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  const t = now / 1000, { W, H, oniY, startY, size } = L();
  const moving = role === 'oya' ? remote.moving && !back && !win : holding && !back && !win;
  if (role === 'oya') { prog += (remote.prog - prog) * Math.min(1, dt * 12); if (moving) walkT += dt; }
  else if (moving) { prog = Math.min(1, prog + dt * 0.11); walkT += dt; }

  // おに
  if (!win) {
    st += dt;
    if (state === 'chant') {
      wordT += dt * speed;
      const step = wi >= 6 ? 0.22 : 0.34; // 「ころんだ」は すこし はやい
      if (wordT > step) {
        if (!duo()) {
          wordT = 0;
          if (wi < WORDS.length) { say(wi); wi++; }
          else turnAround();
        } else if (wi < 6) { wordT = 0; say(wi); wi++; } // 2人: 「が」で まって、はなすのを まつ
      }
    } else if (state === 'koro') {
      wordT += dt;
      if (wordT > 0.13) {
        wordT = 0;
        if (wi < WORDS.length) { say(wi); wi++; }
        else turnAround();
      }
    } else if (state === 'look') {
      // うごいた か は はしる がわ（ひとり / 子）の がめんで きめる。2人で さいしょに みている ときは とがめない
      if (role !== 'oya' && st > 0.35 && moving && (!duo() || said.length > 0)) {
        caught();
        if (role === 'ko') Multi.send({ a: 'g', i: 3 }, 0);
      } else if (!duo() && st > lookDur) newChant();
    } else if (state === 'caught') {
      if (st > 1.4) { if (duo()) { state = 'look'; st = 0.4; said = []; } else newChant(); }
    }
  }
  if (back && role !== 'oya') { prog = Math.max(0, prog - dt * 0.9); if (prog <= 0) back = 0; }
  if (back && role === 'oya' && prog < 0.01) back = 0;
  // とどいた → タッチ！
  if (prog >= 1 && !win && role !== 'oya') {
    touched();
    if (role === 'ko') Multi.send({ a: 'g', i: 4 }, 0);
  }
  if (win) { win += dt; if (win > 2.6) { if (role !== 'oya') runner = pick(RUNNERS); resetRound(); } }
  // 子: すすみぐあいを 親へ（かわった とき、と ときどき）
  if (role === 'ko') {
    const key = (moving ? 1 : 0) + ':' + Math.round(prog * 200);
    if ((key !== sentKey && now - sentAt > 90) || now - sentAt > 1000) {
      sentKey = key; sentAt = now;
      Multi.send({ a: 'g', i: 2, x: prog, k: moving ? 1 : 0, s: RUNNERS.indexOf(runner) }, 0);
    }
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // みち
  ctx.fillStyle = 'rgba(230,200,140,.6)'; ctx.beginPath(); ctx.moveTo(W / 2 - size * 0.7, oniY + size * 0.5); ctx.lineTo(W / 2 + size * 0.7, oniY + size * 0.5); ctx.lineTo(W / 2 + size * 1.8, H); ctx.lineTo(W / 2 - size * 1.8, H); ctx.fill();
  // スタートの せん
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.setLineDash([16, 12]); ctx.beginPath(); ctx.moveTo(W * 0.15, startY + size * 0.5); ctx.lineTo(W * 0.85, startY + size * 0.5); ctx.stroke(); ctx.setLineDash([]);
  // き と おに
  drawEmoji(ctx, '🌳', W / 2, oniY - size * 0.35, size * 1.8);
  const looking = state === 'look' || state === 'caught';
  const oni = win ? '🙊' : looking ? '🐵' : '🙈';
  const os = looking ? 1.1 : 1;
  drawEmoji(ctx, oni, W / 2, oniY + size * 0.2, size * os);
  if (looking && !win) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 10); drawEmoji(ctx, '👀', W / 2 + size * 0.8, oniY - size * 0.3, size * 0.5); ctx.globalAlpha = 1; }
  // いった ことば
  said.forEach((s, i) => {
    s.t += dt;
    const x = W / 2 + (i - (WORDS.length - 1) / 2) * Math.min(32, (W - 30) / WORDS.length), y = oniY - size * 1.05;
    ctx.globalAlpha = state === 'chant' || state === 'koro' ? 1 : Math.max(0, 1 - st * 2);
    ctx.font = `bold ${Math.min(28, (W - 30) / WORDS.length)}px sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 4;
    const yy = y - Math.max(0, 1 - s.t * 5) * 10;
    ctx.strokeText(s.w, x, yy); ctx.fillText(s.w, x, yy);
  });
  ctx.globalAlpha = 1;
  // はしる こ（とおくに いくほど ちいさく）
  const ry = startY + (oniY + size * 1.1 - startY) * prog, rs = size * (1 - prog * 0.35);
  const bob = moving ? Math.abs(Math.sin(walkT * 10)) * 8 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(W / 2, ry + rs * 0.45, rs * 0.4, rs * 0.12, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(W / 2, ry - bob);
  if (back) ctx.rotate(Math.sin(t * 20) * 0.4);
  drawEmoji(ctx, runner, 0, 0, rs); ctx.restore();
  if (looking && !moving && !back && !win && prog > 0) { ctx.globalAlpha = 0.8; drawEmoji(ctx, '🤫', W / 2 + rs * 0.7, ry - rs * 0.5, rs * 0.45); ctx.globalAlpha = 1; }
  for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 300 * dt; s.life -= dt; ctx.fillStyle = `hsla(${s.hue}, 100%, 60%, ${Math.max(0, s.life)})`; ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 7); ctx.fill(); }
  sparks = sparks.filter(s => s.life > 0);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
