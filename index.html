<style>
  /* がめん ぜんたいで スクロールする（body の なかだけで スクロールさせない） */
  html { overflow: auto; height: auto; }
  body { overflow: visible; height: auto; background: #eef6f4; min-height: 100%; padding-top: env(safe-area-inset-top); }
  /* はいけいは がめんに こていする（iPad でも うごかないように ::before で） */
  body::before { content: ''; position: fixed; inset: 0; z-index: -1;
                 background: linear-gradient(135deg, #ffe7f3, #e2f3ff 55%, #e9ffe2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(28vw, 140px), 1fr));
          gap: min(5vw, 32px); padding: min(6vw, 40px); padding-bottom: 150px; max-width: 1100px; margin: 0 auto; }
  /* したの はしを ふんわり ぼかす */
  #fade { position: fixed; left: 0; right: 0; bottom: 0; height: 140px; z-index: 20; pointer-events: none;
          background: linear-gradient(rgba(236,250,240,0), rgba(236,250,240,.95) 75%); transition: opacity .3s; }
  /* はねる やじるし ボタン */
  #more { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom) + 8px); z-index: 30; width: 84px; height: 84px; margin-left: -42px;
          --c1: #ff9f1c; --c2: #c47200; font-size: 40px; animation: hop 1.1s ease-in-out infinite; transition: opacity .3s; }
  #more:active { animation: none; }
  #more.top { --c1: #29b6f6; --c2: #0277bd; animation: none; }
  @keyframes hop { 0%, 100% { translate: 0 0; } 45% { translate: 0 -14px; } 60% { translate: 0 0; } 75% { translate: 0 -5px; } }
  .hide { opacity: 0; pointer-events: none; }
  .grid a { aspect-ratio: 1; width: 100%; height: auto; font-size: min(9vw, 44px); text-decoration: none; margin-bottom: 12px; }
  .grid a:nth-child(odd)  { animation: bob 2.4s ease-in-out infinite; }
  .grid a:nth-child(even) { animation: bob 2.4s ease-in-out -1.2s infinite; }
  .grid a:active { animation: none; }
  @keyframes bob { 50% { translate: 0 -6px; } }
  /* なかまの みだし（えもじ だけ。もじは つかわない） */
  .sec-h { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin: 10px 0 -6px; scroll-margin-top: 16px; }
  .sec-h:first-child { margin-top: 0; }
  .sec-h b { font-size: min(10vw, 46px); line-height: 1; padding: 8px 18px; border-radius: 999px; background: var(--bg); box-shadow: 0 4px 0 var(--bd); }
  .sec-h i { flex: 1; height: 6px; border-radius: 3px; background: var(--bd); opacity: .55; }
  /* みぎはしの ジャンプ ボタン */
  #jump { position: fixed; right: max(8px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); z-index: 40;
          display: flex; flex-direction: column; gap: 8px; }
  #jump button { width: min(12vw, 54px); height: min(12vw, 54px); border-radius: 50%; border: none; padding: 0; cursor: pointer;
                 font-size: min(6vw, 28px); background: var(--bg); box-shadow: 0 4px 0 var(--bd); transition: scale .2s; font-family: inherit; }
  #jump button.on { scale: 1.18; box-shadow: 0 4px 0 var(--bd), 0 0 0 4px #fff; }
  #jump button:active { translate: 0 3px; box-shadow: 0 1px 0 var(--bd); }
  .grid { padding-right: calc(min(12vw, 54px) + 22px) !important; }
  /* まだ ひらいていない ボタン: かどで ✨ が きらきら */
  .grid a.new::after { content: '✨'; position: absolute; right: -10%; top: -10%; font-size: .9em; pointer-events: none;
                       animation: twinkle 1.4s ease-in-out infinite; filter: drop-shadow(0 0 6px #fff6a8); }
  /* いちばん うえの ゆうえんち モード ボタン 🎡 */
  .grid button.park-go { grid-column: 1 / -1; width: 100%; aspect-ratio: auto; height: min(30vw, 150px); border-radius: 999px;
                         margin-bottom: 12px; font-size: min(10vw, 50px); --c1: #48d684; --c2: #228e54;
                         background: radial-gradient(circle at 28% 24%, rgba(255,255,255,.55) 0 10%, transparent 11%),
                                     linear-gradient(100deg, #56de82, #3ec9f2 52%, #ff84be);
                         background-size: 100% 100%, 240% 100%; animation: parkGlow 5s ease-in-out infinite alternate, bob 2.4s ease-in-out infinite !important; }
  .grid button.park-go .park-icons { display: inline-flex; align-items: center; justify-content: center; gap: .36em; pointer-events: none; }
  .grid button.park-go .park-icons i { font-style: normal; font-size: 1.15em; filter: drop-shadow(0 3px 0 rgba(0,0,0,.16)); }
  .grid button.park-go .park-icons .emoji { font-size: 1.65em; }
  @keyframes parkGlow { 0% { background-position: 0 0, 0% 50%; } 100% { background-position: 0 0, 100% 50%; } }
  @keyframes twinkle { 0%, 100% { scale: .8; rotate: -10deg; opacity: .75; } 50% { scale: 1.15; rotate: 12deg; opacity: 1; } }

  /* ---- いれもの（シェル）: ボタンの ページは この うえの iframe で ひらく ---- */
  iframe.page { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 1000; background: transparent;
                opacity: 0; pointer-events: none; transition: opacity .15s; }
  iframe.page.shown { opacity: 1; pointer-events: auto; }
  /* ページを ひらいている あいだ、したの メニューは みえなくして うごきも とめる（スクロールの いちは そのまま） */
  html.playing #grid, html.playing #jump, html.playing #more, html.playing #fade, html.playing body > .vol { visibility: hidden; }
  html.playing .grid a, html.playing #more { animation-play-state: paused !important; }
  html.playing .grid a::after { animation: none !important; }
  #insets-probe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
                  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* ---- なかまに つれていかれる とき（なかまの どうぶつが ボタンに のって、いっしょに いく） ---- */
  #follow { position: fixed; inset: 0; z-index: 1020; display: grid; place-items: center; pointer-events: auto; touch-action: none;
            background: rgba(255,255,255,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            animation: fol-in .2s ease-out both; }
  #follow.out { animation: fol-out .25s ease-in both; pointer-events: none; }
  #follow .big-btn { position: relative; width: min(46vw, 230px); height: min(46vw, 230px); font-size: min(22vw, 110px);
                     animation: fol-btn .9s cubic-bezier(.3,1.5,.5,1) both; }
  #follow .rider { position: absolute; left: 50%; top: -6%; font-size: min(14vw, 70px); line-height: 1; translate: -50% 0;
                   animation: fol-ride .9s ease-out both; filter: drop-shadow(0 4px 0 rgba(0,0,0,.18)); }
  #follow .ring { position: absolute; inset: -14px; border-radius: 50%; border: 6px solid var(--c, #fff); animation: fol-ring .9s ease-out .35s both; }
  @keyframes fol-in  { from { opacity: 0; } }
  @keyframes fol-out { to { opacity: 0; } }
  @keyframes fol-btn { 0% { scale: .2; } 60% { scale: 1; } 85% { scale: 1.06; } 100% { scale: 1.12; } }
  @keyframes fol-ride { 0% { translate: -50% -260%; opacity: 0; } 30% { opacity: 1; } 55% { translate: -50% 0; } 68% { translate: -50% -28%; } 80%, 100% { translate: -50% 0; } }
  @keyframes fol-ring { from { opacity: .9; scale: .9; } to { opacity: 0; scale: 1.6; } }

  /* ---- メニューで なかまが どこに いるか ---- */
  .peer-badge { position: absolute; left: -10%; top: -12%; font-size: .5em; line-height: 1; padding: .12em; border-radius: 50%;
                background: #fff; box-shadow: 0 0 0 3px var(--c, #fff), 0 3px 0 rgba(0,0,0,.18); pointer-events: none;
                animation: badge-in .35s cubic-bezier(.3,1.6,.5,1) both; }
  .peer-badge + .peer-badge { left: 22%; }
  @keyframes badge-in { from { scale: 0; } }
  #jump button { position: relative; }
  .peer-sec { position: absolute; right: calc(100% + 4px); top: 50%; translate: 0 -50%; font-size: .8em; line-height: 1; pointer-events: none;
              animation: badge-in .35s cubic-bezier(.3,1.6,.5,1) both; }
  .peer-sec + .peer-sec { right: calc(100% + 1.1em); }
  .peer-look { position: fixed; z-index: 60; pointer-events: none; font-size: 40px; line-height: 1; translate: -50% -50%;
               animation: look-pop 1s ease-out both; }
  @keyframes look-pop { 0% { opacity: 0; scale: .3; } 25% { opacity: 1; scale: 1.15; } 70% { opacity: 1; scale: 1; } 100% { opacity: 0; scale: .9; translate: -50% -90%; } }

// ---- いれもの（シェル）の まどぐち。iframe の なかの ページ（common.js / multi.js）が つかう ----
window.IroShell = {
  multi: null,                                  // multi.js を よんだら いれる
  audio: () => Sfx.ac(),                        // おとは シェルの AudioContext を かす
  home: () => Shell.open('', { announce: true }),
  unlocked() {},
  seed: () => Shell.seed,                       // この ページの らんすうの たね（グループ部屋のみ）
  frameStart: (w) => Shell.frameStart(w),
  insets() {
    const cs = getComputedStyle(document.getElementById('insets-probe'));
    return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  },
};
</script>

// ---- こども むけの「おした」はんてい ----
// リンクの click は ゆびが すこし うごくだけで とりけされる。はなした ときに ボタンの ちかくで、
// うごきが ちいさければ「おした」に する（おおきく うごいたら スクロール なので なにも しない）
function onTap(el, fn) {
  let st = null;
  el.addEventListener('pointerdown', (e) => { st = { x: e.clientX, y: e.clientY, sy: scrollY, id: e.pointerId }; });
  addEventListener('pointerup', (e) => {
    if (!st || e.pointerId !== st.id) return;
    const moved = Math.hypot(e.clientX - st.x, e.clientY - st.y) + Math.abs(scrollY - st.sy); st = null;
    const r = el.getBoundingClientRect(), m = 16;
    if (moved < 28 && e.clientX > r.left - m && e.clientX < r.right + m && e.clientY > r.top - m && e.clientY < r.bottom + m) fn(e);
  }, true);
  addEventListener('pointercancel', () => { st = null; }, true);
  el.addEventListener('click', (e) => e.preventDefault()); // ふつうの click では うごかさない（にじゅう ぼうし）
}

// いちばん うえ: ゆうえんち モードへ うつる ボタン
const parkBtn = document.createElement('button');
parkBtn.type = 'button';
parkBtn.className = 'big-btn park-go';
parkBtn.setAttribute('aria-label', 'ゆうえんち');
parkBtn.innerHTML = '<span class="park-icons"><i>🚂</i><span class="emoji">🎡</span><i>🏰</i></span>';
parkBtn.addEventListener('pointerdown', () => Sfx.pop());
onTap(parkBtn, () => {
  try { Sfx.tone(523, 0.14, 'triangle', 0.2, 0, 784); Sfx.tone(784, 0.2, 'sine', 0.16, 0.12, 1047); } catch (e) {}
  setMode('park');
});
grid.appendChild(parkBtn);

// うごかないと わかっているボタンは ださない。なかま ごとに みだしを つけて ならべる
const byFile = Object.fromEntries(PAGES.map(p => [p[0], p]));
const placed = new Set(GROUPS.flatMap(g => g.items));
GROUPS[GROUPS.length - 1].items.push(...PAGES.map(p => p[0]).filter(f => !placed.has(f)));
const heads = [];
GROUPS.forEach((g, gi) => {
  const list = g.items.map(f => byFile[f]).filter(p => p && !(p[4] && !can[p[4]]));
  if (!list.length) return;
  const h = document.createElement('div');
  h.className = 'sec-h'; h.style.setProperty('--bg', g.bg); h.style.setProperty('--bd', g.bd);
  h.innerHTML = `<b>${g.e}</b><i></i>`;
  grid.appendChild(h); heads.push(h);
  const j = document.createElement('button');
  j.textContent = g.e; j.dataset.gi = gi; j.style.setProperty('--bg', g.bg); j.style.setProperty('--bd', g.bd);
  onTap(j, () => {
    Sfx.pop();
    if (isPark()) Park.warp(gi);
    else glideTo(h.getBoundingClientRect().top + scrollY - 16);
  });
  jump.appendChild(j);
  for (const [file, emoji, c1, c2] of list) {
    const a = document.createElement('a');
    a.href = file + '.html';
    a.className = 'big-btn';
    a.style.setProperty('--c1', c1); a.style.setProperty('--c2', c2);
    a.innerHTML = `<span class="emoji">${emoji}</span>`;
    a.addEventListener('pointerdown', () => { Sfx.pop(); Shell.look(file); });
    onTap(a, () => { saveScroll(); Shell.open(file, { announce: true }); });
    if (!seen.has(file)) a.classList.add('new');
    grid.appendChild(a);
    Shell.pages.set(file, { emoji, c1, c2, el: a, pel: null });
  }
});
// いま みている なかまの ジャンプ ボタンを すこし おおきく
function markJump() {
  if (isPark()) return;
  let cur = 0;
  heads.forEach((h, i) => { if (h.getBoundingClientRect().top < innerHeight * 0.4) cur = i; });
  [...jump.children].forEach((b, i) => b.classList.toggle('on', i === cur));
  Shell.sec(cur);
}
addEventListener('scroll', markJump, { passive: true });
markJump();
// まえに みていた ところへ もどす（ボタンを ならべてから）
try {
  const y = parseFloat(sessionStorage.getItem('menu-scroll'));
  if (y > 0) scrollTo(0, y);
} catch (e) {}
updateMore();
Shell.markSeen = (file) => {
  if (!seen.has(file)) { seen.add(file); saveSeen(); }
  const p = Shell.pages.get(file);
  if (p) { if (p.el) p.el.classList.remove('new'); if (p.pel) p.pel.classList.remove('new'); }
};
// ゆうえんち モード の じゅんび
Park.init({ can, seen, groups: GROUPS, byFile, Shell, Multi, Sfx, onTap, onExit: () => setMode('grid') });
const qsMode = new URLSearchParams(location.search).get('mode');
let initMode = 'grid';
try { initMode = qsMode === 'park' || qsMode === 'grid' ? qsMode : (localStorage.getItem('iroiro-mode') === 'park' ? 'park' : 'grid'); } catch (e) {}
if (initMode === 'park') setMode('park', { save: !!qsMode });
// ページを ちょくせつ ひらいて きた とき（hanabi.html → index.html#/hanabi）は そのページを ひらく
const start = (location.hash.match(/^#\/([a-z]+)$/) || [])[1];
history.replaceState({ p: '' }, '', location.pathname + location.search);
Shell.ready(start && Shell.pages.has(start) ? start : '');
})();

// ---- ホームの モード きりかえ（ふつう / ゆうえんち） ----
const isPark = () => document.documentElement.classList.contains('park');
function setMode(mode, { save = true } = {}) {
  const toPark = mode === 'park';
  if (toPark === isPark()) return;
  if (toPark) {
    saveScroll();
    document.documentElement.classList.add('park');
    Park.activate();
  } else {
    Park.deactivate();
    document.documentElement.classList.remove('park');
    try { const y = parseFloat(sessionStorage.getItem('menu-scroll')); scrollTo(0, y > 0 ? y : 0); } catch (e) {}
    updateMore();
    markJumpNow();
  }
  Shell.refreshPresence();
  if (save) try { localStorage.setItem('iroiro-mode', toPark ? 'park' : 'grid'); } catch (e) {}
}
window.setHomeMode = setMode;
function markJumpNow() {
  const hs = [...document.querySelectorAll('#grid .sec-h')];
  let cur = 0;
  hs.forEach((h, i) => { if (h.getBoundingClientRect().top < innerHeight * 0.4) cur = i; });
  [...jump.children].forEach((b, i) => b.classList.toggle('on', i === cur));
  Shell.sec(cur);
}

// ---- スクロールした いちを おぼえておく（このタブの あいだだけ） ----
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
function saveScroll() {
  if (isPark()) return;
  try { sessionStorage.setItem('menu-scroll', String(Math.round(scrollY))); } catch (e) {}
}
let saveTimer = 0;
addEventListener('scroll', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveScroll, 150); }, { passive: true });
addEventListener('pagehide', saveScroll);

// ---- したに まだ ボタンが あるときは ⬇️、いちばん したでは ⬆️ ----
const more = document.getElementById('more'), fade = document.getElementById('fade');
function updateMore() {
  if (isPark()) return;
  const se = document.scrollingElement;
  const canScroll = se.scrollHeight > innerHeight + 10;
  const atBottom = scrollY + innerHeight >= se.scrollHeight - 20;
  more.classList.toggle('hide', !canScroll);
  fade.classList.toggle('hide', !canScroll || atBottom);
  more.classList.toggle('top', atBottom);
  more.firstElementChild.textContent = atBottom ? '⬆️' : '⬇️';
}
// するする スクロール（ブラウザまかせの smooth が うごかない かんきょうでも うごくように じぶんで うごかす）
let scrollAnim = 0;
function glideTo(to) {
  const max = document.scrollingElement.scrollHeight - innerHeight;
  to = Math.max(0, Math.min(max, to));
  const from = scrollY, t0 = performance.now(), dur = 450;
  cancelAnimationFrame(scrollAnim);
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    scrollTo(0, from + (to - from) * e);
    if (k < 1) scrollAnim = requestAnimationFrame(step);
    else updateMore();
  };
  scrollAnim = requestAnimationFrame(step);
}
onTap(more, () => {
  Sfx.pop();
  if (more.classList.contains('top')) glideTo(0);
  else glideTo(scrollY + innerHeight * 0.6);
});
addEventListener('scroll', updateMore, { passive: true });
addEventListener('resize', updateMore);

// ================= いれもの（シェル） =================
// ボタンの ページは この うえの iframe で ひらく。メニューは したに のこるので、もどると すぐ もとの いち。
// グループ部屋（?room=）では、だれかが ボタンに はいると みんな いっしょに いく（multi.js の go）。
const Shell = (() => {
  const pages = new Map();   // file → { emoji, c1, c2, el }（この きかいで ひらける ボタン）
  let isReady = false, queued = null;
  let here = '', frameEl = null, followEl = null, seed = 0;
  const newSeed = () => Math.floor(Math.random() * 2147483646) + 1;

  function applyInsets() {
    if (!frameEl) return;
    try {
      const i = IroShell.insets(), st = frameEl.contentDocument.documentElement.style;
      st.setProperty('--sat', i.t + 'px'); st.setProperty('--sab', i.b + 'px');
      st.setProperty('--sal', i.l + 'px'); st.setProperty('--sar', i.r + 'px');
    } catch (e) {}
  }
  addEventListener('resize', applyInsets);

  // iframe は 1こ だけ つくって つかいまわす。けして つくりなおすと、とじた ページの メモリが もどらない ため
  // （Edge で はかって: けす→つくる は 1しゅう 10MB ずつ ふえつづけ、つかいまわしは ふえなかった）
  let frameReal = null, navToken = 0;
  function pageFrame() {
    if (frameReal) return frameReal;
    const f = document.createElement('iframe');
    f.className = 'page';
    f.setAttribute('allow', 'autoplay; fullscreen; microphone; camera');
    f.setAttribute('scrolling', 'no'); // iOS で iframe が なかみに あわせて のびないように
    document.body.appendChild(f);
    return (frameReal = f);
  }
  function closeFrame() {
    if (!frameEl) return;
    try { frameEl.contentWindow.__iroTeardown && frameEl.contentWindow.__iroTeardown(); } catch (e) {}
    frameEl.classList.remove('shown');
    delete frameEl.dataset.page;
    navToken++;
    // なにも ない ページへ（まえの ページを おわらせて メモリを かえす）
    try { frameEl.contentWindow.location.replace('about:blank'); } catch (e) {}
    frameEl = null;
  }

  function clearFollow() {
    if (followEl) { const el = followEl; followEl = null; el.classList.add('out'); setTimeout(() => el.remove(), 260); }
  }
  // いどうの えんしゅつ（だれかの どうぶつが ボタンに のる）。みんなの じゅんびが できるまで だしておく
  function showFollow(p, av, hu) {
    clearFollow();
    const info = p ? pages.get(p) : { emoji: '🏠', c1: '#29b6f6', c2: '#0277bd' };
    const el = document.createElement('div');
    el.id = 'follow';
    el.innerHTML = '<div class="big-btn"><span class="emoji"></span><span class="ring"></span><span class="rider"></span></div>';
    const b = el.firstElementChild;
    b.style.setProperty('--c1', info.c1); b.style.setProperty('--c2', info.c2);
    b.querySelector('.emoji').textContent = info.emoji;
    b.querySelector('.rider').textContent = safeAv(av);
    b.querySelector('.ring').style.setProperty('--c', `hsl(${hu ?? 200}, 95%, 65%)`);
    document.body.appendChild(el);
    followEl = el;
    // おとが だせなくても いどうは する
    try { Sfx.tone(520, 0.12, 'sine', 0.2, 0, 900); Sfx.tone(700, 0.18, 'triangle', 0.16, 0.42, 1100); } catch (e) {}
  }

  // ---- みんなで そろって ひらく（グループ部屋） ----
  // いどうが きまったら、みんな えんしゅつを だしながら うらで ページを よみこむ。
  // よみこめたら ready を おくり、サーバーから start が きたら いっせいに ひらく（まつのは さいだい 3びょう）
  let gate = null;
  function makeGate(p, n, sync) {
    if (gate) gate.cancel();
    let resolve;
    const g = {
      p, n: Number.isInteger(n) ? n : null, sync, loaded: false, done: false,
      promise: new Promise(r => { resolve = r; }),
      open() { if (g.done) return; g.done = true; clearTimeout(g.tm); resolve(true); },
      cancel() { if (g.done) return; g.done = true; clearTimeout(g.tm); resolve(false); },
      tm: 0,
    };
    if (sync) g.tm = setTimeout(() => g.open(), 3000); else g.open();
    gate = g;
    return g;
  }
  function gateLoaded(g) {
    g.loaded = true;
    if (g.sync && g.n !== null && !g.done) Multi.ready(g.n);
  }

  // p のページを ひらく（'' は メニュー）。announce = じぶんで えらんだ（グループ部屋なら みんなも つれていく）
  // sync = みんなで そろって ひらく、n = いどうの ばんごう、av/hu = えんしゅつに のる どうぶつ
  function show(p, { announce = false, push = true, query = '', s = 0, sync, n, av, hu } = {}) {
    if (p && !pages.has(p)) p = '';
    if (sync === undefined) sync = announce && Multi.group && Multi.enabled && Multi.connected;
    if (p === here) {
      if (announce) Multi.setHere(p, true, seed);
      if (Number.isInteger(n)) Multi.ready(n); // もう そこに いる
      return;
    }
    here = p;
    // らんすうの たね: じぶんで えらんだら あたらしく、つれていかれたら なかまと おなじ もの
    seed = p ? ((!announce && s) || newSeed()) : 0;
    if (push) history.pushState({ p }, '', p ? '#/' + p : location.pathname + location.search);
    const g = makeGate(p, n, sync);
    if (sync) showFollow(p, av ?? Multi.myAvatar, hu ?? Multi.myHue);
    else clearFollow();
    // ここで いどうを つたえる（go なら サーバーから いどうの ばんごうが かえってくる）
    Multi.setHere(p, announce, seed);
    if (p) {
      if (Shell.markSeen) Shell.markSeen(p);
      if (window.Park) Park.onEntered(p);
      // まえの ページは おわらせて、メニューの うえで あたらしい ページを よみこむ
      closeFrame();
      document.documentElement.classList.remove('playing');
      const f = pageFrame(), token = ++navToken, file = p + '.html';
      frameEl = f;
      f.dataset.page = p;
      // history を ふやさない ように replace で いれかえる
      f.contentWindow.location.replace(new URL(file + query, location.href).href);
      let loadedOnce = false;
      const loaded = () => {
        if (loadedOnce || token !== navToken) return;
        try { if (!f.contentWindow.location.pathname.endsWith('/' + file)) return; } catch (e) { return; }
        loadedOnce = true;
        f.removeEventListener('load', loaded);
        applyInsets();
        gateLoaded(g);
        g.promise.then((go) => {
          if (!go || token !== navToken) return;
          clearFollow();
          f.classList.add('shown');
          document.documentElement.classList.add('playing');
          try { f.contentWindow.focus(); } catch (e) {}
        });
      };
      f.addEventListener('load', loaded);
      setTimeout(loaded, 1500); // load が こなくても（おそくても）すすむ
    } else {
      // メニューは いつでも じゅんび できている。そろったら ページを とじる
      gateLoaded(g);
      g.promise.then((go) => {
        if (!go || here !== '') return;
        clearFollow();
        closeFrame();
        document.documentElement.classList.remove('playing');
        dispatchEvent(new Event('iro-volume'));
        dispatchEvent(new Event('iro-home'));
        try { window.focus(); } catch (e) {}
      });
    }
  }

  const AVS = new Set(['🐶', '🐱', '🐰', '🐻', '🐼', '🐸', '🦊', '🐧', '🐷', '🐥', '🦁', '🐨', '🧒']);
  const safeAv = (v) => AVS.has(v) ? v : '🧒';

  // サーバーからの いどう（なかまが えらんだ / じぶんの go の へんじ / とちゅうから きた とき）
  function onGo(p, msg) {
    if (!isReady) { queued = [p, msg]; return; }
    const n = msg && Number.isInteger(msg.n) ? msg.n : undefined;
    // じぶんの go の へんじ: いどうの ばんごうを おぼえる（もう よみこめていたら ready）
    if (msg && msg.from && msg.from === Multi.myId && gate && gate.p === p && gate.n === null && !gate.done) {
      if (n !== undefined) { gate.n = n; if (gate.loaded) Multi.ready(n); }
      return;
    }
    // この きかいでは ひらけない ボタン（WebGPU など）: ここに いるが、みんなを またせない
    if (p && !pages.has(p)) { if (n !== undefined) Multi.ready(n); return; }
    const sync = !!(msg && msg.w) && Multi.connected;
    const s = msg && Number.isInteger(msg.s) ? msg.s : 0;
    show(p, { s, sync, n, av: msg && msg.av, hu: msg && msg.hu });
    // そろえない（もう はじまっている）ときも、えんしゅつは みせる
    if (!sync && p !== '' && followEl === null) {
      showFollow(p, msg && msg.av, msg && msg.hu);
      setTimeout(() => { if (here === p) clearFollow(); }, 900);
    }
  }
  function onStart(n) { if (gate && gate.n === n) gate.open(); }

  // ---- メニューで なかまが どこに いるか ----
  let others = [];           // [{ id, av, hu, p }]（じぶんいがい）
  const secOf = new Map();   // id → その なかまが メニューで みている なかま（みだし）の ばんごう
  let mySec = -1;
  function renderPresence() {
    document.querySelectorAll('.peer-badge, .peer-sec').forEach(e => e.remove());
    const jumpBtns = [...document.getElementById('jump').children];
    const park = isPark();
    for (const m of others) {
      if (m.p) {
        // ボタンの なかに いる なかま → その ボタンに どうぶつ
        const pg = pages.get(m.p);
        const target = pg && (park ? pg.pel : pg.el);
        if (!target) continue;
        const s = document.createElement('span');
        s.className = 'peer-badge'; s.textContent = safeAv(m.av); s.style.setProperty('--c', `hsl(${m.hu ?? 200}, 95%, 65%)`);
        target.appendChild(s);
      } else if (m.p === '' && secOf.has(m.id) && jumpBtns[secOf.get(m.id)]) {
        // メニューに いる なかま → いま みている みだしの ジャンプボタンの よこに
        const s = document.createElement('span');
        s.className = 'peer-sec'; s.textContent = safeAv(m.av);
        jumpBtns[secOf.get(m.id)].appendChild(s);
      }
    }
  }
  function onMembers(list) {
    const before = new Set(others.map(m => m.id));
    others = list;
    if (window.Park) Park.onMembers(list);
    for (const id of [...secOf.keys()]) if (!list.some(m => m.id === id && m.p === '')) secOf.delete(id);
    renderPresence();
    // あたらしく きた なかまにも、じぶんが どこを みているか おしえる
    if (here === '' && mySec >= 0 && list.some(m => !before.has(m.id))) Multi.send({ a: 'sec', i: mySec }, 0);
  }
  function onMenuAct(msg) {
    if (msg.a === 'g') { if (window.Park) Park.onAct(msg); return; }
    if (msg.a === 'sec' && typeof msg.i === 'number') { secOf.set(msg.from, msg.i); renderPresence(); }
    else if (msg.a === 'look' && msg.p && pages.has(msg.p) && here === '') {
      // なかまが ボタンに ゆびを おいた → その ボタンに どうぶつが ぴょこっと
      const pg = pages.get(msg.p), el = isPark() ? pg.pel : pg.el;
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) return;
      const e = document.createElement('div');
      e.className = 'peer-look'; e.textContent = safeAv(msg.av);
      e.style.left = (r.left + r.width / 2) + 'px'; e.style.top = (r.top + r.height * 0.3) + 'px';
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 1000);
    }
  }

  // ブラウザの もどる（スワイプ）も じぶんで えらんだ いどう
  addEventListener('popstate', (e) => {
    const p = (e.state && typeof e.state.p === 'string') ? e.state.p : '';
    show(p, { announce: true, push: false });
  });

  Multi.init({ onGo, onStart, onMembers, onMenuAct });

  return {
    pages,
    open: (p, opt) => show(p, opt),
    // グループ部屋のときだけ たねを わたす（ひとりの ときは いままで どおりの らんすう）
    get seed() { return Multi.group && Multi.enabled ? seed : 0; },
    frameStart(w) { if (frameEl && frameEl.contentWindow === w && Multi.group) Multi.mirror(w); },
    get here() { return here; },
    // メニューで ボタンに ゆびを おいた / みている みだしが かわった ことを なかまへ
    look(p) { if (here === '' && Multi.group) Multi.send({ a: 'look', p }, 150); },
    sec(i) { if (i === mySec) return; mySec = i; if (here === '' && Multi.group) Multi.send({ a: 'sec', i }, 0); },
    ready(startPage) {
      isReady = true;
      if (startPage) show(startPage, { query: location.search });
      if (queued) { const [p, m] = queued; queued = null; onGo(p, m); }
    },
    members: () => others,
    refreshPresence: renderPresence,
    markSeen: null,
  };
})();
</script>
</body>
