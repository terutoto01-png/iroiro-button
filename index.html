<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>いろいろボタン</title>
<link rel="stylesheet" href="common.css?v=7">
<style>
  /* がめん ぜんたいで スクロールする（body の なかだけで スクロールさせない） */
  html { overflow: auto; height: auto; }
  body { overflow: visible; height: auto; background: #eef6f4; min-height: 100%; }
  /* はいけいは がめんに こていする（iPad でも うごかないように ::before で） */
  body::before { content: ''; position: fixed; inset: 0; z-index: -1;
                 background: linear-gradient(135deg, #ffe7f3, #e2f3ff 55%, #e9ffe2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(28vw, 140px), 1fr));
          gap: min(5vw, 32px); padding: min(6vw, 40px); padding-bottom: 150px; max-width: 1100px; margin: 0 auto; }
  /* したの はしを ふんわり ぼかす */
  #fade { position: fixed; left: 0; right: 0; bottom: 0; height: 140px; z-index: 20; pointer-events: none;
          background: linear-gradient(rgba(236,250,240,0), rgba(236,250,240,.95) 75%); transition: opacity .3s; }
  /* はねる やじるし ボタン */
  #more { position: fixed; left: 50%; bottom: 22px; z-index: 30; width: 84px; height: 84px; margin-left: -42px;
          --c1: #ff9f1c; --c2: #c47200; font-size: 40px; animation: hop 1.1s ease-in-out infinite; transition: opacity .3s; }
  #more:active { animation: none; }
  #more.top { --c1: #29b6f6; --c2: #0277bd; animation: none; }
  @keyframes hop { 0%, 100% { translate: 0 0; } 45% { translate: 0 -14px; } 60% { translate: 0 0; } 75% { translate: 0 -5px; } }
  .hide { opacity: 0; pointer-events: none; }
  .grid a { aspect-ratio: 1; width: 100%; height: auto; font-size: min(9vw, 44px); text-decoration: none; margin-bottom: 12px; }
  .grid a:nth-child(odd)  { animation: bob 2.4s ease-in-out infinite; }
  .grid a:nth-child(even) { animation: bob 2.4s ease-in-out -1.2s infinite; }
  .grid a:active { animation: none; }
  @keyframes bob { 50% { translate: 0 -6px; } }
</style>
</head>
<body data-no-back data-scroll>
<nav class="grid" id="grid"></nav>
<div id="fade" class="hide"></div>
<button id="more" class="big-btn hide" aria-label="した"><span>⬇️</span></button>
<script src="common.js?v=7"></script>
<script>
// 4つめ: そのページに必要な機能（'gpu' = WebGPU, 'hic' = HTML-in-Canvas, 'mic' = マイク録音）
const PAGES = [
  ['hanabi', '🎆', '#ff8a00', '#b85d00', 'gpu'], ['niji', '🌈', '#7b5cff', '#4b2fc4', 'gpu'],
  ['purupuru', '💧', '#33cc88', '#1f8a5a', 'gpu'], ['uchuu', '🪐', '#2b3fbf', '#141f6b', 'gpu'],
  ['bunshin', '👯', '#ff5fa2', '#c2306f', 'hic'], ['barabara', '🧩', '#00b3a4', '#007a70', 'hic'],
  ['korokoro', '⚽', '#ff4040', '#b31d1d', 'hic'], ['kamifubuki', '🎉', '#ff4f7b', '#c22a52'],
  ['doubutsu', '🐾', '#ff9f1c', '#c47200'], ['shabondama', '🫧', '#29b6f6', '#0277bd'],
  ['nigeru', '🐰', '#8e44ff', '#5a1fc2'], ['fuusen', '🎈', '#ff5a5a', '#c22f2f'],
  ['ongaku', '🎵', '#ff7eb6', '#c94a85'], ['nagareboshi', '🌠', '#ffd23f', '#b8900a'],
  ['kaminari', '⚡', '#ffe600', '#b3a000'], ['ohana', '🌷', '#ff7ab8', '#c94585'],
  ['kao', '🙂', '#ffd23f', '#d19e00'], ['kuruma', '🚗', '#2e86ff', '#1655b8'],
  ['onara', '💨', '#9ccc3d', '#678a1f'], ['taiko', '🥁', '#c0392b', '#7a1f14'],
  ['densha', '🚃', '#2bb24c', '#187a31'], ['fumikiri', '🚸', '#ffcc00', '#b38f00'],
  ['nami', '🌊', '#20b2e8', '#0d6f99', 'gpu'], ['tamago', '🥚', '#f3d9a8', '#c4a167'],
  ['roketto', '🚀', '#ff3b3b', '#a81c1c'], ['kyouryuu', '🦖', '#4caf50', '#2e7031'],
  ['keeki', '🎂', '#ff8fb8', '#c95a85'], ['obake', '👻', '#b388ff', '#6a3fc2'],
  ['sakana', '🐠', '#ff9933', '#c2651a'], ['saikoro', '🎲', '#ff6b35', '#b8431a'],
  ['okashi', '🍬', '#ff6fae', '#c23c7a'], ['biidama', '🔮', '#5b8cff', '#2f55b8'],
  ['fukifuki', '🧽', '#29b6f6', '#0277bd'], ['nijipen', '🖍️', '#ffcc00', '#b38f00'],
  ['drive', '🛣️', '#2e86ff', '#1655b8'], ['nadenade', '🐶', '#ff7ab8', '#c94585'],
  ['biyoon', '🎯', '#ff5a5a', '#c22f2f'], ['katachi', '🔺', '#ff9f1c', '#c47200'],
  ['mizuyari', '🌱', '#66bb44', '#3f8a26'],
  ['hashire', '👟', '#ff6a3d', '#b8401c', 'gpu'], ['popcorn', '🍿', '#ffcc00', '#b38f00'],
  ['bikkuri', '🎁', '#ff4d8d', '#b8245c'], ['kusuguri', '🤣', '#b388ff', '#6a3fc2'],
  ['oryouri', '🍳', '#ff7b00', '#b35500'], ['koemane', '🎤', '#ff4d6d', '#b3203e', 'mic'],
  ['hotaru', '🌟', '#b7e34a', '#6e9420', 'gpu'], ['sakura', '🌸', '#ff8fb8', '#c25784', 'gpu'],
  ['funsui', '⛲', '#3db6ff', '#1a6fa8', 'gpu'], ['uzumaki', '🌀', '#9b5cff', '#5a2bb3', 'gpu'],
  ['aurora', '🌌', '#2fd6a0', '#148a64', 'gpu'],
];
const grid = document.getElementById('grid');

// このブラウザで WebGPU が本当に使えるか（アダプタまで取れるか）
async function hasWebGPU() {
  try { return !!(navigator.gpu && await navigator.gpu.requestAdapter()); }
  catch (e) { return false; }
}

(async () => {
const can = { gpu: await hasWebGPU(), hic: HIC.supported, mic: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) };
// うごかないと わかっているボタンは ださない
for (const [file, emoji, c1, c2, need] of PAGES) {
  if (need && !can[need]) continue;
  const a = document.createElement('a');
  a.href = file + '.html';
  a.className = 'big-btn';
  a.style.setProperty('--c1', c1); a.style.setProperty('--c2', c2);
  a.innerHTML = `<span class="emoji">${emoji}</span>`;
  a.addEventListener('pointerdown', () => Sfx.pop());
  a.addEventListener('click', saveScroll);
  grid.appendChild(a);
}
// まえに みていた ところへ もどす（ボタンを ならべてから）
try {
  const y = parseFloat(sessionStorage.getItem('menu-scroll'));
  if (y > 0) scrollTo(0, y);
} catch (e) {}
updateMore();
})();

// ---- スクロールした いちを おぼえておく（このタブの あいだだけ） ----
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
function saveScroll() {
  try { sessionStorage.setItem('menu-scroll', String(Math.round(scrollY))); } catch (e) {}
}
let saveTimer = 0;
addEventListener('scroll', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveScroll, 150); }, { passive: true });
addEventListener('pagehide', saveScroll);

// ---- したに まだ ボタンが あるときは ⬇️、いちばん したでは ⬆️ ----
const more = document.getElementById('more'), fade = document.getElementById('fade');
function updateMore() {
  const se = document.scrollingElement;
  const canScroll = se.scrollHeight > innerHeight + 10;
  const atBottom = scrollY + innerHeight >= se.scrollHeight - 20;
  more.classList.toggle('hide', !canScroll);
  fade.classList.toggle('hide', !canScroll || atBottom);
  more.classList.toggle('top', atBottom);
  more.firstElementChild.textContent = atBottom ? '⬆️' : '⬇️';
}
// するする スクロール（ブラウザまかせの smooth が うごかない かんきょうでも うごくように じぶんで うごかす）
let scrollAnim = 0;
function glideTo(to) {
  const max = document.scrollingElement.scrollHeight - innerHeight;
  to = Math.max(0, Math.min(max, to));
  const from = scrollY, t0 = performance.now(), dur = 450;
  cancelAnimationFrame(scrollAnim);
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    scrollTo(0, from + (to - from) * e);
    if (k < 1) scrollAnim = requestAnimationFrame(step);
    else updateMore();
  };
  scrollAnim = requestAnimationFrame(step);
}
more.addEventListener('click', () => {
  Sfx.pop();
  if (more.classList.contains('top')) glideTo(0);
  else glideTo(scrollY + innerHeight * 0.6);
});
addEventListener('scroll', updateMore, { passive: true });
addEventListener('resize', updateMore);
</script>
</body>
</html>
