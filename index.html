<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>いろいろボタン</title>
<link rel="stylesheet" href="common.css?v=15">
<style>
  /* がめん ぜんたいで スクロールする（body の なかだけで スクロールさせない） */
  html { overflow: auto; height: auto; }
  body { overflow: visible; height: auto; background: #eef6f4; min-height: 100%; padding-top: env(safe-area-inset-top); }
  /* はいけいは がめんに こていする（iPad でも うごかないように ::before で） */
  body::before { content: ''; position: fixed; inset: 0; z-index: -1;
                 background: linear-gradient(135deg, #ffe7f3, #e2f3ff 55%, #e9ffe2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(28vw, 140px), 1fr));
          gap: min(5vw, 32px); padding: min(6vw, 40px); padding-bottom: 150px; max-width: 1100px; margin: 0 auto; }
  /* したの はしを ふんわり ぼかす */
  #fade { position: fixed; left: 0; right: 0; bottom: 0; height: 140px; z-index: 20; pointer-events: none;
          background: linear-gradient(rgba(236,250,240,0), rgba(236,250,240,.95) 75%); transition: opacity .3s; }
  /* はねる やじるし ボタン */
  #more { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom) + 8px); z-index: 30; width: 84px; height: 84px; margin-left: -42px;
          --c1: #ff9f1c; --c2: #c47200; font-size: 40px; animation: hop 1.1s ease-in-out infinite; transition: opacity .3s; }
  #more:active { animation: none; }
  #more.top { --c1: #29b6f6; --c2: #0277bd; animation: none; }
  @keyframes hop { 0%, 100% { translate: 0 0; } 45% { translate: 0 -14px; } 60% { translate: 0 0; } 75% { translate: 0 -5px; } }
  .hide { opacity: 0; pointer-events: none; }
  .grid a { aspect-ratio: 1; width: 100%; height: auto; font-size: min(9vw, 44px); text-decoration: none; margin-bottom: 12px; }
  .grid a:nth-child(odd)  { animation: bob 2.4s ease-in-out infinite; }
  .grid a:nth-child(even) { animation: bob 2.4s ease-in-out -1.2s infinite; }
  .grid a:active { animation: none; }
  @keyframes bob { 50% { translate: 0 -6px; } }
  /* なかまの みだし（えもじ だけ。もじは つかわない） */
  .sec-h { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin: 10px 0 -6px; scroll-margin-top: 16px; }
  .sec-h:first-child { margin-top: 0; }
  .sec-h b { font-size: min(10vw, 46px); line-height: 1; padding: 8px 18px; border-radius: 999px; background: var(--bg); box-shadow: 0 4px 0 var(--bd); }
  .sec-h i { flex: 1; height: 6px; border-radius: 3px; background: var(--bd); opacity: .55; }
  /* みぎはしの ジャンプ ボタン */
  #jump { position: fixed; right: max(8px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); z-index: 40;
          display: flex; flex-direction: column; gap: 8px; }
  #jump button { width: min(12vw, 54px); height: min(12vw, 54px); border-radius: 50%; border: none; padding: 0; cursor: pointer;
                 font-size: min(6vw, 28px); background: var(--bg); box-shadow: 0 4px 0 var(--bd); transition: scale .2s; font-family: inherit; }
  #jump button.on { scale: 1.18; box-shadow: 0 4px 0 var(--bd), 0 0 0 4px #fff; }
  #jump button:active { translate: 0 3px; box-shadow: 0 1px 0 var(--bd); }
  .grid { padding-right: calc(min(12vw, 54px) + 22px) !important; }
  /* まだ ひらいていない ボタン: かどで ✨ が きらきら */
  .grid a.new::after { content: '✨'; position: absolute; right: -10%; top: -10%; font-size: .9em; pointer-events: none;
                       animation: twinkle 1.4s ease-in-out infinite; filter: drop-shadow(0 0 6px #fff6a8); }
  @keyframes twinkle { 0%, 100% { scale: .8; rotate: -10deg; opacity: .75; } 50% { scale: 1.15; rotate: 12deg; opacity: 1; } }
</style>
</head>
<body data-no-back data-scroll>
<nav class="grid" id="grid"></nav>
<div id="jump"></div>
<div id="fade" class="hide"></div>
<button id="more" class="big-btn hide" aria-label="した"><span>⬇️</span></button>
<script src="common.js?v=14"></script>
<script>
// 4つめ: そのページに必要な機能（'gpu' = WebGPU, 'mic' = マイク録音）
const PAGES = [
  ['hanabi', '🎆', '#ff8a00', '#b85d00', 'gpu'], ['niji', '🌈', '#7b5cff', '#4b2fc4', 'gpu'],
  ['purupuru', '💧', '#33cc88', '#1f8a5a', 'gpu'], ['uchuu', '🪐', '#2b3fbf', '#141f6b', 'gpu'],
  ['kamifubuki', '🎉', '#ff4f7b', '#c22a52'],
  ['doubutsu', '🐾', '#ff9f1c', '#c47200'], ['shabondama', '🫧', '#29b6f6', '#0277bd'],
  ['nigeru', '🐰', '#8e44ff', '#5a1fc2'], ['fuusen', '🎈', '#ff5a5a', '#c22f2f'],
  ['ongaku', '🎵', '#ff7eb6', '#c94a85'], ['nagareboshi', '🌠', '#ffd23f', '#b8900a'],
  ['kaminari', '⚡', '#ffe600', '#b3a000'], ['ohana', '🌷', '#ff7ab8', '#c94585'],
  ['kao', '🙂', '#ffd23f', '#d19e00'], ['kuruma', '🚗', '#2e86ff', '#1655b8'],
  ['onara', '💨', '#9ccc3d', '#678a1f'], ['taiko', '🥁', '#c0392b', '#7a1f14'],
  ['densha', '🚃', '#2bb24c', '#187a31'], ['fumikiri', '🚸', '#ffcc00', '#b38f00'],
  ['nami', '🌊', '#20b2e8', '#0d6f99', 'gpu'], ['tamago', '🥚', '#f3d9a8', '#c4a167'],
  ['roketto', '🚀', '#ff3b3b', '#a81c1c'], ['kyouryuu', '🦖', '#4caf50', '#2e7031'],
  ['keeki', '🎂', '#ff8fb8', '#c95a85'], ['obake', '👻', '#b388ff', '#6a3fc2'],
  ['sakana', '🐠', '#ff9933', '#c2651a'], ['saikoro', '🎲', '#ff6b35', '#b8431a'],
  ['okashi', '🍬', '#ff6fae', '#c23c7a'], ['biidama', '🔮', '#5b8cff', '#2f55b8'],
  ['fukifuki', '🧽', '#29b6f6', '#0277bd'], ['nijipen', '🖍️', '#ffcc00', '#b38f00'],
  ['drive', '🛣️', '#2e86ff', '#1655b8'], ['nadenade', '🐶', '#ff7ab8', '#c94585'],
  ['biyoon', '🎯', '#ff5a5a', '#c22f2f'], ['katachi', '🔺', '#ff9f1c', '#c47200'],
  ['mizuyari', '🌱', '#66bb44', '#3f8a26'],
  ['hashire', '👟', '#ff6a3d', '#b8401c', 'gpu'], ['popcorn', '🍿', '#ffcc00', '#b38f00'],
  ['bikkuri', '🎁', '#ff4d8d', '#b8245c'], ['kusuguri', '🤣', '#b388ff', '#6a3fc2'],
  ['oryouri', '🍳', '#ff7b00', '#b35500'], ['koemane', '🎤', '#ff4d6d', '#b3203e', 'mic'],
  ['hotaru', '🌟', '#b7e34a', '#6e9420', 'gpu'], ['sakura', '🌸', '#ff8fb8', '#c25784', 'gpu'],
  ['funsui', '⛲', '#3db6ff', '#1a6fa8', 'gpu'], ['uzumaki', '🌀', '#9b5cff', '#5a2bb3', 'gpu'],
  ['aurora', '🌌', '#2fd6a0', '#148a64', 'gpu'],
  ['pyonpyon', '🏃', '#ff6a3d', '#b8401c', 'gpu'], ['tsumiki', '🦒', '#ff9f1c', '#c47200'],
  ['inseki', '☄️', '#4d7cff', '#2a46b3', 'gpu'],
  ['yukidaruma', '☃️', '#5fb8ff', '#2a7cc2'], ['hakushon', '🤧', '#ff9ec2', '#c9608a'],
  ['tsurii', '🎄', '#e8394a', '#9e1d2a'], ['awaawa', '🛁', '#4fc3f7', '#1e88c7'],
  ['gacha', '🎰', '#ff4d6d', '#b3203e'], ['domino', '👉', '#7c5cff', '#4b2fc4'],
  ['toire', '🚽', '#29b6f6', '#0277bd'], ['shinkai', '🪼', '#3fa9ff', '#1a5fb3', 'gpu'],
  ['shoberu', '🚜', '#ffb300', '#b87d00'], ['pokopoko', '🐹', '#ff8a3d', '#b8561c'],
  ['gattai', '🐘', '#ff7ab8', '#c94585'],
  ['pinball', '🕹️', '#ff5e7e', '#b8304d'], ['meiro', '🗺️', '#66bb44', '#3f8a26'],
  ['katahame', '🧩', '#ff9f1c', '#c47200'], ['kenkenpa', '🦶', '#8a9099', '#5b6068'],
  ['daruma', '🙈', '#ff7b54', '#b84a26'], ['oisha', '🩺', '#4fc3f7', '#1e88c7'],
];
// ---- こども むけの「おした」はんてい ----
// リンクの click は ゆびが すこし うごくだけで とりけされる。はなした ときに ボタンの ちかくで、
// うごきが ちいさければ「おした」に する（おおきく うごいたら スクロール なので なにも しない）
function onTap(el, fn) {
  let st = null;
  el.addEventListener('pointerdown', (e) => { st = { x: e.clientX, y: e.clientY, sy: scrollY, id: e.pointerId }; });
  addEventListener('pointerup', (e) => {
    if (!st || e.pointerId !== st.id) return;
    const moved = Math.hypot(e.clientX - st.x, e.clientY - st.y) + Math.abs(scrollY - st.sy); st = null;
    const r = el.getBoundingClientRect(), m = 16;
    if (moved < 28 && e.clientX > r.left - m && e.clientX < r.right + m && e.clientY > r.top - m && e.clientY < r.bottom + m) fn(e);
  }, true);
  addEventListener('pointercancel', () => { st = null; }, true);
  el.addEventListener('click', (e) => e.preventDefault()); // ふつうの click では うごかさない（にじゅう ぼうし）
}

// なかま（みだしの えもじ、いろ、はいる ページ）。どこにも はいっていない ページは さいごの なかまへ
const GROUPS = [
  { e: '🎆', bg: '#fff1c2', bd: '#f2c94c', items: ['hanabi', 'niji', 'purupuru', 'uchuu', 'nagareboshi', 'kaminari', 'nami', 'hotaru', 'sakura', 'funsui', 'uzumaki', 'aurora', 'shinkai', 'biidama'] },
  { e: '🎉', bg: '#ffd9e8', bd: '#f28bb5', items: ['kamifubuki', 'shabondama', 'fuusen', 'bikkuri', 'popcorn', 'hakushon', 'toire', 'obake', 'saikoro', 'gacha', 'okashi', 'keeki', 'oryouri', 'yukidaruma', 'tsurii', 'ohana'] },
  { e: '🚗', bg: '#d6ecff', bd: '#7fb6ef', items: ['kuruma', 'densha', 'fumikiri', 'drive', 'roketto', 'shoberu', 'hashire'] },
  { e: '🐶', bg: '#ffe6cc', bd: '#f0ac6a', items: ['doubutsu', 'nigeru', 'sakana', 'nadenade', 'kyouryuu', 'tamago', 'gattai'] },
  { e: '👆', bg: '#e2f7d9', bd: '#8fce73', items: ['fukifuki', 'nijipen', 'katachi', 'mizuyari', 'biyoon', 'awaawa', 'domino'] },
  { e: '🎵', bg: '#eadfff', bd: '#ae8ff0', items: ['ongaku', 'taiko', 'onara', 'koemane', 'kao', 'kusuguri'] },
  { e: '🎮', bg: '#d9f5f2', bd: '#6fcfc4', items: ['pinball', 'meiro', 'katahame', 'kenkenpa', 'daruma', 'oisha', 'pyonpyon', 'tsumiki', 'inseki', 'pokopoko'] },
];
const grid = document.getElementById('grid'), jump = document.getElementById('jump');

// このブラウザで WebGPU が本当に使えるか（アダプタまで取れるか）
async function hasWebGPU() {
  try { return !!(navigator.gpu && await navigator.gpu.requestAdapter()); }
  catch (e) { return false; }
}

(async () => {
const can = { gpu: await hasWebGPU(), hic: HIC.supported, mic: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) };
// ---- ひらいた ことの ある ボタン（この ブラウザに おぼえておく） ----
// はじめて この しくみが うごく ときは、ふるい ボタンは「ひらいた こと あり」に しておき、さいきん ふえた ぶんだけ ✨ に する
const NEWEST = ['pinball', 'meiro', 'katahame', 'kenkenpa', 'daruma', 'oisha', 'yukidaruma', 'hakushon', 'tsurii', 'awaawa', 'gacha', 'domino', 'toire', 'shinkai', 'shoberu', 'pokopoko', 'gattai'];
let seen;
try { seen = JSON.parse(localStorage.getItem('iroiro-seen')); } catch (e) {}
if (!Array.isArray(seen)) { seen = PAGES.map(p => p[0]).filter(f => !NEWEST.includes(f)); saveSeen(); }
seen = new Set(seen);
function saveSeen() { try { localStorage.setItem('iroiro-seen', JSON.stringify([...seen])); } catch (e) {} }

// うごかないと わかっているボタンは ださない。なかま ごとに みだしを つけて ならべる
const byFile = Object.fromEntries(PAGES.map(p => [p[0], p]));
const placed = new Set(GROUPS.flatMap(g => g.items));
GROUPS[GROUPS.length - 1].items.push(...PAGES.map(p => p[0]).filter(f => !placed.has(f)));
const heads = [];
GROUPS.forEach((g, gi) => {
  const list = g.items.map(f => byFile[f]).filter(p => p && !(p[4] && !can[p[4]]));
  if (!list.length) return;
  const h = document.createElement('div');
  h.className = 'sec-h'; h.style.setProperty('--bg', g.bg); h.style.setProperty('--bd', g.bd);
  h.innerHTML = `<b>${g.e}</b><i></i>`;
  grid.appendChild(h); heads.push(h);
  const j = document.createElement('button');
  j.textContent = g.e; j.style.setProperty('--bg', g.bg); j.style.setProperty('--bd', g.bd);
  onTap(j, () => { Sfx.pop(); glideTo(h.getBoundingClientRect().top + scrollY - 16); });
  jump.appendChild(j);
  for (const [file, emoji, c1, c2] of list) {
    const a = document.createElement('a');
    a.href = file + '.html';
    a.className = 'big-btn';
    a.style.setProperty('--c1', c1); a.style.setProperty('--c2', c2);
    a.innerHTML = `<span class="emoji">${emoji}</span>`;
    a.addEventListener('pointerdown', () => Sfx.pop());
    onTap(a, () => { saveScroll(); seen.add(file); saveSeen(); location.href = file + '.html'; });
    if (!seen.has(file)) a.classList.add('new');
    grid.appendChild(a);
  }
});
// いま みている なかまの ジャンプ ボタンを すこし おおきく
function markJump() {
  let cur = 0;
  heads.forEach((h, i) => { if (h.getBoundingClientRect().top < innerHeight * 0.4) cur = i; });
  [...jump.children].forEach((b, i) => b.classList.toggle('on', i === cur));
}
addEventListener('scroll', markJump, { passive: true });
markJump();
// まえに みていた ところへ もどす（ボタンを ならべてから）
try {
  const y = parseFloat(sessionStorage.getItem('menu-scroll'));
  if (y > 0) scrollTo(0, y);
} catch (e) {}
updateMore();
})();

// ---- スクロールした いちを おぼえておく（このタブの あいだだけ） ----
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
function saveScroll() {
  try { sessionStorage.setItem('menu-scroll', String(Math.round(scrollY))); } catch (e) {}
}
let saveTimer = 0;
addEventListener('scroll', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveScroll, 150); }, { passive: true });
addEventListener('pagehide', saveScroll);

// ---- したに まだ ボタンが あるときは ⬇️、いちばん したでは ⬆️ ----
const more = document.getElementById('more'), fade = document.getElementById('fade');
function updateMore() {
  const se = document.scrollingElement;
  const canScroll = se.scrollHeight > innerHeight + 10;
  const atBottom = scrollY + innerHeight >= se.scrollHeight - 20;
  more.classList.toggle('hide', !canScroll);
  fade.classList.toggle('hide', !canScroll || atBottom);
  more.classList.toggle('top', atBottom);
  more.firstElementChild.textContent = atBottom ? '⬆️' : '⬇️';
}
// するする スクロール（ブラウザまかせの smooth が うごかない かんきょうでも うごくように じぶんで うごかす）
let scrollAnim = 0;
function glideTo(to) {
  const max = document.scrollingElement.scrollHeight - innerHeight;
  to = Math.max(0, Math.min(max, to));
  const from = scrollY, t0 = performance.now(), dur = 450;
  cancelAnimationFrame(scrollAnim);
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    scrollTo(0, from + (to - from) * e);
    if (k < 1) scrollAnim = requestAnimationFrame(step);
    else updateMore();
  };
  scrollAnim = requestAnimationFrame(step);
}
onTap(more, () => {
  Sfx.pop();
  if (more.classList.contains('top')) glideTo(0);
  else glideTo(scrollY + innerHeight * 0.6);
});
addEventListener('scroll', updateMore, { passive: true });
addEventListener('resize', updateMore);
</script>
</body>
</html>
