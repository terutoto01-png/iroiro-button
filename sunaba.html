<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>すなのおしろ</title>
<link rel="stylesheet" href="common.css?v=23">
<style>
  body { background: #9fdcff; }
  #cv { touch-action: none; }
  .big-btn { --c1: #f0b35a; --c2: #b37a2a; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🪣</span></button></div>
<script src="common.js?v=20"></script>
<script>
// すなのおしろ: ボタンで バケツを ぽんっ → すなの とうが できる。つづけると かべ・まど・はたが ついて おしろに なる。
// できあがると しばらくして おおきな なみが ざぶーん（おしろは くずれて、あとに かいがらが のこる）。すなを さわると かいがら、🦀 を さわると チョキチョキ。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx), W = innerWidth, H = innerHeight;
let seaY, groundY, towers = [], extras = 0, shells = [], wave = null, waveT = -1, crab = null, crabT = 4, sparks = [], plops = [];
const MAXT = () => W < 600 ? 4 : 5;

function layout() { seaY = H * 0.3; groundY = Math.min(H - 150, H * 0.66); }
layout();
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); W = innerWidth; H = innerHeight; layout(); placeTowers(); });
function placeTowers() { const n = MAXT(), span = Math.min(W * 0.8, 560); towers.forEach((t, i) => { t.x = W / 2 - span / 2 + span * (i + 0.5) / n; t.w = Math.min(70, span / n * 0.7); }); }

btn.addEventListener('pointerdown', () => {
  if (wave) return;
  if (towers.length < MAXT()) {
    const i = towers.length, big = i === Math.floor(MAXT() / 2);
    towers.push({ x: 0, w: 0, h: 0, th: big ? 1.7 : 1.1 + Math.random() * 0.3, flag: false, win: false, squash: 1 });
    placeTowers(); Sfx.tone(180, 0.15, 'sine', 0.25, 0, 110); Sfx.noise(0.15, 0.15, 700);
    plops.push({ x: towers[i].x, t: 0 });
  } else if (extras < 3) {
    extras++;
    if (extras === 1) { towers.forEach(t => t.win = true); Sfx.tone(600, 0.1, 'triangle', 0.1); }
    else if (extras === 2) { Sfx.tone(700, 0.1, 'triangle', 0.1); }
    else { towers.forEach(t => t.flag = true); Sfx.yay(); setTimeout(() => Sfx.chime(), 250); popText('おしろ できた！', W / 2, groundY - 220, '#e8394a', 44); waveT = 3.5; for (let i = 0; i < 30; i++) sparks.push({ x: W / 2, y: groundY - 120, vx: rand(-260, 260), vy: rand(-320, -60), life: 1.2, hue: rand(0, 360) }); }
  } else { towers.forEach(t => t.squash = 1); Sfx.boing(); }
});
cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY;
  if (crab && Math.hypot(crab.x - x, crab.y - y) < 44) { crab.snip = 1; crab.v = (x < crab.x ? 1 : -1) * 220; Sfx.tone(1200, 0.05, 'square', 0.06); Sfx.tone(1200, 0.05, 'square', 0.06, 0.12); popText('チョキチョキ', crab.x, crab.y - 50, '#e8394a', 28); return; }
  for (const s of shells) if (Math.hypot(s.x - x, s.y - y) < 26) { s.hop = 1; Sfx.tone(rand(900, 1300), 0.12, 'sine', 0.1); return; }
  if (y > seaY + 30 && y < groundY + 10 && !wave) { for (let i = 0; i < 6; i++) sparks.push({ x, y, vx: rand(-80, 80), vy: rand(-200, -80), life: 0.6, water: true }); Sfx.noise(0.25, 0.12, 1500); return; }
  if (y > groundY - 10) {
    if (shells.length > 24) shells.shift();
    shells.push({ x, y: Math.max(y, groundY + 6), e: pick(['🐚', '🐚', '⭐', '🦪', '🪸']), hop: 1 });
    Sfx.tone(rand(500, 800), 0.1, 'sine', 0.1, 0, 300);
  }
});

// マルチ: なかまが さわった 🦀 を、この がめんでも おなじ 🦀 として さわる
iroGrab(() => crab ? [crab] : [], (c) => [c.x, c.y], 44);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
  for (const tw of towers) { tw.h += (tw.th - tw.h) * Math.min(1, dt * 6); tw.squash = Math.max(0, tw.squash - dt * 3); }
  for (const p of plops) p.t += dt;
  plops = plops.filter(p => p.t < 0.6);
  // なみ
  if (waveT > 0) { waveT -= dt; if (waveT <= 0) { wave = { k: 0, dir: 1 }; Sfx.noise(1.9, 0.3, 600); popText('ざぶーん！', W / 2, seaY + 40, '#1a5fb3', 50); } }
  if (wave) {
    wave.k += wave.dir * dt * (wave.dir > 0 ? 0.7 : 0.45);
    const wy = seaY + (H - seaY) * wave.k;
    if (wave.dir > 0) for (const tw of towers) if (wy > groundY - tw.h * 80) { tw.th = 0; tw.h = Math.max(0, tw.h - dt * 2); tw.flag = false; tw.win = false; }
    if (wave.k >= 0.85 && wave.dir > 0) { wave.dir = -1; for (let i = 0; i < 6; i++) shells.push({ x: rand(30, W - 30), y: rand(groundY + 10, H - 40), e: pick(['🐚', '⭐', '🐚', '🦪']), hop: 1 }); }
    if (wave.k <= 0 && wave.dir < 0) { wave = null; towers = []; extras = 0; while (shells.length > 24) shells.shift(); Sfx.chime(); }
  }
  // かに
  crabT -= dt;
  if (!crab && crabT < 0 && !wave) { const side = Math.random() < 0.5; crab = iroTag({ x: side ? -40 : W + 40, y: groundY + 50 + rand(0, 40), v: side ? 60 : -60, snip: 0, t: 0 }); }
  if (crab) { crab.t += dt; crab.snip = Math.max(0, crab.snip - dt); crab.x += crab.v * dt; if (crab.x < -60 || crab.x > W + 60) { crab = null; crabT = rand(6, 12); } }
  for (const s of shells) s.hop = Math.max(0, s.hop - dt * 2.5);
  for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 600 * dt; s.life -= dt; }
  sparks = sparks.filter(s => s.life > 0);
  draw(t);
  requestAnimationFrame(loop);
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawEmoji(ctx, '☀️', W - 80, 110, 60);
  // うみ と すな
  ctx.fillStyle = '#2f9be0'; ctx.fillRect(0, seaY, W, groundY - seaY + 30);
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  for (let i = 0; i < 4; i++) { const y = seaY + 20 + i * (groundY - seaY) / 4 + Math.sin(t * 1.5 + i) * 4; ctx.fillRect(0, y, W, 2); }
  ctx.fillStyle = '#f2d59a'; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, groundY + Math.sin(x / 50 + t * 1.2) * 4);
  ctx.lineTo(W + 20, H); ctx.fill();
  for (const s of shells) drawEmoji(ctx, s.e, s.x, s.y - Math.sin(s.hop * Math.PI) * 18, 26);
  // おしろ
  if (towers.length >= 2 && extras >= 2) { const a = towers[0], b = towers[towers.length - 1]; ctx.fillStyle = '#e2bf7c'; ctx.fillRect(a.x, groundY - 46, b.x - a.x, 46); ctx.fillStyle = '#d4ad66'; for (let x = a.x; x < b.x; x += 18) ctx.fillRect(x, groundY - 56, 10, 12); ctx.fillStyle = '#6b4a2a'; ctx.beginPath(); ctx.arc(W / 2, groundY - 2, 18, Math.PI, 0); ctx.fill(); }
  for (const tw of towers) {
    const h = tw.h * 80, w = tw.w * (1 + tw.squash * 0.15), x = tw.x, y = groundY;
    if (h < 2) continue;
    ctx.fillStyle = '#e8c788'; ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x - w * 0.42, y - h); ctx.lineTo(x + w * 0.42, y - h); ctx.lineTo(x + w / 2, y); ctx.fill();
    ctx.fillStyle = '#d4ad66'; for (let k = 0; k < 3; k++) ctx.fillRect(x - w * 0.42 + k * w * 0.32, y - h - 10, w * 0.2, 10);
    ctx.strokeStyle = 'rgba(160,120,60,.4)'; ctx.lineWidth = 2; for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(x - w * 0.45, y - h * k / 4); ctx.lineTo(x + w * 0.45, y - h * k / 4); ctx.stroke(); }
    if (tw.win) { ctx.fillStyle = '#6b4a2a'; ctx.beginPath(); ctx.arc(x, y - h * 0.6, w * 0.12, Math.PI, 0); ctx.fillRect(x - w * 0.12, y - h * 0.6, w * 0.24, w * 0.18); ctx.fill(); }
    if (tw.flag) { ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - h - 10); ctx.lineTo(x, y - h - 50); ctx.stroke(); drawEmoji(ctx, '🚩', x + 12, y - h - 40, 28); }
  }
  for (const p of plops) { ctx.fillStyle = `rgba(242,213,154,${1 - p.t / 0.6})`; for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * 60 * p.t, groundY - 10 - Math.abs(Math.sin(a)) * 50 * p.t, 5, 0, 7); ctx.fill(); } }
  if (crab) { ctx.save(); ctx.translate(crab.x, crab.y - Math.abs(Math.sin(crab.t * 12)) * 3); ctx.rotate(Math.sin(crab.snip * 30) * 0.2); drawEmoji(ctx, '🦀', 0, 0, 44); ctx.restore(); }
  // おおきな なみ
  if (wave) {
    const wy = seaY + (H - seaY) * wave.k;
    ctx.fillStyle = 'rgba(47,155,224,.85)'; ctx.beginPath(); ctx.moveTo(0, seaY);
    ctx.lineTo(W, seaY); for (let x = W; x >= 0; x -= 15) ctx.lineTo(x, wy + Math.sin(x / 30 + t * 6) * 10); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; for (let x = 0; x < W; x += 24) { ctx.beginPath(); ctx.arc(x, wy + Math.sin(x / 30 + t * 6) * 10, 9, 0, 7); ctx.fill(); }
  }
  for (const s of sparks) { ctx.fillStyle = s.water ? `rgba(200,235,255,${s.life})` : `hsla(${s.hue},90%,60%,${s.life})`; ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 7); ctx.fill(); }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
