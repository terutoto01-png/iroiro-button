<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>はしれ</title>
<link rel="stylesheet" href="common.css?v=23">
<style>
  body { background: #7cc6ff; }
  #bg, #fx, #fg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fx, #fg { pointer-events: none; }
  .big-btn { --c1: #ff6a3d; --c2: #b8401c; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<canvas id="fg"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">👟</span></button></div>
<script src="common.js?v=19"></script>
<script src="gpu-particles.js?v=3"></script>
<script>
// はしれ（WebGPU ばん）: れんだ するほど はやく はしる。
// はいけいは シェーダーで なんまいも かさねて ながし、はしった きょりで あさ→ひる→ゆうがた→よる に かわる。
// さいこうそくで ターボ（にじの しっぽ・ざんぞう）。
const bg = document.getElementById('bg'), fg = document.getElementById('fg'), fgx = fg.getContext('2d');
const btn = document.getElementById('btn');
const RUNNERS = ['🐕', '🐎', '🐆', '🐇', '🐈', '🦖', '🐖', '🐓', '🦔', '🐄'];
const PROPS = ['🌳', '🌲', '🌷', '🏠', '🌻', '🪨', '🌼', '🏡', '🍄'];
const MAX = 2400;
let runner = pick(RUNNERS), speed = 0, dist = 0, bob = 0, turbo = 0, ghosts = [], dpr = 1;
const props = Array.from({ length: 12 }, (_, i) => ({ x: i * 240 + rand(0, 120), e: pick(PROPS), s: rand(55, 95) }));
const tufts = Array.from({ length: 10 }, (_, i) => ({ x: i * 160 + rand(0, 80), s: rand(40, 70) }));

const SKY = /* wgsl */`
struct U { res: vec2f, time: f32, dist: f32, speed: f32, day: f32, dpr: f32, turbo: f32 };
@group(0) @binding(0) var<uniform> u: U;
@vertex
fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  var p = array<vec2f, 3>(vec2f(-1.0, -3.0), vec2f(-1.0, 1.0), vec2f(3.0, 1.0));
  return vec4f(p[i], 0.0, 1.0);
}
fn hash(p: vec2f) -> f32 { return fract(sin(dot(p, vec2f(127.1, 311.7))) * 43758.5453); }
fn noise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2f(1.0, 0.0)), w.x), mix(hash(i + vec2f(0.0, 1.0)), hash(i + vec2f(1.0, 1.0)), w.x), w.y);
}
fn fbm(p0: vec2f) -> f32 {
  var p = p0; var v = 0.0; var a = 0.5;
  for (var i = 0; i < 5; i = i + 1) { v = v + a * noise(p); p = p * 2.02; a = a * 0.5; }
  return v;
}
fn hsv(h: f32, s: f32, v: f32) -> vec3f {
  let k = vec3f(1.0, 2.0 / 3.0, 1.0 / 3.0);
  let p = abs(fract(vec3f(h) + k) * 6.0 - 3.0);
  return v * mix(vec3f(1.0), clamp(p - 1.0, vec3f(0.0), vec3f(1.0)), s);
}
// あさ・ひる・ゆうがた・よる の いろを なめらかに つなぐ
fn pal(d: f32, a: vec3f, b: vec3f, c: vec3f, e: vec3f) -> vec3f {
  let t = fract(d) * 4.0;
  let k = smoothstep(0.0, 1.0, fract(t));
  if (t < 1.0) { return mix(a, b, k); }
  if (t < 2.0) { return mix(b, c, k); }
  if (t < 3.0) { return mix(c, e, k); }
  return mix(e, a, k);
}
@fragment
fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let p = fc.xy / u.dpr;
  let W = u.res.x / u.dpr; let H = u.res.y / u.dpr;
  let gy = H * 0.64;
  let night = smoothstep(0.55, 0.7, fract(u.day)) * (1.0 - smoothstep(0.88, 1.0, fract(u.day)));
  // そら
  let top = pal(u.day, vec3f(0.45, 0.7, 1.0), vec3f(0.3, 0.6, 1.0), vec3f(0.35, 0.25, 0.6), vec3f(0.03, 0.04, 0.15));
  let hor = pal(u.day, vec3f(1.0, 0.85, 0.75), vec3f(0.75, 0.9, 1.0), vec3f(1.0, 0.55, 0.3), vec3f(0.12, 0.1, 0.3));
  var col = mix(top, hor, pow(clamp(p.y / gy, 0.0, 1.0), 1.4));
  // ほし（よる）
  let st = hash(floor(p / 3.0));
  if (st > 0.995 && p.y < gy) { col = col + vec3f(0.9) * night * (0.6 + 0.4 * sin(u.time * 3.0 + st * 80.0)); }
  // おひさま / おつきさま
  let sunPos = vec2f(W * 0.78, H * (0.12 + 0.25 * night));
  let sd = distance(p, sunPos);
  let sunCol = mix(vec3f(1.0, 0.92, 0.6), vec3f(0.95, 0.95, 1.0), night);
  col = col + sunCol * (smoothstep(46.0, 42.0, sd) + exp(-sd / 90.0) * 0.45);
  // くも
  let cl = fbm(vec2f((p.x + u.dist * 0.04) * 0.004, p.y * 0.012 + 3.0));
  let band = smoothstep(gy * 0.75, gy * 0.1, p.y);
  col = mix(col, mix(vec3f(1.0), hor, 0.3) * (1.0 - night * 0.6), smoothstep(0.55, 0.75, cl) * band * 0.85);
  // スピードの ひかり（そらに よこの すじ）
  let sk = noise(vec2f(p.y * 0.25, (p.x + u.time * 2500.0) * 0.0015));
  col = col + vec3f(1.0) * smoothstep(0.8, 1.0, sk) * smoothstep(0.4, 1.0, u.speed) * 0.25 * band;
  // とおくの やま
  let m1 = gy - 70.0 - 170.0 * fbm(vec2f((p.x + u.dist * 0.07) * 0.0025, 1.3));
  if (p.y > m1) {
    var mc = mix(vec3f(0.45, 0.55, 0.8), hor, 0.45) * (1.0 - night * 0.7);
    if (p.y < m1 + 18.0 && m1 < gy - 170.0) { mc = mix(mc, vec3f(1.0), 0.7 * (1.0 - night * 0.6)); } // ゆき
    col = mc;
  }
  // てまえの おか
  let m2 = gy - 25.0 - 70.0 * fbm(vec2f((p.x + u.dist * 0.3) * 0.005, 7.1));
  if (p.y > m2) { col = mix(vec3f(0.35, 0.7, 0.35), hor * 0.4, 0.15) * (1.0 - night * 0.65) * (0.9 + 0.1 * noise(p * 0.05)); }
  // じめん（くさはら と みち）
  if (p.y > gy) {
    let dy = p.y - gy;
    let stripe = step(0.5, fract((p.x + u.dist) / 90.0 - dy * 0.006));
    var gc = mix(vec3f(0.42, 0.78, 0.36), vec3f(0.36, 0.7, 0.3), stripe);
    let road = smoothstep(18.0, 22.0, dy) * (1.0 - smoothstep(78.0, 82.0, dy));
    let pebble = noise(vec2f((p.x + u.dist) * 0.08, dy * 0.08));
    gc = mix(gc, vec3f(0.85, 0.7, 0.5) * (0.9 + 0.15 * pebble), road);
    col = gc * (1.0 - night * 0.6);
  }
  // ターボ: がめんの ふちが にじいろに ひかる
  let e = max(abs(p.x / W - 0.5), abs(p.y / H - 0.5)) * 2.0;
  col = col + hsv(fract(u.time * 0.8 + p.y / H * 0.5), 0.8, 1.0) * smoothstep(0.75, 1.0, e) * u.turbo * 0.8;
  return vec4f(col, 1.0);
}`;

btn.addEventListener('pointerdown', () => {
  speed = Math.min(MAX, speed + 170 + speed * 0.08);
  Sfx.tone(300 + speed * 0.3, 0.06, 'square', 0.05);
  if (window.__burst) window.__burst();
});

// はしる おんがく（オリジナルの みじかい くりかえし）
const MELO = [0, 4, 7, 4, 9, 7, 4, 2, 0, 2, 4, 7, 12, 7, 4, 0];
let mi = 0, nextBeat = 0, wasTurbo = false;
function music(now) {
  if (speed < 40) { nextBeat = now; return; }
  const interval = Math.max(70, 420 - speed * 0.15);
  if (now < nextBeat) return;
  nextBeat = now + interval;
  const n = MELO[mi++ % MELO.length];
  Sfx.tone(392 * Math.pow(2, n / 12), interval / 1000 * 0.9, 'triangle', 0.1);
  if (mi % 2 === 0) Sfx.tone(98 * Math.pow(2, (MELO[(mi + 8) % 16] % 12) / 12), interval / 1000, 'sine', 0.12);
  if (mi % 4 === 0) Sfx.noise(0.05, 0.3, 4000, 0, 'highpass');
  if (turbo > 0.5 && mi % 2 === 1) Sfx.tone(784 * Math.pow(2, n / 12), interval / 1000 * 0.6, 'square', 0.04);
}

(async () => {
  // はいけい（シェーダー）
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const ctx = bg.getContext('webgpu'), format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });
  const mod = device.createShaderModule({ code: SKY });
  const pipe = device.createRenderPipeline({ layout: 'auto', vertex: { module: mod, entryPoint: 'vs' }, fragment: { module: mod, entryPoint: 'fs', targets: [{ format }] } });
  const ubuf = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bgg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });
  const resize = () => { dpr = fitCanvas(bg); fitCanvas(fg, fgx); };
  resize(); addEventListener('resize', resize);

  // ひかりの つぶ（すなけむり・スピードせん・にじの しっぽ）
  const sys = await GPUParticles.create(document.getElementById('fx'), { count: 40000 });
  sys.params.drag = 0.8;
  const runnerPos = () => {
    const W = innerWidth, H = innerHeight, gy = H * 0.64;
    return { x: W * 0.32 + Math.min(1, speed / MAX) * W * 0.16, y: gy + 50 };
  };
  window.__burst = () => {
    const r = runnerPos(), list = [];
    for (let i = 0; i < 26; i++) {
      const a = -Math.PI * rand(0.1, 0.9), sp = rand(150, 450);
      const c = GPUParticles.hsv(Math.random(), 0.5, 1);
      list.push({ x: r.x - 20, y: r.y, vx: Math.cos(a) * sp - speed * 0.3, vy: Math.sin(a) * sp, r: c[0], g: c[1], b: c[2], life: rand(0.5, 1), size: rand(6, 11), shape: 3 });
    }
    sys.emit(list);
  };

  sys.start((dt, t) => {
    const now = performance.now(), W = innerWidth, H = innerHeight, gy = H * 0.64;
    speed *= Math.pow(0.45, dt);
    if (speed < 5) speed = 0;
    dist += speed * dt;
    bob += dt * (4 + speed / 120);
    turbo += ((speed > MAX * 0.85 ? 1 : 0) - turbo) * Math.min(1, dt * 3);
    if (turbo > 0.5 && !wasTurbo) { wasTurbo = true; Sfx.tone(400, 0.6, 'sawtooth', 0.08, 0, 1600); popText('ターボ！', W / 2, H * 0.3, '#fff', 72); }
    if (turbo < 0.2) wasTurbo = false;
    music(now);

    // はいけい
    device.queue.writeBuffer(ubuf, 0, new Float32Array([bg.width, bg.height, t, dist % 400000, Math.min(1, speed / MAX), dist / 90000 + 0.1, dpr, turbo]) /* きょりは シェーダーの せいど の ために まるめる */);
    const enc = device.createCommandEncoder();
    const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store' }] });
    pass.setPipeline(pipe); pass.setBindGroup(0, bgg); pass.draw(3); pass.end();
    device.queue.submit([enc.finish()]);

    // つぶ
    const r = runnerPos(), list = [], s01 = speed / MAX;
    if (speed > 80) for (let i = 0; i < 2 + s01 * 6; i++) // すなけむり
      list.push({ x: r.x - 25 + rand(-10, 10), y: r.y + rand(-4, 6), vx: -speed * rand(0.3, 0.6), vy: -rand(20, 120), r: 0.9, g: 0.75, b: 0.5, life: rand(0.3, 0.7), size: rand(5, 10) });
    if (speed > 500) for (let i = 0; i < s01 * 5; i++) // スピードせん
      list.push({ x: W + 60, y: rand(20, H - 40), vx: -speed * rand(2.0, 3.2), vy: 0, r: 0.85, g: 0.95, b: 1, life: 0.6, size: rand(2.5, 4.5), shape: 4 });
    if (turbo > 0.3) for (let i = 0; i < 8; i++) { // にじの しっぽ
      const c = GPUParticles.hsv((t * 0.7 + i / 8) % 1, 0.8, 1);
      list.push({ x: r.x - 30, y: r.y - 55 + (i - 4) * 6, vx: -speed * 0.9, vy: rand(-10, 10), r: c[0] * turbo, g: c[1] * turbo, b: c[2] * turbo, life: 0.7, size: 9 });
    }
    if (list.length) sys.emit(list);

    // き や いえ・はしる こ（2D）
    fgx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fgx.clearRect(0, 0, W, H);
    const span = 240 * props.length;
    for (const p of props) {
      const x = ((p.x - dist * 0.85) % span + span) % span - 100;
      if (x < W + 100) drawEmoji(fgx, p.e, x, gy + 8 - p.s * 0.45, p.s);
    }
    const jump = Math.abs(Math.sin(bob)) * (10 + Math.min(40, speed / 50));
    const ry = gy + 50 - 52 - jump;
    // かげ
    fgx.fillStyle = 'rgba(0,0,0,0.18)'; fgx.beginPath(); fgx.ellipse(r.x, gy + 54, 50 - jump * 0.4, 9, 0, 0, 7); fgx.fill();
    // ざんぞう（ターボ）
    ghosts.unshift({ x: r.x, y: ry, a: -Math.min(0.25, speed / 6000) });
    ghosts.length = Math.min(ghosts.length, 6);
    if (turbo > 0.3) ghosts.forEach((g, i) => {
      if (i === 0) return;
      fgx.save(); fgx.globalAlpha = (1 - i / 6) * 0.35 * turbo; fgx.translate(g.x - i * 18, g.y); fgx.rotate(g.a); fgx.scale(-1, 1);
      drawEmoji(fgx, runner, 0, 0, 120); fgx.restore();
    });
    fgx.globalAlpha = 1;
    fgx.save(); fgx.translate(r.x, ry); fgx.rotate(-Math.min(0.25, speed / 6000)); fgx.scale(-1, 1);
    drawEmoji(fgx, runner, 0, 0, 120);
    fgx.restore();
    // てまえの くさ（いちばん はやく ながれる）
    const tspan = 160 * tufts.length;
    for (const tf of tufts) {
      const x = ((tf.x - dist * 1.35) % tspan + tspan) % tspan - 60;
      if (x < W + 60) drawEmoji(fgx, '🌿', x, H - tf.s * 0.3, tf.s);
    }
  });
})();
</script>
</body>
</html>
