<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>びよーん</title>
<link rel="stylesheet" href="common.css?v=23">
<style>
  body { background: linear-gradient(#a6e3ff, #e6f7ff 80%, #9bd27a 80%); }
  .big-btn { --c1: #ff5a5a; --c2: #c22f2f; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🎈</span></button></div>
<script src="common.js?v=20"></script>
<script>
// びよーん: ボールを うしろに ひっぱって はなすと とんでいって ふうせんを わる
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx);
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); });
const BALLS = ['⚽', '🏀', '🍎', '🍊', '🐣', '⭐', '🍩', '🐸'];
const COLORS = ['#ff4d6d', '#ffb703', '#4cc9f0', '#80ed99', '#b388ff', '#ff8fab'];
let ballE = '⚽', ball, drag = null, balloons = [], bits = [], creak = 0, idle = 0;

const anchor = () => ({ x: Math.max(120, innerWidth * 0.18), y: innerHeight * 0.62 });
const R = 34, MAXPULL = 190, POWER = 8, LIFT = 380, GRAV = 600; // LIFT: うえむきに すこし たす
function launchVel(dx, dy) { return { vx: dx * POWER, vy: dy * POWER - LIFT }; }
function resetBall() { const a = anchor(); ball = { x: a.x, y: a.y, vx: 0, vy: 0, fly: false }; idle = 0; }
function newBalloons() {
  balloons = [];
  const n = 6;
  for (let i = 0; i < n; i++) {
    balloons.push({ x: rand(innerWidth * 0.42, innerWidth - 80), y: rand(innerHeight * 0.14, innerHeight * 0.6), r: rand(36, 48),
                    c: pick(COLORS), ph: rand(0, 6), pop: false });
  }
}

cv.addEventListener('pointerdown', (e) => {
  if (ball.fly) return;
  if (Math.hypot(e.clientX - ball.x, e.clientY - ball.y) > 140) return;
  cv.setPointerCapture(e.pointerId);
  drag = e.pointerId;
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== drag) return;
  const a = anchor();
  let dx = e.clientX - a.x, dy = e.clientY - a.y;
  const d = Math.hypot(dx, dy);
  if (d > MAXPULL) { dx *= MAXPULL / d; dy *= MAXPULL / d; }
  const before = Math.hypot(ball.x - a.x, ball.y - a.y);
  ball.x = a.x + dx; ball.y = a.y + dy;
  creak += Math.abs(Math.min(d, MAXPULL) - before);
  if (creak > 25) { creak = 0; Sfx.tone(200 + Math.min(d, MAXPULL) * 3, 0.06, 'triangle', 0.08); } // ぎゅぎゅ
});
const release = (e) => {
  if (e.pointerId !== drag) return;
  drag = null;
  const a = anchor(), dx = a.x - ball.x, dy = a.y - ball.y;
  if (Math.hypot(dx, dy) < 20) { resetBall(); return; }
  const v = launchVel(dx, dy);
  ball.vx = v.vx; ball.vy = v.vy; ball.fly = true;
  Sfx.tone(700, 0.35, 'triangle', 0.2, 0, 150); // びよーん
};
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

btn.addEventListener('pointerdown', () => {
  ballE = pick(BALLS.filter(b => b !== ballE));
  newBalloons(); resetBall();
  Sfx.chime();
});

function popBalloon(b) {
  b.pop = true;
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(150, 450);
    bits.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.7, c: b.c });
  }
  Sfx.noise(0.25, 0.9, 3000); Sfx.tone(rand(600, 900), 0.1, 'square', 0.08);
  if (balloons.every(x => x.pop)) setTimeout(() => { Sfx.yay(); popText('ぜんぶ わった！', innerWidth / 2, innerHeight * 0.3, '#fff', 56); }, 300);
}

resetBall(); newBalloons(); // うごかしはじめる まえに じゅんび
let lastT = performance.now();
(function loop(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now;
  const W = innerWidth, H = innerHeight, G = H * 0.8, a = anchor();
  if (ball.fly) {
    ball.vy += GRAV * dt; ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    if (ball.y > G - R) { ball.y = G - R; ball.vy *= -0.55; ball.vx *= 0.85; if (Math.abs(ball.vy) > 80) Sfx.tone(160, 0.08, 'sine', 0.2); }
    if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx) * 0.7; }
    if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx) * 0.7; }
    if (ball.y < R) { ball.y = R; ball.vy = Math.abs(ball.vy) * 0.7; }
    for (const b of balloons) if (!b.pop && Math.hypot(b.x - ball.x, b.y + Math.sin(b.ph) * 8 - ball.y) < b.r + R) popBalloon(b);
    idle += dt;
    if (idle > 4.5 || (Math.abs(ball.vx) < 15 && ball.y >= G - R - 1)) resetBall();
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // ふうせん
  for (const b of balloons) {
    if (b.pop) continue;
    b.ph += dt * 1.5;
    const y = b.y + Math.sin(b.ph) * 8;
    ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x, y + b.r); ctx.quadraticCurveTo(b.x + 10, y + b.r + 30, b.x, y + b.r + 60); ctx.stroke();
    ctx.fillStyle = b.c; ctx.beginPath(); ctx.ellipse(b.x, y, b.r * 0.85, b.r, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(b.x - b.r * 0.3, y - b.r * 0.4, b.r * 0.15, b.r * 0.25, -0.5, 0, 7); ctx.fill();
  }
  for (const p of bits) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt;
    ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, p.life / 0.7);
    ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
  }
  ctx.globalAlpha = 1;
  bits = bits.filter(p => p.life > 0);
  // パチンコの だい
  const fl = { x: a.x - 34, y: a.y - 10 }, fr = { x: a.x + 34, y: a.y - 10 };
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(a.x, G); ctx.lineTo(a.x, a.y + 40); ctx.lineTo(fl.x, fl.y); ctx.moveTo(a.x, a.y + 40); ctx.lineTo(fr.x, fr.y); ctx.stroke();
  // ゴム
  if (!ball.fly) {
    ctx.strokeStyle = '#d64545'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(fl.x, fl.y); ctx.lineTo(ball.x, ball.y); ctx.lineTo(fr.x, fr.y); ctx.stroke();
  }
  // ひっぱっている あいだは とんでいく みちを てんてんで みせる
  if (drag !== null) {
    let v = launchVel(a.x - ball.x, a.y - ball.y), x = ball.x, y = ball.y, vx = v.vx, vy = v.vy;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 1; i <= 28; i++) {
      for (let k = 0; k < 3; k++) { vy += GRAV * 0.02; x += vx * 0.02; y += vy * 0.02; }
      if (y > G - R || x < 0 || x > W || y < 0) break;
      ctx.beginPath(); ctx.arc(x, y, 6 - i * 0.15, 0, 7); ctx.fill();
    }
  }
  drawEmoji(ctx, ballE, ball.x, ball.y, R * 2);
  // ひっぱれるよ の ゆびの めじるし（しばらく さわらないと ゆらゆら）
  if (!ball.fly && !drag) {
    const t = now / 600;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 2);
    drawEmoji(ctx, '👆', ball.x - 30 - Math.abs(Math.sin(t)) * 40, ball.y + 60, 50);
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(loop);
})(lastT);
</script>
</body>
</html>
