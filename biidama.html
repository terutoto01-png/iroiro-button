<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>ビーだま</title>
<link rel="stylesheet" href="common.css?v=16">
<style>
  body { background: radial-gradient(circle, #f7efe0, #d9c3a0); }
  .big-btn { --c1: #5b8cff; --c2: #2f55b8; }
  .bottom-center { bottom: auto; top: 50%; transform: translate(-50%, -50%); }
  .bottom-center .big-btn { width: min(26vw, 130px); height: min(26vw, 130px); }
  canvas.full { touch-action: none; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🔮</span></button></div>
<script src="common.js?v=15"></script>
<script>
// ビーだま: iPad を かたむけると ころがる（センサーが ないときは したに おちる）
// みぎしたの あなに ちかづくと すいこまれて、くるくる まわって おちる
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d');
const btn = document.getElementById('btn');
fitCanvas(canvas, ctx); addEventListener('resize', () => fitCanvas(canvas, ctx));
let falling = [], balls = [], grav = { x: 0, y: 1 }, sensor = false, asked = false, lastClick = 0;

function onTilt(e) {
  if (e.beta == null) return;
  sensor = true;
  const gx = Math.sin(e.gamma * Math.PI / 180), gy = Math.sin(e.beta * Math.PI / 180);
  const a = ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * Math.PI / 180;
  grav.x = gx * Math.cos(a) + gy * Math.sin(a);
  grav.y = -gx * Math.sin(a) + gy * Math.cos(a);
}
async function askSensor() {
  if (asked) return; asked = true;
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    }
    addEventListener('deviceorientation', onTilt);
  } catch (e) {}
}

btn.addEventListener('pointerdown', () => {
  askSensor();
  const r = btn.getBoundingClientRect();
  for (let i = 0; i < 3; i++) {
    const a = Math.random() * Math.PI * 2;
    balls.push({ x: r.left + r.width / 2 + Math.cos(a) * 90, y: r.top + r.height / 2 + Math.sin(a) * 90,
                 vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, r: rand(18, 32), hue: rand(0, 360), swirl: rand(0, 6) });
  }
  if (balls.length > 45) balls.splice(0, balls.length - 45);
  Sfx.tone(rand(900, 1300), 0.12, 'sine', 0.25, 0, 2000);
});

// ゆびで はじく
canvas.addEventListener('pointerdown', (e) => {
  for (const b of balls) {
    const dx = b.x - e.clientX, dy = b.y - e.clientY, d = Math.hypot(dx, dy);
    if (d < b.r * 3) { b.vx += dx / (d + 1) * 700; b.vy += dy / (d + 1) * 700; }
  }
});

function click(v) {
  const now = performance.now();
  if (v < 120 || now - lastClick < 40) return;
  lastClick = now;
  Sfx.tone(rand(2000, 3200), 0.04, 'sine', Math.min(0.25, v / 3000));
}

function holeAt() {
  const r = Math.max(34, Math.min(60, Math.min(innerWidth, innerHeight) * 0.085));
  return { x: innerWidth - r - 6, y: innerHeight - r - 6, r }; // かどに よせる（おくに たまらない ように）
}
function dropSound() { // ころころ… ぽとん
  for (let i = 0; i < 5; i++) Sfx.tone(1400 - i * 180, 0.06, 'sine', 0.12, i * 0.09);
  Sfx.tone(180, 0.25, 'sine', 0.3, 0.55, 90);
}
function drawBall(b) {
  const g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1, b.x, b.y, b.r);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.35, `hsla(${b.hue}, 80%, 70%, 0.55)`);
  g.addColorStop(1, `hsla(${b.hue}, 80%, 35%, 0.85)`);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(b.x + 4, b.y + b.r * 0.8, b.r * 0.9, b.r * 0.3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  ctx.strokeStyle = `hsla(${b.hue + 150}, 90%, 55%, 0.8)`; ctx.lineWidth = b.r * 0.18;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, b.swirl, b.swirl + 2.2); ctx.stroke();
}

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  const W = innerWidth, H = innerHeight, G = 1500;
  const hole = holeAt();
  for (const b of balls) {
    // あなの ちかくは すこし ひきこまれる（すりばち）
    const hx = hole.x - b.x, hy = hole.y - b.y, hd = Math.hypot(hx, hy);
    if (hd < hole.r * 2.2) { const k = (1 - hd / (hole.r * 2.2)) * 2600; b.vx += hx / (hd + 1) * k * dt; b.vy += hy / (hd + 1) * k * dt; }
    if (hd < hole.r - b.r * 0.4) { b.gone = true; falling.push({ ...b, a: Math.atan2(-hy, -hx), d: hd, t: 0 }); dropSound(); continue; }
    b.vx += grav.x * G * dt; b.vy += grav.y * G * dt;
    b.vx *= Math.pow(0.7, dt); b.vy *= Math.pow(0.7, dt);
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.swirl += (b.vx + b.vy) / b.r * dt * 0.5;
    if (b.x < b.r) { click(Math.abs(b.vx)); b.x = b.r; b.vx = Math.abs(b.vx) * 0.6; }
    if (b.x > W - b.r) { click(Math.abs(b.vx)); b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.6; }
    if (b.y < b.r) { click(Math.abs(b.vy)); b.y = b.r; b.vy = Math.abs(b.vy) * 0.6; }
    if (b.y > H - b.r) { click(Math.abs(b.vy)); b.y = H - b.r; b.vy = -Math.abs(b.vy) * 0.6; }
  }
  for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
    const a = balls[i], b = balls[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (d > 0 && d < min) {
      const nx = dx / d, ny = dy / d, over = (min - d) / 2;
      a.x -= nx * over; a.y -= ny * over; b.x += nx * over; b.y += ny * over;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) {
        const imp = -rv * 0.9;
        a.vx -= nx * imp; a.vy -= ny * imp; b.vx += nx * imp; b.vy += ny * imp;
        click(-rv);
      }
    }
  }
  balls = balls.filter(b => !b.gone);
  ctx.clearRect(0, 0, W, H);
  // あな
  const hg = ctx.createRadialGradient(hole.x, hole.y, hole.r * 0.2, hole.x, hole.y, hole.r * 1.25);
  hg.addColorStop(0, '#1b120a'); hg.addColorStop(0.75, '#3b2a18'); hg.addColorStop(0.8, '#a88458'); hg.addColorStop(1, 'rgba(168,132,88,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hole.x, hole.y, hole.r * 1.25, 0, 7); ctx.fill();
  // おちていく ビーだま（くるくる まわって ちいさく くらく）
  for (const f of falling) {
    f.t += dt / 0.7;
    f.a += dt * 9; f.d = Math.max(0, f.d * Math.pow(0.02, dt));
    const k = Math.min(1, f.t), sc = 1 - k * 0.85;
    const x = hole.x + Math.cos(f.a) * f.d, y = hole.y + Math.sin(f.a) * f.d;
    ctx.save(); ctx.globalAlpha = 1 - k * 0.7; ctx.filter = `brightness(${1 - k * 0.7})`;
    drawBall({ ...f, x, y, r: f.r * sc }); ctx.restore();
  }
  falling = falling.filter(f => f.t < 1);
  for (const b of balls) drawBall(b);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
