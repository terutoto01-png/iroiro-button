<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>どうぶつベル</title>
<link rel="stylesheet" href="common.css?v=22">
<style>
  body { background: #fff4f8; }
  #cv { touch-action: none; }
  .big-btn { --c1: #ffd23f; --c2: #c49000; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🔔</span></button></div>
<script src="common.js?v=18"></script>
<script src="multi.js?v=1"></script>
<script>
// どうぶつベル: 8ひきの どうぶつを さわったり なぞったり すると ドレミファソラシドの ベルが なる！
// ボタンで みんなの えんそう（きらきらぼし・かえるのうた・ちょうちょう・よろこびのうた）。うえの ⭐ を さわると キラキラ ライブモード。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx), W = innerWidth, H = innerHeight;
const ANIMALS = [
  { e: '🐶', f: 523.25, c: '#ff5a5a' }, // ド
  { e: '🐱', f: 587.33, c: '#ff9f1c' }, // レ
  { e: '🐰', f: 659.25, c: '#ffd23f' }, // ミ
  { e: '🐻', f: 698.46, c: '#66bb44' }, // ファ
  { e: '🐼', f: 783.99, c: '#29b6f6' }, // ソ
  { e: '🐸', f: 880.00, c: '#5b8cff' }, // ラ
  { e: '🐷', f: 987.77, c: '#9b5cff' }, // シ
  { e: '🐥', f: 1046.5, c: '#ff6fae' }, // ド
];
// パブリックドメインの こどもの うた（[インデックス, タイミング秒] の かたまり）
const SONGS = [
  [ [[0,0],[0,.26],[4,.52],[4,.78]], [[5,0],[5,.26],[4,.52]], [[3,0],[3,.26],[2,.52],[2,.78]], [[1,0],[1,.26],[0,.52]] ], // きらきらぼし
  [ [[0,0],[1,.22],[2,.44],[3,.66]], [[2,0],[1,.24],[0,.48]], [[2,0],[3,.22],[4,.44],[5,.66]], [[4,0],[3,.24],[2,.48]] ], // かえるのうた
  [ [[4,0],[2,.24],[2,.48]], [[3,0],[1,.24],[1,.48]], [[0,0],[1,.2],[2,.4],[3,.6]], [[4,0],[4,.24],[4,.48]] ], // ちょうちょう
  [ [[2,0],[2,.22],[3,.44],[4,.66]], [[4,0],[3,.22],[2,.44],[1,.66]], [[0,0],[0,.22],[1,.44],[2,.66]], [[2,0],[1,.28],[1,.52]] ], // よろこびのうた
];
let players = ANIMALS.map(a => ({ ...a, x: 0, y: 0, r: 40, hop: 0, ring: 0 }));
let notes = [], sparks = [], stars = [], night = false, songI = 0, stepI = 0, timers = [], drag = null;

function layout() {
  const narrow = W < 620;
  const cols = narrow ? 4 : 8;
  const marginX = Math.max(24, W * 0.06);
  const usableW = W - marginX * 2;
  const r = Math.min(50, usableW / cols * 0.42);
  players.forEach((p, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    p.r = r;
    p.x = marginX + usableW * (col + 0.5) / cols;
    if (narrow) p.y = H * (row === 0 ? 0.36 : 0.62);
    else p.y = H * 0.56 - Math.sin((col + 0.5) / cols * Math.PI) * 34;
  });
  stars = Array.from({ length: 45 }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.7, p: rand(0, 6) }));
}
layout();
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); W = innerWidth; H = innerHeight; layout(); });

// キラキラした ハンドベルの おと
function playBell(i, remote) {
  const p = players[i];
  if (!p) return;
  if (!remote) Multi.send({ a: 'bell', i }, 30);
  p.hop = 1; p.ring = 1;
  const c = Sfx.ac(), t = c.currentTime;
  [[p.f, 0.22, 0.9], [p.f * 2, 0.08, 0.45], [p.f * 3, 0.04, 0.25]].forEach(([freq, vol, dur]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(Sfx.out());
    o.start(t); o.stop(t + dur + 0.04);
  });
  notes.push({ e: pick(['🎵', '♪', '♫', '✨']), x: p.x + rand(-14, 14), y: p.y - p.r - 12, vx: rand(-22, 22), vy: rand(-90, -55), c: p.c, life: 1.2 });
  for (let k = 0; k < 5; k++) sparks.push({ x: p.x, y: p.y - p.r * 0.6, vx: rand(-90, 90), vy: rand(-120, -30), c: p.c, life: 0.65 });
}

function clearTimers() { while (timers.length) clearTimeout(timers.pop()); }

btn.addEventListener('pointerdown', () => {
  clearTimers();
  const song = SONGS[songI], phrase = song[stepI];
  phrase.forEach(([idx, delay]) => timers.push(setTimeout(() => playBell(idx), delay * 1000)));
  stepI++;
  if (stepI >= song.length) {
    stepI = 0;
    songI = (songI + 1) % SONGS.length;
    timers.push(setTimeout(() => {
      players.forEach((_, idx) => timers.push(setTimeout(() => playBell(idx), idx * 55)));
      Sfx.yay(); popText('じょうず！', W / 2, H * 0.22, '#ff6fae', 52);
    }, 950));
  }
});

function hitPlayer(x, y) {
  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    if (Math.hypot(x - p.x, y - p.y) < p.r * 1.25) return i;
  }
  return -1;
}

cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY;
  // うえの ほし（ライブモード きりかえ）
  if (Math.hypot(x - W / 2, y - 92) < 48) {
    night = !night;
    Multi.send({ a: 'night', i: night ? 1 : 0 }, 200);
    Sfx.chime();
    popText(night ? 'ライブ！' : 'おひる！', W / 2, 160, night ? '#ffd23f' : '#ff6fae', 38);
    return;
  }
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const idx = hitPlayer(x, y);
  drag = { id: e.pointerId, last: idx };
  if (idx >= 0) playBell(idx);
});
cv.addEventListener('pointermove', (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  const idx = hitPlayer(e.clientX, e.clientY);
  if (idx >= 0 && idx !== drag.last) { drag.last = idx; playBell(idx); }
  else if (idx < 0) drag.last = -1;
});
const up = (e) => { if (drag && drag.id === e.pointerId) drag = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
Multi.join('beru', (msg) => {
  if (msg.a === 'bell' && typeof msg.i === 'number' && players[msg.i]) {
    const p = players[msg.i];
    playBell(msg.i, true);
    Multi.showPeer(msg, p.x, p.y - p.r);
  } else if (msg.a === 'night') {
    night = !!msg.i; Sfx.chime();
    Multi.showPeer(msg, W / 2, 92);
  }
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
  for (const p of players) { p.hop = Math.max(0, p.hop - dt * 2.8); p.ring = Math.max(0, p.ring - dt * 1.8); }
  for (const n of notes) { n.x += n.vx * dt; n.y += n.vy * dt; n.life -= dt; }
  notes = notes.filter(n => n.life > 0);
  for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 260 * dt; s.life -= dt; }
  sparks = sparks.filter(s => s.life > 0);
  draw(t);
  requestAnimationFrame(loop);
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (night) { g.addColorStop(0, '#16113a'); g.addColorStop(1, '#361d5c'); }
  else { g.addColorStop(0, '#fff0f6'); g.addColorStop(1, '#e8f4ff'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (night) {
    for (const s of stars) {
      ctx.fillStyle = `rgba(255,250,210,${0.35 + 0.65 * Math.sin(t * 3 + s.p)})`;
      ctx.fillRect(s.x, s.y, 3, 3);
    }
  }

  // ステージの カーテン（さゆう）
  ctx.fillStyle = night ? '#8e1c4a' : '#ff6fae';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W * 0.14, 0); ctx.quadraticCurveTo(W * 0.06, H * 0.4, 0, H * 0.55); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W * 0.86, 0); ctx.quadraticCurveTo(W * 0.94, H * 0.4, W, H * 0.55); ctx.fill();

  // うえの ほし（ライブスイッチ）
  ctx.strokeStyle = night ? '#ffd23f' : '#d8a6ff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, 86); ctx.stroke();
  ctx.save(); ctx.translate(W / 2, 92); ctx.rotate(Math.sin(t * 2) * 0.15);
  drawEmoji(ctx, night ? '🌙' : '⭐', 0, 0, 52); ctx.restore();

  // スポットライト と どうぶつ
  for (const p of players) {
    if (p.ring > 0) {
      ctx.save();
      const sg = ctx.createLinearGradient(p.x, 0, p.x, p.y + p.r);
      sg.addColorStop(0, p.c + '00'); sg.addColorStop(1, p.c + (night ? '66' : '38'));
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.moveTo(p.x - p.r * 0.35, 0); ctx.lineTo(p.x + p.r * 0.35, 0);
      ctx.lineTo(p.x + p.r * 1.15, p.y + p.r * 1.1); ctx.lineTo(p.x - p.r * 1.15, p.y + p.r * 1.1); ctx.fill();
      // おとの わっか
      ctx.strokeStyle = p.c; ctx.globalAlpha = p.ring * 0.8; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(p.x, p.y - p.r * 0.55, p.r * (0.6 + (1 - p.ring) * 1.1), 0, 7); ctx.stroke();
      ctx.restore();
    }
    const hop = Math.sin(p.hop * Math.PI) * 26;
    // お立ちだい
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.roundRect(p.x - p.r * 0.85, p.y + p.r * 0.48, p.r * 1.7, p.r * 0.52, 12); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.roundRect(p.x - p.r * 0.72, p.y + p.r * 0.54, p.r * 1.44, 7, 4); ctx.fill();
    // どうぶつ
    ctx.save(); ctx.translate(p.x, p.y - hop);
    const sc = 1 + Math.sin(p.hop * Math.PI) * 0.14; ctx.scale(sc, sc);
    drawEmoji(ctx, p.e, 0, 0, p.r * 1.45);
    ctx.restore();
    // ベル
    ctx.save(); ctx.translate(p.x + p.r * 0.55, p.y - p.r * 0.45 - hop);
    ctx.rotate(Math.sin(p.ring * 24) * p.ring * 0.55);
    drawEmoji(ctx, '🔔', 0, 0, p.r * 0.82);
    ctx.restore();
  }

  for (const n of notes) {
    ctx.globalAlpha = Math.min(1, n.life);
    if (n.e === '♪' || n.e === '♫') {
      ctx.font = 'bold 30px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = n.c; ctx.fillText(n.e, n.x, n.y);
    } else drawEmoji(ctx, n.e, n.x, n.y, 34);
    ctx.globalAlpha = 1;
  }
  for (const s of sparks) { ctx.fillStyle = s.c; ctx.globalAlpha = Math.min(1, s.life); ctx.beginPath(); ctx.arc(s.x, s.y, 4.5, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
