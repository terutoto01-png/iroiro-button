<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>クリスマスツリー</title>
<link rel="stylesheet" href="common.css?v=12">
<style>
  body { background: linear-gradient(#0b1638, #24306b 70%, #3a3f7a); }
  .big-btn { --c1: #e8394a; --c2: #9e1d2a; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🎄</span></button></div>
<script src="common.js?v=12"></script>
<script>
// クリスマスツリー: おすたびに かざりが ひとつ ふえる。ぜんぶ つくと てっぺんに ほしが のって ピカピカ ショー。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx);
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1567.98];
const KINDS = ['ball', 'ball', 'ball', 'bulb', 'bulb', '🍬', '🔔', '🎀', '🍭', '❄️'];
const COLORS = [0, 45, 200, 280, 330, 120, 50];
let slots = [], orn = [], gifts = [], star = null, show = 0, sparks = [], snow = [];
for (let i = 0; i < 70; i++) snow.push({ x: Math.random(), y: Math.random(), r: rand(1, 3), v: rand(15, 40), p: rand(0, 6) });

const L = () => {
  const W = innerWidth, H = innerHeight, bottom = Math.min(H - 20, btn.getBoundingClientRect().top - 20);
  const th = Math.min(bottom - 110, W * 1.25, 640), tw = th * 0.72;
  return { W, H, cx: W / 2, base: bottom - th * 0.1, th, tw };
};
// かざりの いち（ツリーの なかに ならべる。0〜1 の わりあい）
function makeSlots() {
  slots = [];
  const rows = [[0.25, 2], [0.4, 3], [0.55, 4], [0.7, 4], [0.85, 5]];
  for (const [y, n] of rows) for (let i = 0; i < n; i++) slots.push({ v: y, u: n === 1 ? 0 : (i / (n - 1) - 0.5) * 0.8 * y + rand(-0.02, 0.02) });
  slots.sort(() => Math.random() - 0.5);
}
function slotXY(s) { const { cx, base, th, tw } = L(); return { x: cx + s.u * tw, y: base - th * 0.95 + s.v * th * 0.88 }; }
makeSlots();
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); });

function burst(x, y, n, hue) {
  for (let i = 0; i < n; i++) { const a = rand(0, 7), sp = rand(60, 320); sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.4, 1), hue: hue ?? rand(0, 360) }); }
}

btn.addEventListener('pointerdown', () => {
  const { cx, base, th } = L();
  if (show > 0) { // ショーの あいだは きらきら ふやす
    if (show > 7) { reset(); return; }
    burst(rand(cx - 120, cx + 120), base - rand(0, th), 30); Sfx.tone(pick(NOTES) * 2, 0.4, 'triangle', 0.08); return;
  }
  if (orn.length < slots.length) {
    const s = slots[orn.length], p = slotXY(s), kind = pick(KINDS);
    orn.push({ s, kind, hue: pick(COLORS), t: 0, y0: -60 });
    Sfx.tone(NOTES[orn.length % NOTES.length], 0.5, 'triangle', 0.14);
    Sfx.tone(NOTES[orn.length % NOTES.length] * 2, 0.3, 'sine', 0.05, 0.05);
    if (orn.length % 4 === 0 && gifts.length < 6) gifts.push({ e: pick(['🎁', '🎁', '🧸', '🎁']), u: (gifts.length % 2 ? 1 : -1) * (0.2 + gifts.length * 0.06), t: 0 });
  } else if (!star) { // ほし！
    star = { t: 0 };
    Sfx.tone(1046, 0.8, 'sine', 0.12, 0, 2093);
  }
});
function reset() {
  for (const o of orn) { const p = slotXY(o.s); burst(p.x, p.y, 6, o.hue); }
  orn = []; gifts = []; star = null; show = 0; makeSlots();
  Sfx.noise(0.5, 0.4, 5000, 0, 'highpass');
}

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const { W, H, cx, base, th, tw } = L(), t = now / 1000;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // ゆき
  ctx.fillStyle = '#fff';
  for (const f of snow) { f.y += f.v * dt / H; f.p += dt; if (f.y > 1) { f.y = 0; f.x = Math.random(); } ctx.globalAlpha = 0.7; ctx.beginPath(); ctx.arc(f.x * W + Math.sin(f.p) * 10, f.y * H, f.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  // ゆきの じめん
  ctx.fillStyle = '#e8eefc'; ctx.beginPath(); ctx.ellipse(cx, base + 26, Math.max(W, tw * 1.4) * 0.6, 50, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(0, base + 25, W, H);

  const glowAll = show > 0 ? 0.5 + 0.5 * Math.sin(t * 3) : 0;
  // みき と ツリー（3だん）
  ctx.fillStyle = '#7a4a2a'; ctx.fillRect(cx - tw * 0.08, base - th * 0.1, tw * 0.16, th * 0.14);
  if (show > 0) { ctx.shadowColor = `hsl(${(t * 80) % 360}, 100%, 60%)`; ctx.shadowBlur = 30 + glowAll * 30; }
  for (let i = 0; i < 3; i++) {
    const top = base - th * (0.95 - i * 0.27), bot = base - th * (0.55 - i * 0.24), w = tw * (0.55 + i * 0.22);
    ctx.fillStyle = ['#2f9e4e', '#278a43', '#1f7638'][i];
    ctx.beginPath(); ctx.moveTo(cx, top); ctx.quadraticCurveTo(cx + w * 0.2, top + (bot - top) * 0.6, cx + w / 2, bot);
    ctx.quadraticCurveTo(cx, bot + 18, cx - w / 2, bot); ctx.quadraticCurveTo(cx - w * 0.2, top + (bot - top) * 0.6, cx, top); ctx.fill();
  }
  ctx.shadowBlur = 0;
  // モール（かざりの ひも）
  ctx.strokeStyle = 'rgba(255,215,90,.85)'; ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) {
    const y = base - th * (0.7 - i * 0.22), w = tw * (0.3 + i * 0.2);
    ctx.beginPath(); ctx.moveTo(cx - w / 2, y - 10); ctx.quadraticCurveTo(cx, y + 22, cx + w / 2, y - 18); ctx.stroke();
  }
  // かざり
  orn.forEach((o, i) => {
    o.t += dt;
    const p = slotXY(o.s), k = Math.min(1, o.t / 0.45);
    const y = o.y0 + (p.y - o.y0) * (1 - Math.pow(1 - k, 3)) - Math.sin(Math.min(1, Math.max(0, (o.t - 0.45) / 0.3)) * Math.PI) * 10;
    const blink = show > 0 ? 0.5 + 0.5 * Math.sin(t * 6 - i * 0.6) : (o.kind === 'bulb' ? 0.6 + 0.4 * Math.sin(t * 3 + i) : 1);
    const r = Math.max(9, tw * 0.045);
    if (o.kind === 'ball' || o.kind === 'bulb') {
      const hue = show > 0 ? (o.hue + t * 120) % 360 : o.hue;
      ctx.shadowColor = `hsl(${hue}, 100%, 60%)`; ctx.shadowBlur = o.kind === 'bulb' || show > 0 ? 20 * blink : 0;
      const g = ctx.createRadialGradient(p.x - r * 0.3, y - r * 0.3, r * 0.1, p.x, y, r);
      g.addColorStop(0, `hsl(${hue}, 100%, ${80 + blink * 10}%)`); g.addColorStop(1, `hsl(${hue}, 85%, ${40 + blink * 15}%)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, y, o.kind === 'bulb' ? r * 0.75 : r, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      if (o.kind === 'ball') { ctx.fillStyle = '#d9b44a'; ctx.fillRect(p.x - r * 0.25, y - r * 1.15, r * 0.5, r * 0.3); }
    } else {
      ctx.save(); ctx.translate(p.x, y); ctx.rotate(Math.sin(t * 2 + i) * 0.15); drawEmoji(ctx, o.kind, 0, 0, r * 2.3); ctx.restore();
    }
  });
  // プレゼント
  for (const g of gifts) { g.t += dt; const k = Math.min(1, g.t / 0.4); drawEmoji(ctx, g.e, cx + g.u * tw * 1.05, base + 4 - (1 - k) * 60, tw * 0.17); }
  // てっぺんの ほし
  if (star) {
    star.t += dt;
    const k = Math.min(1, star.t / 0.8), sx = cx, sy = base - th * 0.97;
    const y = -80 + (sy + 80) * (1 - Math.pow(1 - k, 3));
    if (k >= 1 && show === 0) { show = 0.01; Sfx.yay(); setTimeout(() => Sfx.chime(), 350); burst(sx, sy, 80, 50); popText('メリークリスマス！', W / 2, H * 0.12, '#ffe066', Math.min(48, W * 0.08)); }
    // ひかりの すじ
    if (show > 0) {
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * 0.6);
      for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.fillStyle = `rgba(255,235,140,${0.12 + 0.08 * Math.sin(t * 4 + i)})`; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-20, -Math.max(W, H)); ctx.lineTo(20, -Math.max(W, H)); ctx.fill(); }
      ctx.restore();
    }
    ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 30;
    drawEmoji(ctx, '🌟', sx, y, tw * 0.3 * (1 + (show > 0 ? 0.08 * Math.sin(t * 5) : 0)));
    ctx.shadowBlur = 0;
  }
  if (show > 0) {
    show += dt;
    if (Math.random() < dt * 6) burst(rand(cx - tw * 0.5, cx + tw * 0.5), base - rand(0, th), 12);
    if (Math.random() < dt * 3) Sfx.tone(pick(NOTES) * 2, 0.5, 'sine', 0.05);
    if (show > 12) reset(); // しばらく したら また はじめから
  }
  // きらきら
  for (const s of sparks) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 200 * dt; s.life -= dt;
    ctx.fillStyle = `hsla(${s.hue}, 100%, 75%, ${Math.max(0, s.life)})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, 3.5, 0, 7); ctx.fill();
  }
  sparks = sparks.filter(s => s.life > 0);
  if (sparks.length > 600) sparks.splice(0, sparks.length - 600);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
