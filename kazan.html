<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>かざん</title>
<link rel="stylesheet" href="common.css?v=21">
<style>
  body { background: linear-gradient(#ffcf9e, #ffe9cf 70%); }
  #cv { touch-action: none; }
  .big-btn { --c1: #ff6a3d; --c2: #b8401c; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🌋</span></button></div>
<script src="common.js?v=17"></script>
<script>
// かざん: ボタンで ふんか。つづけて おすほど おおきく なる。とんだ ようがんは ひえて いわに なる。
// ひえた いわを さわると われて、💎 や たまごが でてくる。たまごからは きょうりゅうが うまれて あるいていく。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx), W = innerWidth, H = innerHeight;
let V, blobs = [], rocks = [], puffs = [], flows = [], items = [], dinos = [], combo = 0, comboT = 0, quake = 0, glow = 0;

function layout() {
  const gy = H - 60, bw = Math.min(W * 0.9, 760);
  V = { x: W > 600 ? W / 2 : W * 0.46, gy, peak: Math.max(H * 0.36, gy - bw * 0.62), bw, cw: Math.min(70, bw * 0.12) };
}
layout();
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); W = innerWidth; H = innerHeight; layout(); });
function surface(x) { // その x の じめんの たかさ
  const half = V.bw / 2, d = Math.abs(x - V.x);
  if (d < V.cw / 2) return V.peak + 8;
  if (d < half) return V.peak + (d - V.cw / 2) / (half - V.cw / 2) * (V.gy - V.peak);
  return V.gy;
}

btn.addEventListener('pointerdown', () => {
  combo = Math.min(4, comboT > 0 ? combo + 1 : 1); comboT = 1.3;
  const pw = combo;
  quake = 0.25 + pw * 0.15; glow = Math.min(1, glow + 0.3 * pw);
  Sfx.noise(0.6 + pw * 0.2, 0.2 + pw * 0.06, 300 + pw * 100); Sfx.tone(70, 0.5, 'sawtooth', 0.12, 0, 40);
  const n = 14 + pw * 10;
  for (let i = 0; i < n; i++) blobs.push({ x: V.x + rand(-10, 10), y: V.peak, vx: rand(-1, 1) * (120 + pw * 70), vy: -rand(380, 520) * (0.8 + pw * 0.15), r: rand(5, 10) });
  for (let i = 0; i < 4 + pw * 2; i++) puffs.push({ x: V.x + rand(-20, 20), y: V.peak - 10, vx: rand(-30, 30), vy: rand(-120, -60) * (0.7 + pw * 0.2), r: rand(20, 34), life: 3 });
  if (pw >= 3) { flows.push({ dir: -1, k: 0 }, { dir: 1, k: 0 }); popText('どかーん！', W / 2, H * 0.2, '#ff3b00', 56); }
});
cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY;
  for (const r of rocks) {
    if (r.heat < 0.15 && !r.cracked && Math.hypot(r.x - x, r.y - y) < Math.max(30, r.s)) {
      r.cracked = true; Sfx.noise(0.2, 0.3, 1500); Sfx.tone(800, 0.1, 'square', 0.06);
      const egg = Math.random() < 0.45;
      items.push({ e: egg ? '🥚' : pick(['💎', '💎', '🪨', '⭐']), x: r.x, y: r.y - 10, t: 0, egg });
      return;
    }
  }
  for (const d of dinos) if (Math.hypot(d.x - x, d.y - y) < 40) { d.jump = 1; Sfx.tone(300, 0.3, 'sawtooth', 0.07, 0, 500); }
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
  comboT -= dt; if (comboT < 0) combo = 0;
  quake = Math.max(0, quake - dt); glow = Math.max(0, glow - dt * 0.25);
  for (const b of blobs) {
    b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.vy > 0 && b.y >= surface(b.x)) {
      b.done = true;
      if (b.x > 10 && b.x < W - 10 && Math.random() < 0.35) { rocks.push({ x: b.x, y: surface(b.x), s: rand(16, 28), heat: 1, rot: rand(0, 6) }); if (rocks.length > 22) rocks.shift(); }
      if (Math.random() < 0.2) Sfx.noise(0.08, 0.06, 1200);
    }
  }
  blobs = blobs.filter(b => !b.done && b.x > -50 && b.x < W + 50);
  for (const r of rocks) r.heat = Math.max(0, r.heat - dt * 0.3);
  rocks = rocks.filter(r => !r.cracked);
  for (const p of puffs) { p.x += p.vx * dt + Math.sin(t + p.r) * 6 * dt; p.y += p.vy * dt; p.vy *= 0.99; p.r += 10 * dt; p.life -= dt; }
  puffs = puffs.filter(p => p.life > 0);
  if (Math.random() < dt * 1.2) puffs.push({ x: V.x, y: V.peak - 6, vx: rand(-10, 10), vy: -40, r: 12, life: 2.5, light: true });
  for (const f of flows) { f.k += dt * 0.35; }
  flows = flows.filter(f => f.k < 2.4);
  for (const it of items) {
    it.t += dt;
    if (it.egg && it.t > 1.4 && !it.done) { it.done = true; const e = pick(['🦕', '🦖']); dinos.push({ e, x: it.x, y: it.y + 6, dir: it.x < V.x ? -1 : 1, jump: 1, t: 0 }); Sfx.tone(500, 0.2, 'sine', 0.1, 0, 900); popText('うまれた！', it.x, it.y - 50, '#2e7031', 32); }
    if (!it.egg && it.t > 2 && !it.done) it.done = true;
  }
  items = items.filter(it => !it.done);
  for (const d of dinos) { d.t += dt; d.jump = Math.max(0, d.jump - dt * 2); d.x += d.dir * 50 * dt; d.y = surface(d.x) - 18; }
  dinos = dinos.filter(d => d.x > -60 && d.x < W + 60);
  draw(t);
  requestAnimationFrame(loop);
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (glow > 0) { ctx.fillStyle = `rgba(255,80,20,${glow * 0.25})`; ctx.fillRect(0, 0, W, H); }
  const qx = Math.sin(t * 70) * quake * 8, qy = Math.cos(t * 55) * quake * 5;
  ctx.translate(qx, qy);
  for (const p of puffs) { ctx.fillStyle = p.light ? `rgba(255,255,255,${Math.min(0.5, p.life * 0.2)})` : `rgba(90,80,80,${Math.min(0.55, p.life * 0.2)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  // やま
  const half = V.bw / 2;
  ctx.fillStyle = '#7a5038'; ctx.beginPath(); ctx.moveTo(V.x - half, V.gy); ctx.lineTo(V.x - V.cw / 2, V.peak); ctx.lineTo(V.x + V.cw / 2, V.peak); ctx.lineTo(V.x + half, V.gy); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5c3a28'; ctx.beginPath(); ctx.moveTo(V.x, V.peak); ctx.lineTo(V.x + V.cw / 2, V.peak); ctx.lineTo(V.x + half, V.gy); ctx.lineTo(V.x + half * 0.4, V.gy); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff6a1a'; ctx.beginPath(); ctx.ellipse(V.x, V.peak, V.cw / 2, 7, 0, 0, 7); ctx.fill();
  // ようがんの ながれ
  for (const f of flows) {
    const k = Math.min(1, f.k), fade = Math.max(0, Math.min(1, 2.4 - f.k));
    ctx.strokeStyle = `rgba(255,${90 + 60 * Math.sin(t * 8)},20,${fade})`; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(V.x + f.dir * V.cw * 0.3, V.peak + 4);
    for (let u = 0; u <= k; u += 0.05) { const x = V.x + f.dir * (V.cw / 2 + u * (half - V.cw / 2) * 0.85) + Math.sin(u * 12) * 8; ctx.lineTo(x, surface(x) - 4); }
    ctx.stroke();
  }
  ctx.fillStyle = '#8bc34a'; ctx.fillRect(-20, V.gy, W + 40, H - V.gy + 20);
  // いわ
  for (const r of rocks) {
    const c = r.heat;
    ctx.fillStyle = `rgb(${90 + 165 * c},${80 + 60 * c},${70 - 40 * c})`;
    ctx.beginPath(); ctx.ellipse(r.x, r.y - r.s * 0.4, r.s * 0.8, r.s * 0.6, r.rot, 0, 7); ctx.fill();
    if (c > 0.2) { ctx.fillStyle = `rgba(255,200,60,${c * 0.5})`; ctx.beginPath(); ctx.arc(r.x, r.y - r.s * 0.4, r.s, 0, 7); ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(r.x - r.s * 0.2, r.y - r.s * 0.6, r.s * 0.25, 3.5, 5); ctx.stroke(); }
  }
  for (const b of blobs) { ctx.fillStyle = '#ffb020'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,90,0,.4)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.8, 0, 7); ctx.fill(); }
  for (const it of items) {
    const wob = it.egg ? Math.sin(it.t * 20) * Math.min(1, it.t) * 0.3 : 0, s = it.egg ? 40 : 44;
    ctx.save(); ctx.translate(it.x, it.y - (it.egg ? 0 : it.t * 30)); ctx.rotate(wob); ctx.globalAlpha = it.egg ? 1 : Math.max(0, 1 - it.t / 2); drawEmoji(ctx, it.e, 0, 0, s); ctx.restore();
  }
  for (const d of dinos) { ctx.save(); ctx.translate(d.x, d.y - Math.sin(d.jump * Math.PI) * 30 - Math.abs(Math.sin(d.t * 8)) * 4); if (d.dir > 0) ctx.scale(-1, 1); drawEmoji(ctx, d.e, 0, 0, 44); ctx.restore(); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
