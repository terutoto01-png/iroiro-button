<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ふきふき</title>
<link rel="stylesheet" href="common.css?v=6">
<style>
  body { background: #fff; }
  #pic { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; transition: background .3s; }
  #pe { font-size: min(60vw, 60vh); line-height: 1; }
  #pe.yay { animation: yay .8s cubic-bezier(.3,1.7,.5,1); }
  @keyframes yay { 0% { scale: .6; } 50% { scale: 1.15; rotate: -6deg; } 100% { scale: 1; rotate: 0deg; } }
  #fog { transition: opacity .8s; }
  #fog.gone { opacity: 0; pointer-events: none; }
  .big-btn { --c1: #29b6f6; --c2: #0277bd; }
</style>
</head>
<body>
<div id="pic"><span id="pe"></span></div>
<canvas id="fog" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🧽</span></button></div>
<script src="common.js?v=6"></script>
<script>
// ふきふき: こすって よごれを おとすと えが でてくる
const PICS = [['🐶','いぬ'],['🐱','ねこ'],['🐘','ぞう'],['🦒','きりん'],['🐼','ぱんだ'],['🦁','らいおん'],['🐧','ぺんぎん'],
              ['🚒','しょうぼうしゃ'],['🚀','ろけっと'],['🦖','きょうりゅう'],['🐳','くじら'],['🐰','うさぎ'],['🍎','りんご'],['🍓','いちご'],
              ['🚃','でんしゃ'],['🐢','かめ'],['🦋','ちょうちょ'],['🍌','ばなな']];
const BGS = ['#ffe0ec', '#dff3ff', '#e5ffd9', '#fff4c7', '#efe2ff'];
const canvas = document.getElementById('fog'), ctx = canvas.getContext('2d');
const pe = document.getElementById('pe'), pic = document.getElementById('pic'), btn = document.getElementById('btn');
let dpr = 1, cur = null, revealed = false;
const GW = 16, GH = 24; let mask, wiped = 0;
const last = new Map(); let squeakDist = 0;

function paintFog() {
  dpr = fitCanvas(canvas, ctx);
  const W = innerWidth, H = innerHeight;
  const kind = pick(['awa', 'doro', 'kumori']);
  ctx.globalCompositeOperation = 'source-over';
  if (kind === 'awa') { // あわあわ
    ctx.fillStyle = '#e8f4ff'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 260; i++) {
      const x = Math.random() * W, y = Math.random() * H, r = rand(15, 60);
      const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.7, '#f3f9ff'); g.addColorStop(1, '#c9e2f7');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
  } else if (kind === 'doro') { // どろんこ
    ctx.fillStyle = '#8a5a34'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 200; i++) {
      ctx.fillStyle = pick(['#6f4526', '#9c6a40', '#7d5030', '#a8784b']);
      ctx.beginPath(); ctx.ellipse(Math.random() * W, Math.random() * H, rand(20, 80), rand(15, 50), rand(0, 3), 0, 7); ctx.fill();
    }
  } else { // くもり
    ctx.fillStyle = '#c7ced6'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 120; i++) {
      ctx.fillStyle = `rgba(255,255,255,${rand(0.1, 0.35)})`;
      ctx.beginPath(); ctx.arc(Math.random() * W, Math.random() * H, rand(30, 120), 0, 7); ctx.fill();
    }
  }
  mask = new Uint8Array(GW * GH); wiped = 0;
}

function newPicture() {
  let p; do { p = pick(PICS); } while (cur && p[0] === cur[0]);
  cur = p; revealed = false;
  pe.textContent = p[0]; pe.className = '';
  pic.style.background = pick(BGS);
  canvas.classList.remove('gone');
  paintFog();
}

function wipe(x0, y0, x1, y1) {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 110;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  // どれくらい ふけたか（あらい マス目で かぞえる）
  const steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 20));
  for (let s = 0; s <= steps; s++) {
    const x = x0 + (x1 - x0) * s / steps, y = y0 + (y1 - y0) * s / steps;
    const cx = Math.floor(x / innerWidth * GW), cy = Math.floor(y / innerHeight * GH);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const gx = cx + dx, gy = cy + dy;
      if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) continue;
      const mx = (gx + 0.5) * innerWidth / GW, my = (gy + 0.5) * innerHeight / GH;
      if (Math.hypot(mx - x, my - y) < 60 && !mask[gy * GW + gx]) { mask[gy * GW + gx] = 1; wiped++; }
    }
  }
  // きゅっきゅっ
  squeakDist += Math.hypot(x1 - x0, y1 - y0);
  if (squeakDist > 70) { squeakDist = 0; Sfx.tone(rand(1000, 1500), 0.06, 'sine', 0.06, 0, rand(1600, 2200)); Sfx.noise(0.06, 0.08, 3000, 0, 'bandpass'); }
  if (!revealed && wiped / (GW * GH) > 0.6) reveal();
}

function reveal() {
  revealed = true;
  canvas.classList.add('gone');
  pe.className = 'yay';
  Sfx.chime();
  setTimeout(() => speak(`${cur[1]}！ ぴかぴか！`), 300);
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  last.set(e.pointerId, [e.clientX, e.clientY]);
  wipe(e.clientX, e.clientY, e.clientX + 0.1, e.clientY);
});
canvas.addEventListener('pointermove', (e) => {
  const p = last.get(e.pointerId); if (!p) return;
  wipe(p[0], p[1], e.clientX, e.clientY);
  last.set(e.pointerId, [e.clientX, e.clientY]);
});
for (const t of ['pointerup', 'pointercancel']) canvas.addEventListener(t, (e) => last.delete(e.pointerId));
// でてきた えを さわると もういちど いってくれる
pic.addEventListener('pointerdown', () => { if (revealed) { pe.className = ''; void pe.offsetWidth; pe.className = 'yay'; Sfx.boing(); speak(cur[1]); } });

btn.addEventListener('pointerdown', () => { Sfx.noise(0.4, 0.4, 600); newPicture(); });
addEventListener('resize', () => { if (!revealed) paintFog(); });
newPicture();
</script>
</body>
</html>
