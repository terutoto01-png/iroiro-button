<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>ぽこぽこ</title>
<link rel="stylesheet" href="common.css?v=21">
<style>
  body { background: linear-gradient(#8fd3ff, #c6ecff 22%, #7ccf5a 22%, #5fb83f); }
  #cv { touch-action: none; }
  .big-btn { --c1: #ff8a3d; --c2: #b8561c; transition: opacity .3s, scale .3s; }
  .big-btn.hide { opacity: 0; scale: .5; pointer-events: none; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🔨</span></button></div>
<script src="common.js?v=18"></script>
<script src="game.js?v=2"></script>
<script>
// ぽこぽこ: あなから かおを だす どうぶつを タッチして ぽこっ。🐝 は さわると いたい（ハートが へる）。
// どうぶつを にがしても へらない。だんだん はやく、🐝 が ふえる。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx);
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); });
const ANIMALS = ['🐹', '🐰', '🐭', '🐿️', '🐥', '🐸', '🐶', '🐱'];
let holes = [], elapsed = 0, spawn = 0, hammers = [], stars = [];

function layout() {
  const W = innerWidth, H = innerHeight;
  const cols = W > H ? 4 : 3, rows = 3;
  const top = H * 0.3, bot = H - 60, cw = W / cols, rh = (bot - top) / rows;
  const r = Math.min(cw * 0.36, rh * 0.42, 110);
  const out = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) out.push({ x: cw * (x + 0.5), y: top + rh * (y + 0.62), r });
  return out;
}
function resetHoles() { holes = layout().map(h => ({ ...h, who: null, up: 0, state: 'empty', t: 0, stay: 0 })); }
resetHoles();
addEventListener('resize', resetHoles);

const game = Game.create('pokopoko', {
  onStart() { resetHoles(); elapsed = 0; spawn = 0.5; updateBtn(); },
  onOver() { for (const h of holes) if (h.state !== 'empty') h.state = 'down'; updateBtn(); },
});
function updateBtn() { btn.classList.toggle('hide', game.state === 'play'); }
btn.addEventListener('pointerdown', () => { game.press(); updateBtn(); });
setInterval(updateBtn, 400);

cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY;
  if (game.state !== 'play') { game.press(); updateBtn(); return; }
  hammers.push({ x, y, t: 0 });
  for (const h of holes) {
    if (h.state === 'empty' || h.state === 'hit' || h.up < 0.4) continue;
    const hy = h.y - h.r * 0.8 * h.up;
    if (Math.hypot(x - h.x, y - hy) < h.r * 1.1) {
      if (h.who === '🐝') { // いたっ
        h.state = 'down'; game.hit();
        popText('いたっ！', h.x, hy - h.r, '#ff4d4d', 44);
        Sfx.tone(200, 0.25, 'sawtooth', 0.12, 0, 120);
      } else {
        h.state = 'hit'; h.t = 0; game.add(h.gold ? 3 : 1);
        if (h.gold) { Sfx.yay(); popText('✨', h.x, hy - h.r, '#ffd23f', 60); for (let i = 0; i < 30; i++) { const a = rand(0, 7), sp = rand(150, 420); stars.push({ x: h.x, y: hy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.9 }); } }
        Sfx.tone(rand(500, 700), 0.08, 'square', 0.1, 0, 300); Sfx.pop();
        for (let i = 0; i < 10; i++) { const a = rand(0, 7), sp = rand(120, 320); stars.push({ x: h.x, y: hy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.6 }); }
      }
      return;
    }
  }
  Sfx.tone(160, 0.06, 'sine', 0.1); // とん（あなの そと）
});

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const W = innerWidth, H = innerHeight, t = now / 1000, playing = game.state === 'play';
  if (playing) {
    elapsed += dt;
    const lv = Math.min(1, elapsed / 90);
    spawn -= dt;
    if (spawn <= 0) {
      spawn = 1.1 - lv * 0.65;
      const free = holes.filter(h => h.state === 'empty');
      if (free.length) {
        const h = pick(free), bee = Math.random() < 0.12 + lv * 0.18;
        h.who = bee ? '🐝' : pick(ANIMALS); h.gold = !bee && Math.random() < 0.08; h.state = 'rise'; // しかけ: たまに きんいろの どうぶつ（3てん） h.t = 0; h.stay = (1.6 - lv * 0.8) * rand(0.85, 1.2);
        if (!bee) Sfx.tone(rand(800, 1100), 0.06, 'sine', 0.05);
        else Sfx.tone(220, 0.25, 'sawtooth', 0.04, 0, 240); // ぶーん
      }
    }
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // くさ
  ctx.fillStyle = 'rgba(40,120,30,.25)';
  for (let i = 0; i < 40; i++) { const x = (i * 97) % W, y = H * 0.25 + ((i * 53) % (H * 0.75)); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 5, y - 14); ctx.lineTo(x + 10, y); ctx.fill(); }
  for (const h of holes) {
    h.t += dt;
    if (h.state === 'rise') { h.up = Math.min(1, h.up + dt * 6); if (h.up >= 1) { h.state = 'stay'; h.t = 0; } }
    else if (h.state === 'stay') { if (h.t > h.stay) h.state = 'down'; }
    else if (h.state === 'down') { h.up = Math.max(0, h.up - dt * 6); if (h.up <= 0) { h.state = 'empty'; h.who = null; } }
    else if (h.state === 'hit') { if (h.t > 0.35) h.state = 'down'; }
    // あな（おく）
    ctx.fillStyle = '#5a3a1e'; ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.38, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#2e1a0b'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 3, h.r * 0.86, h.r * 0.3, 0, 0, 7); ctx.fill();
    // どうぶつ（あなの ふちより うえだけ みえる）
    if (h.who && h.up > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(h.x - h.r * 1.5, h.y - h.r * 3, h.r * 3, h.r * 3); ctx.clip();
      const hy = h.y + h.r * 0.5 - h.r * 1.25 * h.up;
      const sq = h.state === 'hit' ? 1 - Math.min(1, h.t / 0.12) * 0.35 : 1;
      ctx.translate(h.x, hy + h.r * 0.6); ctx.scale(1 / sq, sq); ctx.translate(0, -h.r * 0.6);
      if (h.gold && h.state !== 'hit') { ctx.shadowColor = `rgba(255,210,40,${0.7 + 0.3 * Math.sin(t * 10)})`; ctx.shadowBlur = 30; }
      if (h.who === '🐝') { ctx.shadowColor = 'rgba(255,40,40,.9)'; ctx.shadowBlur = 20; ctx.rotate(Math.sin(t * 30) * 0.1); }
      drawEmoji(ctx, h.state === 'hit' ? '😵' : h.who, 0, 0, h.r * 1.5);
      ctx.restore();
    }
    // あなの まえの ふち
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 8; ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.38, 0, 0.05, Math.PI - 0.05); ctx.stroke();
  }
  // ほし
  for (const s of stars) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; s.life -= dt; ctx.globalAlpha = Math.max(0, s.life / 0.6); drawEmoji(ctx, '⭐', s.x, s.y, 20); }
  ctx.globalAlpha = 1;
  stars = stars.filter(s => s.life > 0);
  // ハンマー
  for (const m of hammers) {
    m.t += dt; const k = Math.min(1, m.t / 0.12);
    ctx.save(); ctx.translate(m.x + 30, m.y - 30); ctx.rotate(-0.9 + k * 0.9); ctx.globalAlpha = Math.max(0, 1 - (m.t - 0.15) * 4);
    drawEmoji(ctx, '🔨', -30, 0, 64); ctx.restore();
  }
  ctx.globalAlpha = 1;
  hammers = hammers.filter(m => m.t < 0.45);
  // はじまるまえ
  if (!playing) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5);
    drawEmoji(ctx, '👆', W / 2, H * 0.55 - Math.abs(Math.sin(t * 3)) * 20, 70);
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
