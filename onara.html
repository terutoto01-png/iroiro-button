<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>おなら</title>
<link rel="stylesheet" href="common.css?v=6">
<style>
  body { background: #f4ffe0; }
  .big-btn { --c1: #9ccc3d; --c2: #678a1f; }
  .cloud { position: fixed; z-index: 5; pointer-events: none; border-radius: 50%;
           background: radial-gradient(circle, rgba(170,200,60,.75), rgba(170,200,60,0) 70%);
           animation: puff var(--d) ease-out forwards; }
  @keyframes puff { from { transform: translate(-50%, -50%) scale(.2); opacity: 1; }
                    to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.6); opacity: 0; } }
</style>
</head>
<body>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">💨</span></button></div>
<script src="common.js?v=6"></script>
<script>
const btn = document.getElementById('btn');

// ぷっ・ぶぅ〜・ぷぴっ を合成
function fart() {
  const c = Sfx.ac(), t = c.currentTime;
  const len = pick([0.15, 0.3, 0.6, 1.0]);
  const base = rand(70, 140);
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  const lfo = c.createOscillator(), lg = c.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(base * rand(1, 1.6), t);
  o.frequency.exponentialRampToValueAtTime(base * rand(0.6, 0.9), t + len);
  lfo.type = 'square'; lfo.frequency.value = rand(18, 40); lg.gain.value = base * 0.4;
  lfo.connect(lg).connect(o.frequency);
  f.type = 'lowpass'; f.frequency.value = rand(400, 900); f.Q.value = 4;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
  g.gain.setValueAtTime(0.6, t + len * 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(f).connect(g).connect(Sfx.out());
  o.start(t); lfo.start(t); o.stop(t + len + 0.05); lfo.stop(t + len + 0.05);
  Sfx.noise(len, 0.15, 300);
  return len;
}

btn.addEventListener('pointerdown', () => {
  const len = fart();
  const r = btn.getBoundingClientRect();
  const n = Math.round(4 + len * 10);
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'cloud';
    const s = rand(80, 160) * (0.6 + len);
    el.style.width = el.style.height = s + 'px';
    el.style.left = r.left + r.width / 2 + rand(-40, 40) + 'px';
    el.style.top = r.top + r.height / 2 + rand(-20, 20) + 'px';
    el.style.setProperty('--dx', rand(-260, 260) + 'px');
    el.style.setProperty('--dy', rand(-420, -120) + 'px');
    el.style.setProperty('--d', rand(1.2, 2.2) + 's');
    el.style.animationDelay = (i / n) * len + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600 + len * 1000);
  }
  if (len >= 1) setTimeout(() => popText('くさーい！', innerWidth / 2, innerHeight * 0.3, '#678a1f', 56), 400);
});
</script>
</body>
</html>
