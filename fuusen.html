<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>ふうせん</title>
<link rel="stylesheet" href="common.css?v=18">
<style>
  body { background: #e8f6ff; }
  .big-btn { --c1: #ff5a5a; --c2: #c22f2f; }
  #balloon { position: fixed; left: 50%; bottom: 290px; transform-origin: 50% 100%;
             transform: translateX(-50%) scale(var(--s, .4)); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
  #balloon.shake { animation: shake .12s linear infinite; }
  @keyframes shake { 0%,100% { margin-left: -3px; } 50% { margin-left: 3px; } }
  canvas.full { pointer-events: none; z-index: 20; }
  #balloon { z-index: 5; cursor: pointer; }
  #balloon.gold { filter: drop-shadow(0 0 18px #ffe066) drop-shadow(0 0 6px #fff6c4); }
  #balloon.squish #body { animation: squish .35s ease-out; transform-origin: 100px 105px; }
  @keyframes squish { 30% { transform: scale(1.12, .88); } 60% { transform: scale(.94, 1.06); } }
</style>
</head>
<body>
<svg id="balloon" width="200" height="280" viewBox="0 0 200 280">
  <path d="M100 210 C 95 230, 108 250, 98 280" stroke="#888" stroke-width="2" fill="none"/>
  <ellipse id="body" cx="100" cy="105" rx="85" ry="100" fill="#ff5a5a"/>
  <path id="knot" d="M92 205 L108 205 L100 215 Z" fill="#ff5a5a"/>
  <ellipse cx="65" cy="65" rx="16" ry="28" fill="#fff" opacity=".45" transform="rotate(-25 65 65)"/>
</svg>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🎈</span></button></div>
<script src="common.js?v=15"></script>
<script>
const balloon = document.getElementById('balloon'), body = document.getElementById('body'), knot = document.getElementById('knot');
const btn = document.getElementById('btn');
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d');
fitCanvas(canvas, ctx); addEventListener('resize', () => fitCanvas(canvas, ctx));
const COLORS = ['#ff5a5a', '#ffb02e', '#ffe14d', '#4cd964', '#3fa9f5', '#a66bff', '#ff6fb5'];
let size = 0.4, limit, giant = false, gold = false, color = COLORS[0], bits = [], busy = false, floaters = [], sinceGold = 0;
// ときどき（5かいに1かいくらい）すごく おおきく ふくらむ
function newLimit() {
  giant = Math.random() < 0.2;
  // しかけ: たまに きんいろの ふうせん（なかに どうぶつが いる）
  gold = !giant && ++sinceGold >= 4 && Math.random() < 0.4; if (gold) sinceGold = 0;
  balloon.classList.toggle('gold', gold);
  limit = giant ? Math.max(2.6, innerHeight * 1.5 / 280) : rand(1.3, 1.9);
}
newLimit();

function setColor(c) { color = c; body.setAttribute('fill', gold ? '#ffcf33' : c); knot.setAttribute('fill', gold ? '#ffcf33' : c); }
// ふうせんを ちょくせつ さわると きゅっ（ぷるん）
balloon.addEventListener('pointerdown', () => {
  if (busy) return;
  balloon.classList.remove('squish'); void balloon.getBoundingClientRect(); balloon.classList.add('squish');
  Sfx.tone(rand(900, 1300), 0.12, 'sine', 0.12, 0, rand(1500, 2000)); Sfx.tone(700, 0.1, 'triangle', 0.06, 0.08, 1100);
});

btn.addEventListener('pointerdown', () => {
  if (busy) return;
  size += size > 1.9 ? 0.22 : 0.12; // おおきくなるほど ぐんぐん
  balloon.style.setProperty('--s', size);
  Sfx.noise(0.25, 0.35, Math.min(700 + size * 600, 4000), 0, 'bandpass'); // しゅー
  Sfx.tone(Math.min(200 + size * 300, 1600), 0.2, 'sine', 0.08);
  balloon.classList.toggle('shake', size > limit - 0.25);
  if (size >= limit) burst();
});

function burst() {
  busy = true;
  const r = balloon.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = Math.max(innerHeight * 0.3, r.top + r.height * 0.38);
  balloon.style.visibility = 'hidden';
  balloon.classList.remove('shake');
  const big = giant, wasGold = gold;
  if (wasGold) { // なかから どうぶつが ちいさな ふうせんに つかまって ふわふわ
    floaters.push({ e: pick(['🐻', '🐱', '🐰', '🐥', '🐶', '🐼', '🐸']), x: cx, y: cy, t: 0, c: pick(COLORS) });
    for (let i = 0; i < 60; i++) { const a = Math.random() * Math.PI * 2, sp = rand(100, 600); bits.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: 0, vr: rand(-8, 8), s: rand(5, 9), c: '#ffd23f' }); }
    setTimeout(() => { Sfx.chime(); popText('わーい！', cx, cy - 60, '#ff6fa8', 56); }, 250);
  }
  for (let i = 0; i < (big ? 320 : 120); i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(200, big ? 1800 : 900);
    bits.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rand(0, 6), vr: rand(-10, 10),
                s: rand(6, 16) * (big ? 1.8 : 1), c: Math.random() < 0.6 ? color : pick(COLORS) });
  }
  Sfx.noise(0.6, 1.0, 2500);
  Sfx.noise(0.15, 0.8, 6000, 0, 'highpass');
  if (big) {
    Sfx.noise(1.5, 1.0, 300, 0.05);
    Sfx.tone(80, 1.2, 'sine', 0.5, 0, 30);
    document.body.animate([{ transform: 'translate(8px,0)' }, { transform: 'translate(-8px,4px)' }, { transform: 'translate(0,0)' }], { duration: 120, iterations: 5 });
    popText('どっかーん！', innerWidth / 2, innerHeight * 0.4, '#fff', 96);
  } else {
    popText('ぱーん！', cx, Math.max(80, cy), '#fff', 72);
  }
  setTimeout(() => {
    size = 0.4; newLimit();
    setColor(pick(COLORS.filter(c => c !== color)));
    balloon.style.transition = 'none';
    balloon.style.setProperty('--s', 0.01);
    balloon.style.visibility = 'visible';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      balloon.style.transition = '';
      balloon.style.setProperty('--s', size);
      busy = false;
    }));
  }, 700); // れんだする子の ために みじかめ
}

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const b of bits) {
    b.vx *= Math.pow(0.2, dt); b.vy = b.vy * Math.pow(0.2, dt) + 700 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
    ctx.fillStyle = b.c; ctx.beginPath(); ctx.moveTo(-b.s, 0); ctx.quadraticCurveTo(0, -b.s, b.s, 0); ctx.quadraticCurveTo(0, b.s * 0.3, -b.s, 0); ctx.fill();
    ctx.restore();
  }
  bits = bits.filter(b => b.y < innerHeight + 30);
  for (const f of floaters) {
    f.t += dt; f.y -= dt * 60; const x = f.x + Math.sin(f.t * 1.8) * 30;
    ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, f.y - 10); ctx.lineTo(x + 4, f.y - 60); ctx.stroke();
    ctx.fillStyle = f.c; ctx.beginPath(); ctx.ellipse(x + 4, f.y - 82, 18, 22, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(x, f.y); ctx.rotate(Math.sin(f.t * 1.8) * 0.15); drawEmoji(ctx, f.e, 0, 0, 56); ctx.restore();
  }
  floaters = floaters.filter(f => f.y > -140);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
