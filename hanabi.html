<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>はなび</title>
<link rel="stylesheet" href="common.css?v=10">
<style>
  body { background: #070b24; }
  .big-btn { --c1: #ff8a00; --c2: #b85d00; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🎆</span></button></div>
<script src="common.js?v=10"></script>
<script>
// 花火: WebGPU のコンピュートシェーダーで粒を動かす
const STRIDE = 8; // pos(2) vel(2) color(3) life(1)
const canvas = document.getElementById('cv');
const btn = document.getElementById('btn');
const N = 60000;
let cursor = 0, gpu = null;

const PALETTES = [
  [[1,.3,.4],[1,.8,.3]], [[.3,.7,1],[.8,.4,1]], [[.4,1,.5],[1,1,.4]],
  [[1,.5,.9],[1,1,1]], [[1,.85,.3],[1,.4,.1]], [[.4,1,1],[.3,.5,1]],
];

function writeParticles(arr, count) {
  // リングバッファに書き込む
  let off = 0;
  while (off < count) {
    const n = Math.min(count - off, N - cursor);
    const slice = arr.subarray(off * STRIDE, (off + n) * STRIDE);
    gpu.device.queue.writeBuffer(gpu.pbuf, cursor * STRIDE * 4, slice);
    cursor = (cursor + n) % N; off += n;
  }
}

function burst(x, y) {
  const pal = pick(PALETTES);
  const shape = pick(['kiku', 'kiku', 'ring', 'heart', 'star']);
  const count = 2500;
  const arr = new Float32Array(count * STRIDE);
  const speed = Math.min(innerWidth, innerHeight) * rand(0.45, 0.7);
  for (let i = 0; i < count; i++) {
    const t = Math.random() * Math.PI * 2;
    let vx, vy;
    if (shape === 'heart') {
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      const s = speed / 17 * rand(0.95, 1.05);
      vx = hx * s; vy = hy * s;
    } else if (shape === 'ring') {
      const s = speed * rand(0.95, 1.05);
      vx = Math.cos(t) * s; vy = Math.sin(t) * s;
    } else if (shape === 'star') {
      const k = 0.55 + 0.45 * Math.abs(Math.cos(t * 2.5));
      const s = speed * k * rand(0.95, 1.05);
      vx = Math.cos(t) * s; vy = Math.sin(t) * s;
    } else {
      const s = speed * Math.sqrt(Math.random());
      vx = Math.cos(t) * s; vy = Math.sin(t) * s;
    }
    const c = Math.random() < 0.5 ? pal[0] : pal[1];
    const o = i * STRIDE;
    arr[o] = x; arr[o+1] = y; arr[o+2] = vx; arr[o+3] = vy;
    arr[o+4] = c[0]; arr[o+5] = c[1]; arr[o+6] = c[2];
    arr[o+7] = rand(1.4, 2.4);
  }
  writeParticles(arr, count);
}

function rocketTrail(x0, y0, x1, y1) {
  const count = 60, arr = new Float32Array(count * STRIDE);
  for (let i = 0; i < count; i++) {
    const k = i / count, o = i * STRIDE;
    arr[o] = x0 + (x1 - x0) * k + rand(-3, 3); arr[o+1] = y0 + (y1 - y0) * k;
    arr[o+2] = rand(-10, 10); arr[o+3] = rand(-10, 30);
    arr[o+4] = 1; arr[o+5] = .8; arr[o+6] = .5;
    arr[o+7] = 0.15 + k * 0.6;
  }
  writeParticles(arr, count);
}

function fire(x, y) {
  x = x ?? rand(innerWidth * 0.15, innerWidth * 0.85);
  y = y ?? rand(innerHeight * 0.12, innerHeight * 0.5);
  Sfx.tone(300, 0.5, 'sine', 0.12, 0, 1200); // ひゅ〜
  rocketTrail(x + rand(-30, 30), innerHeight, x, y);
  setTimeout(() => {
    burst(x, y);
    Sfx.noise(1.2, 0.8, 500);
    Sfx.noise(0.3, 0.4, 3000, 0.05, 'highpass');
  }, 350);
}

btn.addEventListener('pointerdown', () => {
  fire();
  if (Math.random() < 0.35) setTimeout(() => fire(), 200);
});
canvas.addEventListener('pointerdown', (e) => fire(e.clientX, e.clientY));

// ---------- WebGPU ----------
const COMMON = /* wgsl */`
struct P { pos: vec2f, vel: vec2f, color: vec3f, life: f32 };
struct U { res: vec2f, dt: f32, time: f32 };
`;
const UPDATE = COMMON + /* wgsl */`
@group(0) @binding(0) var<storage, read_write> ps: array<P>;
@group(0) @binding(1) var<uniform> u: U;
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let i = id.x;
  if (i >= arrayLength(&ps)) { return; }
  var p = ps[i];
  if (p.life <= 0.0) { return; }
  p.vel.y = p.vel.y + 180.0 * u.dt;
  p.vel = p.vel * pow(0.3, u.dt);
  p.pos = p.pos + p.vel * u.dt;
  p.life = p.life - u.dt;
  ps[i] = p;
}`;
const RENDER = COMMON + /* wgsl */`
@group(0) @binding(0) var<storage, read> ps: array<P>;
@group(0) @binding(1) var<uniform> u: U;
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) col: vec3f };
@vertex
fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VO {
  var corners = array<vec2f, 6>(vec2f(-1,-1), vec2f(1,-1), vec2f(-1,1), vec2f(-1,1), vec2f(1,-1), vec2f(1,1));
  let p = ps[ii];
  let c = corners[vi];
  var o: VO;
  o.uv = c;
  if (p.life <= 0.0) {
    o.pos = vec4f(2.0, 2.0, 0.0, 1.0);
    o.col = vec3f(0.0);
    return o;
  }
  let a = clamp(p.life / 1.2, 0.0, 1.0);
  let size = 2.0 + 5.0 * a;
  let px = p.pos + c * size;
  o.pos = vec4f(px.x / u.res.x * 2.0 - 1.0, 1.0 - px.y / u.res.y * 2.0, 0.0, 1.0);
  let tw = 0.7 + 0.3 * sin(u.time * 40.0 + f32(ii) * 1.7);
  o.col = p.color * a * tw;
  return o;
}
@fragment
fn fs(i: VO) -> @location(0) vec4f {
  let d = dot(i.uv, i.uv);
  let g = exp(-d * 4.0) + 0.6 * exp(-d * 30.0);
  return vec4f(i.col * g, 1.0);
}`;

async function setupGPU() {
  const g = await initWebGPU(canvas);
  if (!g) return null;
  const { device, format } = g;
  g.pbuf = device.createBuffer({ size: N * STRIDE * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  g.ubuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const cp = device.createComputePipeline({
    layout: 'auto', compute: { module: device.createShaderModule({ code: UPDATE }), entryPoint: 'main' },
  });
  const rmod = device.createShaderModule({ code: RENDER });
  const blend = { srcFactor: 'one', dstFactor: 'one', operation: 'add' };
  const rp = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: rmod, entryPoint: 'vs' },
    fragment: { module: rmod, entryPoint: 'fs', targets: [{ format, blend: { color: blend, alpha: blend } }] },
    primitive: { topology: 'triangle-list' },
  });
  const entries = [{ binding: 0, resource: { buffer: g.pbuf } }, { binding: 1, resource: { buffer: g.ubuf } }];
  g.cbg = device.createBindGroup({ layout: cp.getBindGroupLayout(0), entries });
  g.rbg = device.createBindGroup({ layout: rp.getBindGroupLayout(0), entries });
  g.cp = cp; g.rp = rp;
  return g;
}

function frameGPU(dt, time) {
  const { device, ctx } = gpu;
  device.queue.writeBuffer(gpu.ubuf, 0, new Float32Array([innerWidth, innerHeight, dt, time]));
  const enc = device.createCommandEncoder();
  const c = enc.beginComputePass();
  c.setPipeline(gpu.cp); c.setBindGroup(0, gpu.cbg);
  c.dispatchWorkgroups(Math.ceil(N / 64)); c.end();
  const r = enc.beginRenderPass({ colorAttachments: [{
    view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store',
    clearValue: { r: 0.027, g: 0.043, b: 0.14, a: 1 },
  }] });
  r.setPipeline(gpu.rp); r.setBindGroup(0, gpu.rbg);
  r.draw(6, N); r.end();
  device.queue.submit([enc.finish()]);
}

(async () => {
  gpu = await setupGPU();
  const resize = () => fitCanvas(canvas);
  resize(); addEventListener('resize', resize);
  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    frameGPU(dt, now / 1000);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
