<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>おべんとう</title>
<link rel="stylesheet" href="common.css?v=20">
<style>
  body { background: #fff4d6; }
  #cv { touch-action: none; }
  .big-btn { --c1: #ff7b00; --c2: #b35500; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🍙</span></button></div>
<script src="common.js?v=16"></script>
<script>
// おべんとう: したの おかずを ゆびで はこへ つめる（ボタンでも ぽんっと はいる）。どこに いれても いい。
// いっぱいに なったら ふたを しめて、どうぶつが やってきて もぐもぐ たべる。たべている どうぶつを さわると 💗。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx), W = innerWidth, H = innerHeight;
const FOODS = ['🍙', '🍤', '🍳', '🥦', '🍅', '🍓', '🌭', '🍗', '🥕', '🍡'];
const EATERS = ['🐻', '🐰', '🐼', '🐶', '🐱', '🐷', '🐵'];
let B, tray = [], slots = [], drag = null, fly = [], phase = 'fill', pt = 0, eater = null, hearts = [];

function layout() {
  const w = Math.min(W * 0.82, 440), h = w * 0.6;
  B = { x: W / 2, y: Math.max(110 + h / 2, H * 0.36), w, h };
  const cols = 3, rows = 2;
  slots = slots.length ? slots : Array.from({ length: 6 }, () => ({ f: null, s: 0 }));
  slots.forEach((s, i) => { s.x = B.x - w / 2 + w * ((i % cols) + 0.5) / cols; s.y = B.y - h / 2 + h * (Math.floor(i / cols) + 0.5) / rows; });
  const per = 5, size = Math.min(56, (W - 40) / per * 0.8), top = B.y + h / 2 + 40;
  tray = FOODS.map((e, i) => ({ e, x: W / 2 + ((i % per) - (per - 1) / 2) * (W - 40) / per * 0.95, y: top + Math.floor(i / per) * size * 1.35 + size / 2, size }));
}
layout();
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); W = innerWidth; H = innerHeight; layout(); });
const cellW = () => B.w / 3 * 0.8;

function put(e, fromX, fromY) {
  const empty = slots.filter(s => !s.f && !fly.some(f => f.slot === s));
  if (!empty.length) return false;
  let best = empty[0];
  if (fromX !== undefined && fromY !== undefined && Math.abs(fromX - B.x) < B.w / 2 && Math.abs(fromY - B.y) < B.h / 2)
    best = empty.sort((a, b) => Math.hypot(a.x - fromX, a.y - fromY) - Math.hypot(b.x - fromX, b.y - fromY))[0];
  fly.push({ e, slot: best, sx: fromX ?? W - 80, sy: fromY ?? H - 140, t: 0 });
  return true;
}

btn.addEventListener('pointerdown', () => { if (phase === 'fill' && put(pick(FOODS))) Sfx.tone(600, 0.1, 'sine', 0.1, 0, 900); });
cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY;
  if (eater && phase === 'eat' && Math.hypot(eater.x - x, eater.y - y) < 60) { for (let i = 0; i < 6; i++) hearts.push({ x: eater.x + rand(-30, 30), y: eater.y - 30, vy: rand(-90, -40), life: 1.4 }); Sfx.tone(800, 0.15, 'sine', 0.1, 0, 1100); popText('おいしい！', eater.x, eater.y - 80, '#ff5a8a', 34); return; }
  if (phase !== 'fill') return;
  for (const f of tray) if (Math.hypot(f.x - x, f.y - y) < f.size * 0.7) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { e: f.e, x, y, id: e.pointerId }; Sfx.tone(700, 0.06, 'sine', 0.08); return;
  }
  // はこの なかの おかずを さわると ぷるん
  for (const s of slots) if (s.f && Math.hypot(s.x - x, s.y - y) < cellW() / 2) { s.wob = 1; Sfx.tone(500, 0.08, 'triangle', 0.08); }
});
cv.addEventListener('pointermove', (e) => { if (drag && drag.id === e.pointerId) { drag.x = e.clientX; drag.y = e.clientY - 20; } });
const drop = (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  const d = drag; drag = null;
  if (Math.abs(d.x - B.x) < B.w / 2 + 30 && Math.abs(d.y - B.y) < B.h / 2 + 30) { if (put(d.e, d.x, d.y)) Sfx.tone(520, 0.08, 'square', 0.06); }
};
cv.addEventListener('pointerup', drop); cv.addEventListener('pointercancel', drop);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
  for (const f of fly) {
    f.t += dt; const u = Math.min(1, f.t / 0.35);
    f.x = f.sx + (f.slot.x - f.sx) * u; f.y = f.sy + (f.slot.y - f.sy) * u - Math.sin(u * Math.PI) * 50;
    if (u >= 1) { f.done = true; f.slot.f = f.e; f.slot.s = 0; f.slot.wob = 1; Sfx.tone(rand(400, 600), 0.08, 'sine', 0.12, 0, 300); }
  }
  fly = fly.filter(f => !f.done);
  for (const s of slots) { s.s = Math.min(1, s.s + dt * 6); s.wob = Math.max(0, (s.wob || 0) - dt * 3); }
  pt += dt;
  if (phase === 'fill' && slots.every(s => s.f) && !fly.length) { phase = 'lid'; pt = 0; Sfx.chime(); popText('いっぱい！', B.x, B.y - B.h / 2 - 40, '#ff7b00', 44); }
  else if (phase === 'lid' && pt > 1.4) { phase = 'come'; pt = 0; eater = { e: pick(EATERS), x: -80, y: B.y + B.h / 2 + 50 }; Sfx.tone(500, 0.12, 'sine', 0.1); Sfx.tone(700, 0.12, 'sine', 0.1, 0.15); }
  else if (phase === 'come') { const tx = B.x - B.w / 2 + 10; eater.x += (tx - eater.x) * Math.min(1, dt * 3); if (pt > 1.3) { phase = 'open'; pt = 0; Sfx.tone(900, 0.1, 'triangle', 0.1, 0, 1300); popText('ぱかっ', B.x, B.y - B.h / 2 - 30, '#ff7b00', 40); } }
  else if (phase === 'open' && pt > 0.8) { phase = 'eat'; pt = 0; }
  else if (phase === 'eat') {
    const s = slots.find(s => s.f && !s.eating);
    if (s && pt > 0.7) { pt = 0; s.eating = 1; Sfx.tone(300, 0.08, 'square', 0.05); Sfx.tone(260, 0.08, 'square', 0.05, 0.15); Sfx.tone(300, 0.08, 'square', 0.05, 0.3); }
    for (const q of slots) if (q.eating) { q.eating += dt; if (q.eating > 0.9) { q.f = null; q.eating = 0; } }
    if (!slots.some(q => q.f)) { phase = 'bye'; pt = 0; Sfx.yay(); popText('ごちそうさま', B.x, B.y - B.h / 2 - 40, '#ff5a8a', 40); for (let i = 0; i < 8; i++) hearts.push({ x: eater.x + rand(-30, 30), y: eater.y - 30, vy: rand(-90, -40), life: 1.6 }); }
  } else if (phase === 'bye') { if (pt > 1.2) eater.x += 280 * dt; if (eater.x > W + 100) { eater = null; phase = 'fill'; } }
  for (const h of hearts) { h.y += h.vy * dt; h.life -= dt; }
  hearts = hearts.filter(h => h.life > 0);
  draw(t);
  requestAnimationFrame(loop);
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // しきもの
  ctx.fillStyle = '#ffb3b3'; const cs = 40;
  for (let y = 0; y < H; y += cs) for (let x = (y / cs) % 2 ? cs : 0; x < W; x += cs * 2) ctx.fillRect(x, y, cs, cs);
  ctx.fillStyle = 'rgba(255,244,214,.55)'; ctx.fillRect(0, 0, W, H);
  // はこ
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.roundRect(B.x - B.w / 2 - 12, B.y - B.h / 2 - 12, B.w + 24, B.h + 24, 18); ctx.fill();
  ctx.fillStyle = '#2b1d1a'; ctx.beginPath(); ctx.roundRect(B.x - B.w / 2, B.y - B.h / 2, B.w, B.h, 10); ctx.fill();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 5; ctx.beginPath();
  for (let i = 1; i < 3; i++) { ctx.moveTo(B.x - B.w / 2 + B.w * i / 3, B.y - B.h / 2); ctx.lineTo(B.x - B.w / 2 + B.w * i / 3, B.y + B.h / 2); }
  ctx.moveTo(B.x - B.w / 2, B.y); ctx.lineTo(B.x + B.w / 2, B.y); ctx.stroke();
  ctx.fillStyle = '#7bc96a'; for (const s of slots) if (s.f) { ctx.beginPath(); ctx.moveTo(s.x - cellW() * 0.5, s.y + cellW() * 0.3); for (let k = 0; k <= 6; k++) ctx.lineTo(s.x - cellW() * 0.5 + k * cellW() / 6, s.y + cellW() * 0.3 - (k % 2 ? 10 : 0)); ctx.lineTo(s.x + cellW() * 0.5, s.y + cellW() * 0.4); ctx.lineTo(s.x - cellW() * 0.5, s.y + cellW() * 0.4); ctx.fill(); }
  for (const s of slots) if (s.f) {
    const k = s.eating ? Math.max(0, 1 - s.eating / 0.9) : 1, sz = Math.min(cellW(), B.h / 2 * 0.8) * (0.4 + 0.6 * s.s) * k;
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.sin(s.wob * 20) * s.wob * 0.2); drawEmoji(ctx, s.f, 0, 0, sz); ctx.restore();
  }
  // ふた
  let lid = 0;
  if (phase === 'lid') lid = Math.min(1, pt * 2); else if (phase === 'come') lid = 1; else if (phase === 'open') lid = Math.max(0, 1 - pt * 2);
  if (lid > 0) {
    const ly = B.y - B.h * 1.5 * (1 - lid);
    ctx.fillStyle = '#e8394a'; ctx.beginPath(); ctx.roundRect(B.x - B.w / 2 - 14, ly - B.h / 2 - 14, B.w + 28, B.h + 28, 18); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(B.x - 12, ly - B.h / 2 - 14, 24, B.h + 28); ctx.fillRect(B.x - B.w / 2 - 14, ly - 12, B.w + 28, 24);
    drawEmoji(ctx, '🎀', B.x, ly, 56);
  }
  // おかず だな
  if (phase === 'fill') for (const f of tray) { ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.size * 0.62, 0, 7); ctx.fill(); drawEmoji(ctx, f.e, f.x, f.y, f.size * 0.85); }
  for (const f of fly) drawEmoji(ctx, f.e, f.x, f.y, 50);
  if (drag) drawEmoji(ctx, drag.e, drag.x, drag.y, 60);
  if (eater) { const chew = phase === 'eat' ? Math.abs(Math.sin(t * 12)) * 0.08 : 0; ctx.save(); ctx.translate(eater.x, eater.y - Math.abs(Math.sin(t * 8)) * (phase === 'come' || phase === 'bye' ? 8 : 0)); ctx.scale(1 + chew, 1 - chew); drawEmoji(ctx, eater.e, 0, 0, 90); ctx.restore(); }
  for (const h of hearts) drawEmoji(ctx, '💗', h.x, h.y, 26);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
