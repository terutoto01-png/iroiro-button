<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>つり</title>
<link rel="stylesheet" href="common.css?v=21">
<style>
  body { background: #bfe9ff; }
  #cv { touch-action: none; }
  .big-btn { --c1: #20a4e8; --c2: #0d6f99; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🎣</span></button></div>
<script src="common.js?v=17"></script>
<script>
// つり: ボタンで はりを おとす → さかなが くいつく → ボタン れんだで まきあげる → ふねの バケツへ。
// うみを さわると ふねが そこへ うごく。そこの 👢 や 🎁 も つれる。ときどき おおきな 🐋（なかなか あがらない）。5ひき つれたら みんな うみへ かえす。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx), W = innerWidth, H = innerHeight;
const FISH = ['🐟', '🐠', '🐡', '🦑', '🐙', '🦀', '🐟', '🐠'];
let wy, floorY, boatX, boatTo, hook, fish = [], bed = [], bucket = [], bubbles = [], flyers = [], releaseT = -1;

function layout() { wy = Math.max(150, H * 0.3); floorY = H - 70; if (boatX === undefined) { boatX = boatTo = W * 0.42; } boatX = Math.min(boatX, W - 60); boatTo = Math.min(boatTo, W - 60); }
layout();
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); W = innerWidth; H = innerHeight; layout(); });
const rodTip = () => ({ x: boatX + 62, y: wy - 92 });
hook = { st: 'up', x: 0, y: 0, caught: null };

function newFish(kind) {
  const big = kind === 'whale', dir = Math.random() < 0.5 ? -1 : 1;
  return { e: big ? '🐋' : pick(FISH), x: dir > 0 ? -60 : W + 60, y: big ? rand(wy + 120, floorY - 80) : rand(wy + 60, floorY - 30), vx: dir * (big ? 40 : rand(40, 90)), size: big ? 110 : rand(36, 52), w: big ? 2.5 : 1, ph: rand(0, 6), dart: 0 };
}
for (let i = 0; i < 6; i++) { const f = newFish(); f.x = rand(40, W - 40); fish.push(f); }
function fillBed() { bed = []; for (let i = 0; i < 2; i++) bed.push({ e: pick(['👢', '🎁', '👑', '💎', '🥫']), x: rand(40, W - 160), w: 1.5 }); }
fillBed();

btn.addEventListener('pointerdown', () => {
  if (releaseT >= 0) return;
  if (hook.st === 'up') { hook.st = 'sink'; hook.x = rodTip().x; hook.y = wy + 10; Sfx.tone(500, 0.2, 'sine', 0.12, 0, 250); Sfx.noise(0.2, 0.15, 1500); return; }
  // まきあげ（おもい ものは すこしずつ）
  const w = hook.caught ? hook.caught.w : 0.5;
  hook.y -= Math.max(14, H * 0.07 / w);
  hook.st = hook.caught ? 'reel' : 'back';
  Sfx.tone(rand(300, 380), 0.06, 'square', 0.05); Sfx.tone(rand(420, 480), 0.05, 'square', 0.04, 0.05);
  if (hook.caught && Math.random() < 0.5) bubbles.push({ x: hook.x, y: hook.y, r: rand(3, 7), vy: -60 });
});
cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY;
  if (y > wy) {
    // さかなを さわると びっくりして にげる
    for (const f of fish) if (f !== hook.caught && Math.hypot(f.x - x, f.y - y) < f.size * 0.7) { f.dart = 1; f.vx = (f.x > x ? 1 : -1) * 260; Sfx.tone(900, 0.08, 'sine', 0.1, 0, 1400); for (let i = 0; i < 5; i++) bubbles.push({ x: f.x, y: f.y, r: rand(3, 8), vy: rand(-90, -50) }); return; }
    boatTo = Math.max(50, Math.min(W - 90, x - 62));
    for (let i = 0; i < 4; i++) bubbles.push({ x, y, r: rand(3, 8), vy: rand(-80, -40) });
    Sfx.tone(rand(500, 700), 0.1, 'sine', 0.08, 0, 300);
  }
});

function landed() {
  const c = hook.caught; hook.caught = null; hook.st = 'up';
  if (c.bed) bed = bed.filter(b => b !== c); else fish = fish.filter(f => f !== c);
  flyers.push({ e: c.e, x: rodTip().x, y: wy, t: 0, size: c.size || 48 });
  Sfx.yay(); setTimeout(() => Sfx.chime(), 200);
  popText(c.e === '🐋' ? 'おおきい！' : c.e === '👢' ? 'ながぐつ！' : c.bed ? 'たからもの！' : pick(['つれた！', 'やったー！']), W / 2, wy - 120, '#ff7b00', 48);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
  boatX += (boatTo - boatX) * Math.min(1, dt * 2);
  const tip = rodTip();
  // はり
  if (hook.st === 'up') { hook.x = tip.x; hook.y = wy - 20; }
  else {
    hook.x += (tip.x - hook.x) * Math.min(1, dt * 3);
    if (hook.st === 'sink') { hook.y += 160 * dt; if (hook.y > floorY - 24) { hook.y = floorY - 24; hook.st = 'wait'; } }
    if (hook.caught) {
      const c = hook.caught; c.x = hook.x + Math.sin(t * 9) * 8; c.y = hook.y + (c.size || 40) * 0.35;
      hook.y = Math.min(floorY - 24, hook.y + (c.w > 2 ? 12 : 5) * dt); // ひっぱられる
      if (hook.y < wy - 6) landed();
    } else if (hook.st === 'back' && hook.y < wy + 4) { hook.st = 'up'; }
    else if (hook.st === 'back') hook.st = 'wait';
    // くいつく
    if (!hook.caught && hook.y > wy + 30) {
      for (const f of fish) {
        const d = Math.hypot(f.x - hook.x, f.y - hook.y);
        if (d < 150 && !f.dart) { f.vx += Math.sign(hook.x - f.x) * 60 * dt; f.y += Math.sign(hook.y - f.y) * 40 * dt; }
        if (d < f.size * 0.6 && !f.dart && Math.random() < dt * 3) { hook.caught = f; hook.st = 'reel'; Sfx.tone(300, 0.3, 'sawtooth', 0.06, 0, 600); popText('！', hook.x, hook.y - 50, '#fff', 50); break; }
      }
      if (!hook.caught) for (const b of bed) if (Math.abs(b.x - hook.x) < 34 && hook.y > floorY - 40) { b.bed = true; b.size = 46; hook.caught = b; hook.st = 'reel'; Sfx.tone(400, 0.2, 'triangle', 0.1, 0, 700); break; }
    }
  }
  // さかな
  for (const f of fish) {
    if (f === hook.caught) continue;
    f.dart = Math.max(0, f.dart - dt);
    f.vx = Math.sign(f.vx || 1) * Math.min(Math.abs(f.vx), f.dart ? 300 : (f.e === '🐋' ? 45 : 100));
    f.x += f.vx * dt; f.y += Math.sin(t * 2 + f.ph) * 10 * dt;
    f.y = Math.max(wy + 40, Math.min(floorY - 26, f.y));
  }
  fish = fish.filter(f => f === hook.caught || (f.x > -120 && f.x < W + 120));
  while (fish.length < 6) fish.push(newFish(Math.random() < 0.08 && !fish.some(f => f.e === '🐋') ? 'whale' : null));
  if (bed.length === 0 && Math.random() < dt * 0.1) fillBed();
  for (const b of bubbles) { b.y += b.vy * dt; b.x += Math.sin(t * 5 + b.r) * 10 * dt; }
  bubbles = bubbles.filter(b => b.y > wy);
  if (Math.random() < dt * 2) bubbles.push({ x: rand(0, W), y: floorY, r: rand(2, 5), vy: -40 });
  // つれた ものは バケツへ とんでいく
  for (const f of flyers) {
    f.t += dt;
    if (f.t > 1.2 && !f.done && !f.back) { f.done = true; bucket.push(f.e); if (bucket.length >= 5) releaseT = 0; }
  }
  flyers = flyers.filter(f => f.t < 1.25);
  // 5ひき → みんな うみへ かえす
  if (releaseT >= 0) {
    releaseT += dt;
    if (releaseT > 1 && bucket.length) {
      releaseT = 0.6; const e = bucket.shift();
      flyers.push({ e, x: boatX + 20, y: wy - 40, t: 0, back: true, vx: rand(-160, 160), vy: -300, size: 40 });
      Sfx.tone(rand(500, 800), 0.15, 'sine', 0.1, 0, 300);
      if (!bucket.length) { popText('ばいばーい', W / 2, wy - 120, '#2a7cc2', 44); releaseT = -1; }
    }
  }
  draw(t);
  requestAnimationFrame(loop);
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawEmoji(ctx, '☀️', W - 70, 110, 60);
  // うみ
  const g = ctx.createLinearGradient(0, wy, 0, H);
  g.addColorStop(0, '#3fb4f0'); g.addColorStop(1, '#0d4f8a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 10) ctx.lineTo(x, wy + Math.sin(x / 40 + t * 2) * 5);
  ctx.lineTo(W, H); ctx.fill();
  // すな と そこの もの
  ctx.fillStyle = '#e8cf8f'; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, floorY + Math.sin(x / 60) * 8);
  ctx.lineTo(W, H); ctx.fill();
  drawEmoji(ctx, '🪸', W * 0.12, floorY - 6, 46); drawEmoji(ctx, '🌿', W * 0.62, floorY - 10, 40);
  for (const b of bed) if (b !== hook.caught) drawEmoji(ctx, b.e, b.x, floorY - 14, 40);
  for (const b of bubbles) { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke(); }
  // さかな（すすむ ほうを むく。えもじは ひだりむき）
  for (const f of fish) {
    ctx.save(); ctx.translate(f.x, f.y);
    if (f === hook.caught) ctx.rotate(Math.sin(t * 14) * 0.4 - 0.5);
    if (f.vx > 0 && f !== hook.caught) ctx.scale(-1, 1);
    drawEmoji(ctx, f.e, 0, 0, f.size); ctx.restore();
  }
  if (hook.caught && hook.caught.bed) drawEmoji(ctx, hook.caught.e, hook.x, hook.y + 20, 44);
  // いと と はり
  const tip = rodTip();
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.lineTo(hook.x, hook.y); ctx.stroke();
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(hook.x - 5, hook.y, 6, 0, Math.PI); ctx.stroke();
  // ふね
  const by = wy + Math.sin(t * 1.6) * 4;
  ctx.fillStyle = '#b5652b'; ctx.beginPath(); ctx.moveTo(boatX - 70, by - 26); ctx.lineTo(boatX + 70, by - 26); ctx.lineTo(boatX + 50, by + 10); ctx.lineTo(boatX - 50, by + 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8a4a1c'; ctx.fillRect(boatX - 70, by - 30, 140, 8);
  drawEmoji(ctx, '🐻', boatX - 10, by - 58, 54);
  ctx.strokeStyle = '#6b3f1d'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(boatX + 8, by - 50); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  drawEmoji(ctx, '🪣', boatX - 52, by - 44, 36);
  bucket.forEach((e, i) => drawEmoji(ctx, e, boatX - 52 + (i - 2) * 26, by - 74 - (i % 2) * 8, 26));
  // つれた もの
  for (const f of flyers) {
    let x, y, s = f.size * 1.6;
    if (f.back) { x = f.x + f.vx * f.t; y = f.y + f.vy * f.t + 600 * f.t * f.t; s = f.size; }
    else if (f.t < 0.7) { const u = f.t / 0.7; x = f.x + (W / 2 - f.x) * u; y = f.y + (wy - 150 - f.y) * u - Math.sin(u * Math.PI) * 40; s *= 0.6 + u * 0.8; }
    else { const u = (f.t - 0.7) / 0.5; x = W / 2 + (boatX - 52 - W / 2) * u; y = wy - 150 + (wy - 70 - (wy - 150)) * u; s = f.size * 2.2 * (1 - u * 0.75); }
    drawEmoji(ctx, f.e, x, y, s);
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
