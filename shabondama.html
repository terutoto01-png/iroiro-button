<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>しゃぼんだま</title>
<link rel="stylesheet" href="common.css?v=22">
<style>
  body { background: linear-gradient(#7fd3ff, #d9f4ff 70%, #a8e6a1 70%); }
  .big-btn { --c1: #29b6f6; --c2: #0277bd; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🫧</span></button></div>
<script src="common.js?v=18"></script>
<script src="multi.js?v=4"></script>
<script>
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d');
const btn = document.getElementById('btn');
fitCanvas(canvas, ctx); addEventListener('resize', () => fitCanvas(canvas, ctx));
let bubbles = [], drops = [];

function blow(nx, ny, remote, s) {
  const seed = s ?? Multi.seed();
  const R = Multi.rng(seed), rf = (a, b) => a + R() * (b - a);
  const r = btn.getBoundingClientRect();
  const sx = nx ?? ((r.left + r.width / 2) / innerWidth);
  const sy = ny ?? (r.top / innerHeight);
  const n = Math.floor(rf(5, 10));
  for (let i = 0; i < n; i++) {
    bubbles.push({
      seed, idx: i,
      nx: sx, ny: sy, nvx: rf(-0.24, 0.24), nvy: rf(-0.30, -0.12),
      nr: rf(0.032, 0.082), ph: rf(0, 6), hue: rf(0, 360), born: performance.now(),
    });
  }
  if (bubbles.length > 80) bubbles.splice(0, bubbles.length - 80);
  Sfx.noise(0.5, 0.25, 900, 0, 'bandpass');
  if (!remote) Multi.send({ a: 'blow', x: sx, y: sy, s: seed }, 80);
}
btn.addEventListener('pointerdown', () => blow());

const bxOf = (b) => b.nx * innerWidth;
const byOf = (b) => b.ny * innerHeight;
const brOf = (b) => Math.max(16, Math.min(62, b.nr * Math.min(innerWidth, innerHeight)));

function pop(b) {
  const px = bxOf(b), py = byOf(b), pr = brOf(b);
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2;
    drops.push({ x: px + Math.cos(a) * pr, y: py + Math.sin(a) * pr, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, life: 0.4 });
  }
  Sfx.tone(rand(900, 1400) - pr * 8, 0.08, 'sine', 0.35, 0, 200);
}
canvas.addEventListener('pointerdown', (e) => {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (Math.hypot(bxOf(b) - e.clientX, byOf(b) - e.clientY) < brOf(b) + 12) {
      pop(b); bubbles.splice(i, 1);
      Multi.send({ a: 'pop', s: b.seed, i: b.idx, x: b.nx, y: b.ny }, 40);
      return;
    }
  }
});
Multi.join('shabondama', (msg) => {
  if (msg.a === 'blow') {
    const nx = msg.x ?? 0.5, ny = msg.y ?? 0.68;
    blow(nx, ny, true, msg.s);
    Multi.showPeer(msg, nx * innerWidth, ny * innerHeight);
  } else if (msg.a === 'pop') {
    let idx = (msg.s !== undefined && msg.i !== undefined)
      ? bubbles.findIndex(b => b.seed === msg.s && b.idx === msg.i)
      : -1;
    const x = (msg.x ?? 0.5) * innerWidth, y = (msg.y ?? 0.5) * innerHeight;
    if (idx < 0) {
      let bd = 120;
      bubbles.forEach((b, i) => { const d = Math.hypot(bxOf(b) - x, byOf(b) - y); if (d < bd) { bd = d; idx = i; } });
    }
    if (idx >= 0) { const b = bubbles[idx]; pop(b); bubbles.splice(idx, 1); Multi.showPeer(msg, bxOf(b), byOf(b)); }
    else { pop({ nx: msg.x ?? 0.5, ny: msg.y ?? 0.5, nr: 0.04 }); Multi.showPeer(msg, x, y); }
  }
});

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const b of bubbles) {
    b.ph += dt * 2;
    b.nvx *= Math.pow(0.5, dt); b.nvy = b.nvy * Math.pow(0.5, dt) - 0.036 * dt;
    b.nx += (b.nvx + Math.sin(b.ph) * 0.04) * dt; b.ny += b.nvy * dt;
    const x = bxOf(b), y = byOf(b), r = brOf(b);
    // しゃぼん
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.05)');
    g.addColorStop(0.8, `hsla(${b.hue + b.ph * 30}, 100%, 75%, 0.25)`);
    g.addColorStop(1, `hsla(${b.hue + 120 + b.ph * 30}, 100%, 70%, 0.6)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.ellipse(x - r * 0.4, y - r * 0.4, r * 0.18, r * 0.1, -0.7, 0, 7); ctx.fill();
  }
  // うえに いったら しぜんに われる
  bubbles = bubbles.filter(b => { if (byOf(b) < -brOf(b) || now - b.born > 14000) { if (byOf(b) > 0) pop(b); return false; } return true; });
  for (const d of drops) {
    d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt;
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, d.life / 0.4)})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, 7); ctx.fill();
  }
  drops = drops.filter(d => d.life > 0);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
