<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>しゃぼんだま</title>
<link rel="stylesheet" href="common.css?v=22">
<style>
  body { background: linear-gradient(#7fd3ff, #d9f4ff 70%, #a8e6a1 70%); }
  .big-btn { --c1: #29b6f6; --c2: #0277bd; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🫧</span></button></div>
<script src="common.js?v=18"></script>
<script src="multi.js?v=3"></script>
<script>
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d');
const btn = document.getElementById('btn');
fitCanvas(canvas, ctx); addEventListener('resize', () => fitCanvas(canvas, ctx));
let bubbles = [], drops = [];

function blow(atX, atY, remote, s) {
  const seed = s ?? Multi.seed();
  const R = Multi.rng(seed), rf = (a, b) => a + R() * (b - a);
  const r = btn.getBoundingClientRect();
  const bx = atX ?? (r.left + r.width / 2), by = atY ?? r.top;
  const n = Math.floor(rf(5, 10));
  for (let i = 0; i < n; i++) {
    bubbles.push({
      x: bx, y: by, vx: rf(-160, 160), vy: rf(-220, -90),
      r: rf(18, 55), ph: rf(0, 6), hue: rf(0, 360), born: performance.now(),
    });
  }
  if (bubbles.length > 80) bubbles.splice(0, bubbles.length - 80);
  Sfx.noise(0.5, 0.25, 900, 0, 'bandpass');
  if (!remote) Multi.send({ a: 'blow', x: bx / innerWidth, s: seed }, 80);
}
btn.addEventListener('pointerdown', () => blow());

function pop(b) {
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2;
    drops.push({ x: b.x + Math.cos(a) * b.r, y: b.y + Math.sin(a) * b.r, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, life: 0.4 });
  }
  Sfx.tone(rand(900, 1400) - b.r * 8, 0.08, 'sine', 0.35, 0, 200);
}
canvas.addEventListener('pointerdown', (e) => {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (Math.hypot(b.x - e.clientX, b.y - e.clientY) < b.r + 10) {
      pop(b); bubbles.splice(i, 1);
      Multi.send({ a: 'pop', x: e.clientX / innerWidth, y: e.clientY / innerHeight }, 50);
      return;
    }
  }
});
Multi.join('shabondama', (msg) => {
  if (msg.a === 'blow') {
    const x = (msg.x ?? 0.5) * innerWidth, y = innerHeight - 130;
    blow(x, y, true, msg.s); Multi.showPeer(msg, x, y);
  } else if (msg.a === 'pop') {
    const x = (msg.x ?? 0.5) * innerWidth, y = (msg.y ?? 0.5) * innerHeight;
    let best = -1, bd = 120;
    bubbles.forEach((b, i) => { const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; best = i; } });
    if (best >= 0) { pop(bubbles[best]); bubbles.splice(best, 1); }
    else pop({ x, y, r: 24 });
    Multi.showPeer(msg, x, y);
  }
});

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const b of bubbles) {
    b.ph += dt * 2;
    b.vx *= Math.pow(0.5, dt); b.vy = b.vy * Math.pow(0.5, dt) - 25 * dt;
    b.x += (b.vx + Math.sin(b.ph) * 30) * dt; b.y += b.vy * dt;
    // しゃぼん
    const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
    g.addColorStop(0, 'rgba(255,255,255,0.05)');
    g.addColorStop(0.8, `hsla(${b.hue + b.ph * 30}, 100%, 75%, 0.25)`);
    g.addColorStop(1, `hsla(${b.hue + 120 + b.ph * 30}, 100%, 70%, 0.6)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.ellipse(b.x - b.r * 0.4, b.y - b.r * 0.4, b.r * 0.18, b.r * 0.1, -0.7, 0, 7); ctx.fill();
  }
  // うえに いったら しぜんに われる
  bubbles = bubbles.filter(b => { if (b.y < -b.r || now - b.born > 14000) { if (b.y > 0) pop(b); return false; } return true; });
  for (const d of drops) {
    d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt;
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, d.life / 0.4)})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, 7); ctx.fill();
  }
  drops = drops.filter(d => d.life > 0);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
