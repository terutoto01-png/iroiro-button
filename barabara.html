<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ばらばら</title>
<link rel="stylesheet" href="common.css?v=7">
<style>
  body { background: #e6f0ff; }
  .big-btn { --c1: #00b3a4; --c2: #007a70; }
</style>
</head>
<body>
<canvas id="cv" class="full"><button id="btn" class="big-btn"><span class="emoji">🧩</span></button></canvas>
<script src="common.js?v=7"></script>
<script>
// ばらばら: HTML-in-Canvas で本物のボタンを写し取って、こなごなにして もどす
const canvas = document.getElementById('cv');
const btn = document.getElementById('btn');
const ctx = canvas.getContext('2d');
HIC.attach(canvas, btn);
let dpr = fitCanvas(canvas, ctx);
let sprite = null;
addEventListener('resize', () => { dpr = fitCanvas(canvas, ctx); sprite = null; });

const GRID = 6;
let pieces = [], state = 'whole', timer = 0, bob = 0, last = performance.now();

function center() { return { x: innerWidth / 2, y: innerHeight / 2 }; }

function shatter() {
  const { w, h } = sprite, c = center();
  const pw = w / GRID, ph = h / GRID;
  pieces = [];
  for (let gy = 0; gy < GRID; gy++) for (let gx = 0; gx < GRID; gx++) {
    const hx = (gx + 0.5) * pw - w / 2, hy = (gy + 0.5) * ph - h / 2;
    const a = Math.atan2(hy, hx) + rand(-0.4, 0.4), sp = rand(400, 1100);
    pieces.push({
      gx, gy, pw, ph, hx, hy,
      x: c.x + hx, y: c.y + hy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 400,
      rot: 0, vr: rand(-12, 12), sx: 0, sy: 0, srot: 0,
    });
  }
  state = 'broken'; timer = 0;
  Sfx.noise(0.5, 1.0, 3000);
  Sfx.noise(0.2, 0.6, 7000, 0, 'highpass');
  for (let i = 0; i < 8; i++) Sfx.tone(rand(1500, 3500), 0.1, 'triangle', 0.06, rand(0, 0.4));
}

canvas.addEventListener('pointerdown', (e) => {
  if (state !== 'whole' || !sprite) return;
  const c = center();
  if (Math.hypot(e.clientX - c.x, e.clientY - c.y) > btn.offsetWidth * 0.6) return;
  shatter();
});

function frame() {
  const now = performance.now(), dt = Math.min(0.033, (now - last) / 1000); last = now;
  const W = innerWidth, H = innerHeight, c = center();
  if (!sprite) sprite = HIC.capture(ctx, canvas, btn, dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (state === 'whole') {
    bob += dt;
    const s = 1 + Math.sin(bob * 3) * 0.03;
    ctx.save();
    ctx.translate(c.x, c.y); ctx.scale(s, s);
    HIC.draw(ctx, btn, -btn.offsetWidth / 2, -btn.offsetHeight / 2);
    ctx.restore();
    return;
  }

  timer += dt;
  if (state === 'broken') {
    for (const p of pieces) {
      p.vy += 1600 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > H - p.ph / 2) { p.y = H - p.ph / 2; p.vy *= -0.4; p.vx *= 0.7; p.vr *= 0.6; }
      if (p.x < p.pw / 2) { p.x = p.pw / 2; p.vx = Math.abs(p.vx) * 0.6; }
      if (p.x > W - p.pw / 2) { p.x = W - p.pw / 2; p.vx = -Math.abs(p.vx) * 0.6; }
    }
    if (timer > 2.2) {
      state = 'return'; timer = 0;
      for (const p of pieces) { p.sx = p.x; p.sy = p.y; p.srot = p.rot; }
      // ぴゅるるる〜
      Sfx.tone(300, 0.9, 'sine', 0.15, 0, 1200);
    }
  } else if (state === 'return') {
    const k = Math.min(1, timer / 0.9);
    const e = k < 1 ? 1 - Math.pow(1 - k, 3) : 1;
    for (const p of pieces) {
      p.x = p.sx + (c.x + p.hx - p.sx) * e;
      p.y = p.sy + (c.y + p.hy - p.sy) * e - Math.sin(k * Math.PI) * 120;
      p.rot = p.srot * (1 - e);
    }
    if (k >= 1) { state = 'whole'; bob = 0; Sfx.chime(); }
  }

  const sw = sprite.base.width / GRID, sh = sprite.base.height / GRID;
  for (const p of pieces) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.drawImage(sprite.base, p.gx * sw, p.gy * sh, sw, sh, -p.pw / 2, -p.ph / 2, p.pw + 0.5, p.ph + 0.5);
    ctx.restore();
  }
}
HIC.loop(canvas, frame);
</script>
</body>
</html>
