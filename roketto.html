<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>ロケット</title>
<link rel="stylesheet" href="common.css?v=21">
<style>
  body { background: linear-gradient(#0b1033, #24307a 60%, #6f86d6); }
  .big-btn { --c1: #ff3b3b; --c2: #a81c1c; }
  .bottom-center { left: auto; right: max(30px, env(safe-area-inset-right)); transform: none; bottom: max(30px, env(safe-area-inset-bottom) + 12px); }
  .bottom-center .big-btn { width: min(30vw, 150px); height: min(30vw, 150px); }
  #rocket { position: fixed; left: 50%; bottom: 60px; font-size: min(30vw, 160px); line-height: 1; z-index: 6;
            transform: translateX(-50%) rotate(-45deg); pointer-events: none; }
  #count { position: fixed; left: 50%; top: 35%; transform: translate(-50%, -50%); z-index: 8; pointer-events: none;
           font-size: min(40vw, 220px); font-weight: bold; color: #fff; text-shadow: 0 8px 0 rgba(0,0,0,.3); }
  #pad { position: fixed; left: 50%; bottom: 0; width: 240px; height: 60px; transform: translateX(-50%);
         background: #555; border-radius: 12px 12px 0 0; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div id="pad"></div>
<div id="rocket">🚀</div>
<div id="count"></div>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🔴</span></button></div>
<script src="common.js?v=17"></script>
<script>
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d');
const btn = document.getElementById('btn'), rocket = document.getElementById('rocket'), count = document.getElementById('count');
fitCanvas(canvas, ctx); addEventListener('resize', () => fitCanvas(canvas, ctx));
let busy = false, ry = 0, rv = 0, flying = false, smoke = [], shake = 0;
const stars = Array.from({ length: 120 }, () => ({ x: Math.random(), y: Math.random(), r: rand(0.5, 2) }));

function say(n, text, f) {
  count.textContent = n;
  count.animate([{ scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1 }], { duration: 300, easing: 'ease-out' });
  speak(text, 1.1, 1.2);
  Sfx.tone(f, 0.25, 'square', 0.1);
}

// れんだ: カウントダウンちゅうは ゴゴゴ、とんでいるときは もっと はやく
function mash() {
  if (flying) {
    rv += 260; shake = Math.min(1.5, shake + 0.5);
    Sfx.noise(0.4, 0.6, 600); Sfx.tone(rand(500, 800), 0.25, 'sine', 0.1, 0, 1600);
    popText(pick(['びゅーん', 'ごおっ', '🔥', '💨']), innerWidth / 2 + rand(-120, 120), innerHeight * rand(0.3, 0.6), '#ffcc33', 48);
  } else {
    shake = Math.min(1.2, shake + 0.35);
    Sfx.noise(0.25, 0.5, 250); Sfx.tone(rand(50, 80), 0.3, 'sawtooth', 0.08);
  }
}
btn.addEventListener('pointerdown', () => {
  if (busy) { mash(); return; }
  busy = true;
  say('3', 'さん', 440);
  setTimeout(() => say('2', 'に', 440), 1000);
  setTimeout(() => say('1', 'いち', 440), 2000);
  setTimeout(() => {
    say('🔥', 'はっしゃ！', 880);
    flying = true; rv = 0; shake = 1;
    Sfx.noise(3.5, 1.0, 400);
    Sfx.tone(60, 3, 'sawtooth', 0.15, 0, 200);
  }, 3000);
  setTimeout(() => { count.textContent = ''; }, 3800);
});

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const W = innerWidth, H = innerHeight;
  if (flying) {
    rv += 900 * dt; ry += rv * dt;
    for (let i = 0; i < 6; i++) smoke.push({ x: W / 2 + rand(-15, 15), y: H - 60 - ry + 40, vx: rand(-120, 120), vy: rand(50, 200), r: rand(10, 30), life: 1.5, fire: Math.random() < 0.4 });
    if (ry > H + 400) {
      flying = false;
      setTimeout(() => {
        ry = 0;
        rocket.animate([{ translate: '0 300px' }, { translate: '0 0' }], { duration: 700, easing: 'ease-out' });
        busy = false;
      }, 1200);
      Sfx.chime();
    }
  }
  shake *= Math.pow(0.3, dt);
  const sx = rand(-1, 1) * shake * 8;
  rocket.style.bottom = (60 + ry) + 'px';
  rocket.style.marginLeft = sx + 'px';
  document.getElementById('pad').style.marginLeft = sx + 'px';

  ctx.clearRect(0, 0, W, H);
  for (const s of stars) {
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.fillRect(s.x * W, ((s.y * H + ry * 0.3) % H), s.r, s.r);
  }
  for (const p of smoke) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.r += 30 * dt; p.life -= dt;
    const a = Math.max(0, p.life / 1.5);
    ctx.fillStyle = p.fire && p.life > 1.2 ? `rgba(255,${150 + Math.random() * 100 | 0},50,${a})` : `rgba(230,230,240,${a * 0.6})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  smoke = smoke.filter(p => p.life > 0);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
