<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>ガチャガチャ</title>
<link rel="stylesheet" href="common.css?v=16">
<style>
  body { background: radial-gradient(circle at 50% 30%, #fff6d6, #ffd36b); }
  .big-btn { --c1: #ff4d6d; --c2: #b3203e; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🔄</span></button></div>
<script src="common.js?v=15"></script>
<script>
// ガチャガチャ: ボタンで ハンドルが まわって カプセルが ころがりでる。パカッと ひらいて おもちゃが でてくる。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx);
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); });
const TOYS = ['🧸', '🚂', '🦄', '🐉', '🤖', '🎈', '🦖', '🚀', '🐳', '🍭', '⚽', '🪁', '🎺', '🛸', '🐙', '🦋', '🌈', '🚒', '🐼', '🍦', '👾', '🦀', '🎸', '🏎️'];
const CAPH = [0, 30, 55, 120, 200, 260, 300];
let handle = 0, handleV = 0, queue = 0, cool = 0, caps = [], shelf = [], sparks = [];
const inside = Array.from({ length: 22 }, () => ({ u: rand(-0.75, 0.75), v: rand(-0.1, 0.8), hue: pick(CAPH), rot: rand(0, 6), jx: 0, jy: 0 }));

const L = () => {
  const W = innerWidth, H = innerHeight, bottom = btn.getBoundingClientRect().top - 20;
  const s = Math.min(W * 0.62, (bottom - 90) * 0.6, 360);
  const cx = W / 2, domeY = 90 + s * 0.5;
  return { W, H, s, cx, domeY, bodyY: domeY + s * 0.42, bodyH: s * 0.62, floor: bottom - 10, bottom };
};

btn.addEventListener('pointerdown', () => {
  handleV += 9;
  for (const c of inside) { c.jx = rand(-1, 1); c.jy = rand(-1, 1); }
  Sfx.noise(0.25, 0.4, 1200);
  for (let i = 0; i < 4; i++) Sfx.tone(rand(300, 600), 0.04, 'square', 0.05, i * 0.06);  // ガラガラ
  if (queue < 3) queue++;
});

function out() {
  const { cx, bodyY, bodyH, s } = L();
  const hue = pick(CAPH);
  caps.push({ x: cx + s * 0.18, y: bodyY + bodyH * 0.72, vx: rand(-260, -120), vy: -rand(80, 200), r: s * 0.1, hue, rot: 0, state: 'roll', t: 0, toy: pick(TOYS) });
  Sfx.tone(800, 0.08, 'sine', 0.12, 0, 400); // ころん
}
function burst(x, y, n) { for (let i = 0; i < n; i++) { const a = rand(0, 7), sp = rand(100, 380); sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.4, 0.9), hue: rand(0, 360) }); } }

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const { W, H, s, cx, domeY, bodyY, bodyH, floor } = L(), t = now / 1000;
  // ハンドル
  handle += handleV * dt; handleV *= Math.pow(0.15, dt);
  cool -= dt;
  if (queue > 0 && cool <= 0) { queue--; cool = 0.55; setTimeout(out, 250); }
  for (const c of inside) { c.jx *= Math.pow(0.05, dt); c.jy *= Math.pow(0.05, dt); }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // たな（でてきた おもちゃ）
  ctx.fillStyle = '#c98b4a'; ctx.fillRect(0, floor, W, 14);
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0, floor + 14, W, H);

  // からだ
  ctx.fillStyle = '#e8394a'; ctx.beginPath(); ctx.roundRect(cx - s * 0.42, bodyY, s * 0.84, bodyH, 18); ctx.fill();
  ctx.fillStyle = '#c42a39'; ctx.fillRect(cx - s * 0.42, bodyY + bodyH - 16, s * 0.84, 16);
  // とりだしぐち
  ctx.fillStyle = '#3a1d22'; ctx.beginPath(); ctx.roundRect(cx + s * 0.02, bodyY + bodyH * 0.55, s * 0.32, bodyH * 0.3, 12); ctx.fill();
  // ハンドル
  const hx = cx - s * 0.18, hy = bodyY + bodyH * 0.42, hr = s * 0.13;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(handle);
  ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.roundRect(-hr * 0.95, -hr * 0.22, hr * 1.9, hr * 0.44, 8); ctx.fill();
  ctx.restore();
  // ガラスの まる
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, domeY, s * 0.48, 0, 7); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(cx - s, domeY - s, s * 2, s * 2);
  for (const c of inside) {
    const x = cx + c.u * s * 0.4 + c.jx * 14 + Math.sin(handle + c.rot) * 3, y = domeY + c.v * s * 0.4 + c.jy * 14;
    capsule(x, y, s * 0.085, c.hue, c.rot + handle * 0.3, 0);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, domeY, s * 0.48, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(cx - s * 0.22, domeY - s * 0.25, s * 0.08, s * 0.04, -0.7, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8394a'; ctx.beginPath(); ctx.roundRect(cx - s * 0.2, domeY - s * 0.56, s * 0.4, s * 0.1, 10); ctx.fill();

  // でてきた カプセル
  for (const c of caps) {
    c.t += dt;
    if (c.state === 'roll') {
      c.vy += 1400 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vx / c.r * dt;
      if (c.y > floor - c.r) { c.y = floor - c.r; c.vy *= -0.45; c.vx *= 0.8; if (Math.abs(c.vy) < 60) c.vy = 0; Sfx.tone(300, 0.05, 'sine', 0.08); }
      if (c.x < c.r) { c.x = c.r; c.vx = Math.abs(c.vx); }
      if (c.t > 0.9) { c.state = 'open'; c.t = 0; Sfx.tone(500, 0.1, 'square', 0.08, 0, 1200); }
      capsule(c.x, c.y, c.r, c.hue, c.rot, 0);
    } else if (c.state === 'open') {
      const k = Math.min(1, c.t / 0.5);
      capsule(c.x, c.y, c.r, c.hue, 0, k);
      const ts = c.r * 2 + k * s * 0.35;
      drawEmoji(ctx, c.toy, c.x, c.y - k * s * 0.35, ts);
      if (c.t > 0.08 && !c.popped) { c.popped = true; burst(c.x, c.y - s * 0.2, 40); Sfx.chime(); }
      if (c.t > 1.4) { c.state = 'done'; shelf.push({ e: c.toy, t: 0, x0: c.x, y0: c.y - s * 0.35, s0: ts }); if (shelf.length > 10) shelf.shift(); }
    }
  }
  caps = caps.filter(c => c.state !== 'done');
  // たなに ならぶ
  const n = shelf.length, sz = Math.min(56, (W - 40) / 7);
  shelf.forEach((o, i) => {
    o.t += dt;
    const per = Math.max(2, Math.floor((W - 10 - (cx + s * 0.45)) / sz));
    const col = (n - 1 - i) % per, row = Math.floor((n - 1 - i) / per);
    const tx = W - 10 - sz / 2 - col * sz, ty = floor - sz * 0.45 - row * sz * 0.9;
    const k = Math.min(1, o.t / 0.5), e = 1 - Math.pow(1 - k, 3);
    drawEmoji(ctx, o.e, o.x0 + (tx - o.x0) * e, o.y0 + (ty - o.y0) * e - Math.sin(k * Math.PI) * 40, o.s0 + (sz * 0.8 - o.s0) * e);
  });
  // きらきら
  for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${Math.max(0, p.life)})`; ctx.fillRect(p.x - 4, p.y - 4, 8, 8); }
  sparks = sparks.filter(p => p.life > 0);
  requestAnimationFrame(loop);
})(last);

// カプセル（うえ はんぶんが いろ、した はんぶんが とうめい）。open で うえが とぶ
function capsule(x, y, r, hue, rot, open) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.fill();
  ctx.translate(-open * r * 1.5, -open * r * 2.5); ctx.rotate(-open * 1.2);
  ctx.fillStyle = `hsl(${hue}, 85%, 58%)`; ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.5, r * 0.25, r * 0.12, -0.5, 0, 7); ctx.fill();
  ctx.restore();
}
</script>
</body>
</html>
