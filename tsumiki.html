<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>どうぶつつみき</title>
<link rel="stylesheet" href="common.css?v=23">
<style>
  body { background: linear-gradient(#8fd3ff, #d4f1ff 70%); }
  #cv { touch-action: none; }
  .big-btn { --c1: #ff9f1c; --c2: #c47200; }
  .bottom-center { bottom: max(14px, var(--sab) + 6px); }
  .bottom-center .big-btn { width: min(24vw, 120px); height: min(24vw, 120px); font-size: min(7vw, 34px); }
  #reset { position: fixed; left: max(14px, var(--sal)); bottom: max(14px, var(--sab) + 6px); z-index: 30;
           width: min(16vw, 76px); height: min(16vw, 76px); font-size: min(4.5vw, 22px); --c1: #fff; --c2: #b9c3cf; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">⬇️</span></button></div>
<button id="reset" class="big-btn"><span class="emoji">🔄</span></button>
<script src="lib/matter.min.js?v=0.19.0"></script> <!-- ぶつり けいさん（MIT、このリポジトリから はいしん） -->
<script src="common.js?v=20"></script>
<script src="multi.js?v=11"></script>
<script>
// どうぶつつみき: うえの クレーンが どうぶつを つって うごく。ボタン（または がめんを タッチ）で おとして、だいの うえに つみあげる。
// どうぶつごとに おおきさと かたちが ちがう。だいから おちても おしまいに しない（「わ〜」と きえるだけ）。
// いちばん たかく つめた ところに 👑 の せん。🔄 で ぜんぶ おろして はじめから。
const { Engine, Bodies, Composite, Body } = Matter;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn'), resetBtn = document.getElementById('reset');
let dpr = fitCanvas(cv, ctx);

// どうぶつ: えもじ, よこ, たて（ユニットの なんばい）
const ANIMALS = [
  ['🐘', 1.55, 1.1], ['🐻', 1.15, 1.05], ['🐶', 1.0, 0.9], ['🐱', 0.9, 0.85], ['🐭', 0.62, 0.55], ['🐸', 0.85, 0.65],
  ['🐷', 1.0, 0.85], ['🐼', 1.1, 1.0], ['🐢', 1.3, 0.62], ['🐰', 0.75, 1.0], ['🦒', 0.8, 1.55], ['🐧', 0.7, 0.95],
];
const KEY = 'iroiro-best-doubutsu';
let fences = [], U, engine, ground, groundW, groundY, bodies = [], hand = null, next = null, crane = 0.5, craneDir = 1, cool = 0, cam = 0, camT = 0;
let best = 0, sparks = [], lastDrop = null;
let bird = null, plane = null, seen = { bird: false, plane: false, moon: false }; // たかさの しかけ
let calmT = 0, calmHeight = 0, landed = new Set();
// 家族部屋: 子 = ぶつりを けいさん する がわ、親 = とどいた いちを うつす がわ。どちらも じぶんの クレーンで おとせる
let role = 'solo', curH = 0, bodyId = 0, sendT = 0;
const duo = () => role !== 'solo';
const remote = { bodies: new Map(), h: 0, calm: 0, best: 0, bird: { x: 0, y: 0, p: -1 }, plane: -9, moon: 0 };
const oc = { x: 0, k: 99 }; // x は だいの まんなかから（ユニット）
const craneWX = () => +((innerWidth * (0.1 + crane * 0.8) - innerWidth / 2) / U).toFixed(3); // あいての クレーン（よこの いちと どうぶつ）
const ownHue = (o) => { const i = Multi.roleInfo || {}; const h = o === 0 ? (i.ko || {}).hu : (role === 'ko' ? (i.other || {}).hu : (i.me || {}).hu); return h ?? 200; };
try { best = parseFloat(localStorage.getItem(KEY)) || 0; } catch (e) {}
let cheerAt = best > 0 ? best + 0.05 : 1.5; // まえの きろくを こえたら おいわい

function setup() {
  dpr = fitCanvas(cv, ctx);
  const W = innerWidth, H = innerHeight;
  U = Math.min(W, H) * 0.12;
  engine = Engine.create({ enableSleeping: true }); engine.gravity.y = 1.1; // とまった どうぶつは やすませて ずれない ように
  groundW = Math.min(W * 0.84, U * 6.5); groundY = btn.getBoundingClientRect().top - 40; // だいは ひろめ
  ground = Bodies.rectangle(W / 2, groundY + 20, groundW, 40, { isStatic: true, friction: 1, frictionStatic: 2, chamfer: { radius: 10 } });
  // だいの りょうはしに ひくい さく（ころがってきた どうぶつを うけとめる）
  const fh = U * 0.45;
  fences = [-1, 1].map(sd => Bodies.rectangle(W / 2 + sd * (groundW / 2 - 6), groundY - fh / 2, 12, fh, { isStatic: true, friction: 1, chamfer: { radius: 5 } }));
  Composite.add(engine.world, [ground, ...fences]);
  bodies = []; cam = 0; camT = 0; hand = null; next = pickAnimal(); newHand();
  bird = null; plane = null; seen = { bird: false, plane: false, moon: false }; calmHeight = 0;
  curH = 0; bodyId = 0; remote.bodies.clear(); remote.h = 0; remote.calm = 0; remote.bird.p = -1; remote.plane = -9; remote.moon = 0;
}
function pickAnimal() { return pick(ANIMALS); }
function newHand() { hand = { a: next, t: 0 }; next = pickAnimal(); }
setup();
addEventListener('resize', setup);

function drop(x) {
  if (!hand || cool > 0) return;
  if (role === 'oya') { Multi.send({ a: 'g', i: 3, k: ANIMALS.indexOf(hand.a), m: [+((x - innerWidth / 2) / U).toFixed(3)] }, 0); hand = null; cool = 0.9; Sfx.tone(520, 0.1, 'sine', 0.12, 0, 300); return; } // 親は 子の がめんで おとす
  place(x, hand.a, 0);
  hand = null; cool = 0.9;
  Sfx.tone(520, 0.1, 'sine', 0.12, 0, 300); // ひゅっ
}
function place(x, an, owner) {
  const [e, w, h] = an, W = innerWidth;
  const bw = w * U, bh = h * U;
  const cx = Math.max(bw / 2 + 4, Math.min(W - bw / 2 - 4, x));
  const b = Bodies.rectangle(cx, hangY(bh) + bh / 2 - cam, bw, bh, {
    chamfer: { radius: Math.min(bw, bh) * 0.18 }, friction: 1, frictionStatic: 2, frictionAir: 0.035, restitution: 0, // ころがりにくく、ゆっくり おちる
    density: 0.0018 * (w * h > 1.3 ? 1.4 : 1),
  });
  b.emoji = e; b.kind = ANIMALS.indexOf(an); b.owner = owner; b.id = ++bodyId; b.bw = bw; b.bh = bh; b.born = performance.now(); b.wob = 0;
  Composite.add(engine.world, b); bodies.push(b); lastDrop = b;
}
const craneY = () => 70;
// どうぶつを つるす たかさ（がめんの y）。タワーの てっぺんの すこし うえ まで ロープを のばす（たかい ところから おとさない）
function hangY(bh) {
  const topScreen = groundY - curH * U + cam;
  return Math.max(craneY() + 40, Math.min(topScreen - U * 0.7 - bh, innerHeight * 0.55));
}
btn.addEventListener('pointerdown', () => drop(innerWidth * (0.1 + crane * 0.8)));
cv.addEventListener('pointerdown', (e) => { if (e.clientY > btn.getBoundingClientRect().top - 10) return; crane = Math.max(0, Math.min(1, (e.clientX / innerWidth - 0.1) / 0.8)); drop(e.clientX); });
function doReset() {
  for (const b of bodies) burst(b.position.x, b.position.y + cam, 10, Math.random() * 360);
  for (const e of remote.bodies.values()) burst(innerWidth / 2 + e.x * U, groundY + e.y * U + cam, 10, Math.random() * 360);
  Sfx.noise(0.4, 0.4, 3000, 0, 'bandpass'); Sfx.tone(800, 0.2, 'sine', 0.1, 0, 1600);
  setup();
}
resetBtn.addEventListener('pointerdown', () => { doReset(); if (duo()) Multi.send({ a: 'g', i: 7 }, 0); }); // どちらが おしても りょうほうで

// ---- 家族部屋 ----
const sendEv = (k, wx, wy) => Multi.send({ a: 'g', i: 5, k, m: [wx ?? 0, wy ?? 0] }, 0);
const toWorld = (x, y) => [(x - innerWidth / 2) / U, (y - groundY) / U];
Multi.duo('tsumiki', {
  swap: false,
  onRole(r) {
    if (r === role) return;
    role = r; setup();
  },
  onMsg(m) {
    if (m.a !== 'g') return;
    const W = innerWidth, H = innerHeight;
    if (m.i === 7) { doReset(); return; }
    if (role === 'ko') {
      if (m.i === 1) { oc.x = (m.m || [])[0] || 0; oc.k = m.k ?? 99; }
      else if (m.i === 3 && ANIMALS[m.k]) {
        place(W / 2 + ((m.m || [])[0] || 0) * U, ANIMALS[m.k], 1);
        Sfx.tone(520, 0.1, 'sine', 0.12, 0, 300);
      }
    } else if (role === 'oya') {
      const a = m.m || [];
      if (m.i === 9) {
        oc.x = a[8] || 0; oc.k = m.k ?? 99;
        remote.h = a[0] || 0; remote.calm = a[1] || 0; remote.best = a[2] || 0;
        remote.bird.x = a[3] || 0; remote.bird.y = a[4] || 0; remote.bird.p = a[5] ?? -1; remote.plane = a[6] ?? -9; remote.moon = a[7] || 0;
      } else if (m.i >= 10 && m.i <= 12) {
        const now = performance.now();
        for (let j = 0; j + 3 < a.length; j += 4) {
          const pk = Math.round(a[j]), id = Math.floor(pk / 64), low = pk % 64;
          let e = remote.bodies.get(id);
          if (!e) { e = { x: a[j + 1], y: a[j + 2], a: a[j + 3] }; remote.bodies.set(id, e); }
          e.tx = a[j + 1]; e.ty = a[j + 2]; e.ta = a[j + 3]; e.kind = low & 15; e.owner = (low >> 4) & 1; e.wob = (low >> 5) & 1; e.at = now;
        }
      } else if (m.i === 5) {
        const X = W / 2 + (a[0] || 0) * U, Y = groundY + (a[1] || 0) * U;
        if (m.k === 1) { Sfx.chime(); popText('👑', W / 2, H * 0.3, '#ffd23f', 64); }
        else if (m.k === 2) { Sfx.chime(); popText('🌙', W / 2, H * 0.25, '#fff', 70); }
        else if (m.k === 3) { Sfx.tone(700, 0.4, 'sine', 0.1, 0, 200); popText('わ〜！', Math.max(60, Math.min(W - 60, X)), H * 0.55, '#ff6fa8', 40); }
        else if (m.k === 4) { Sfx.tone(200 + Math.random() * 80, 0.12, 'sine', 0.25, 0, 120); burst(X, Y + cam, 8, 40); }
        else if (m.k === 5) { Sfx.tone(1800, 0.1, 'sine', 0.08); Sfx.tone(2200, 0.1, 'sine', 0.08, 0.12); }
        else if (m.k === 6) Sfx.noise(1.8, 0.2, 500);
      }
    }
  },
});
// 子の がめんの ようすを 親へ（1びょうに 8かいくらい）
function sendState() {
  Multi.send({ a: 'g', i: 9, k: hand ? ANIMALS.indexOf(hand.a) : 99, m: [
    curH, calmHeight, best,
    bird ? (bird.x - innerWidth / 2) / U : 0, bird ? ((bird.y ?? 0) - cam - groundY) / U : 0, bird ? (bird.perched ? 1 : 0) : -1,
    plane ? plane.x / innerWidth : -9, seen.moon ? 1 : 0, craneWX(),
  ].map(v => +v.toFixed(3)) }, 0);
  const list = bodies.slice(-72);
  for (let c = 0; c * 18 < list.length; c++) {
    const m = [];
    for (const b of list.slice(c * 18, c * 18 + 18)) {
      const [wx, wy] = toWorld(b.position.x, b.position.y);
      m.push(b.id * 64 + (b.wob > 0.35 ? 32 : 0) + b.owner * 16 + b.kind, +wx.toFixed(3), +wy.toFixed(3), +b.angle.toFixed(3));
    }
    Multi.send({ a: 'g', i: 10 + c, m }, 0);
  }
}

// ---- たかさの しかけ ----
function remoteSky(t, W, H) {
  const r = remote;
  if (r.bird.p >= 0) { ctx.save(); ctx.translate(W / 2 + r.bird.x * U, groundY + r.bird.y * U + cam + (r.bird.p ? 0 : Math.sin(t * 20) * 4)); ctx.scale(-1, 1); drawEmoji(ctx, '🐦', 0, 0, 30); ctx.restore(); }
  if (r.plane > -5) drawEmoji(ctx, '✈️', r.plane * W, H * 0.22, 48);
  if (r.moon) drawEmoji(ctx, '🌙', W * 0.8, 120 + Math.sin(t * 0.5) * 4, 56);
}
function skyEvents(dt, t, W, H) {
  if (role === 'oya') { remoteSky(t, W, H); return; }
  const h = calmHeight;
  if (h > 3.5 && !seen.bird) { seen.bird = true; bird = { x: -40, t: 0 }; Sfx.tone(1800, 0.1, 'sine', 0.08); Sfx.tone(2200, 0.1, 'sine', 0.08, 0.12); if (duo()) sendEv(5); }
  if (h > 6 && !seen.plane) { seen.plane = true; plane = { x: W + 80 }; Sfx.noise(1.8, 0.2, 500); if (duo()) sendEv(6); }
  if (h > 9 && !seen.moon) { seen.moon = true; Sfx.chime(); popText('🌙', W / 2, H * 0.25, '#fff', 70); if (duo()) sendEv(2); }
  // 🐦: とんできて いちばん うえの どうぶつに とまる
  if (bird) {
    const top = topBody();
    bird.t += dt;
    const tx = top ? top.position.x : W / 2, ty = top ? top.bounds.min.y + cam - 14 : H / 2;
    if (!bird.perched) { bird.x += (tx - bird.x) * Math.min(1, dt * 1.5); bird.y = (bird.y ?? ty - 120) + (ty - (bird.y ?? ty - 120)) * Math.min(1, dt * 1.5); if (Math.hypot(bird.x - tx, bird.y - ty) < 6) bird.perched = true; }
    else { bird.x = tx; bird.y = ty; }
    if (!top) bird = null;
    else { ctx.save(); ctx.translate(bird.x, bird.y + (bird.perched ? 0 : Math.sin(t * 20) * 4)); ctx.scale(-1, 1); drawEmoji(ctx, '🐦', 0, 0, 30); ctx.restore(); }
  }
  // ✈️: よこを とおる
  if (plane) { plane.x -= dt * 160; drawEmoji(ctx, '✈️', plane.x, H * 0.22, 48); if (plane.x < -80) plane = null; }
  if (seen.moon) drawEmoji(ctx, '🌙', W * 0.8, 120 + Math.sin(t * 0.5) * 4, 56);
}
function topBody() { let best = null; for (const b of bodies) if (!b.gone && landed.has(b) && (!best || b.bounds.min.y < best.bounds.min.y)) best = b; return best; }

function burst(x, y, n, hue) { for (let i = 0; i < n; i++) { const a = rand(0, 7), v = rand(80, 320); sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: rand(0.4, 0.9), hue: hue + rand(-20, 20) }); } }

// いま つみあがっている たかさ（だいの うえから、おちついている どうぶつの いちばん うえ）
function height() {
  let top = groundY;
  for (const b of bodies) if (!b.gone && landed.has(b)) top = Math.min(top, b.bounds.min.y); // ついた どうぶつ だけ
  return Math.max(0, (groundY - top) / U);
}
// ぜんぶの どうぶつが とまって いるか（きろくは おちついた ときだけ）
const calm = () => bodies.every(b => b.gone || !landed.has(b) || (b.speed < 0.6 && Math.abs(b.angularVelocity) < 0.03)); // おちてくる とちゅうの どうぶつは かぞえない

let last = performance.now(), acc = 0;
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const W = innerWidth, H = innerHeight, t = now / 1000;
  acc += dt;
  while (acc > 1 / 120) { if (role !== 'oya') Engine.update(engine, 1000 / 120); acc -= 1 / 120; }
  cool -= dt;
  if (!hand && cool <= 0) newHand();
  crane += craneDir * dt * 0.17; if (crane > 1) { crane = 1; craneDir = -1; } if (crane < 0) { crane = 0; craneDir = 1; }

  // おちた どうぶつ（だいより ずっと した）
  for (const b of bodies) {
    if (!b.gone && b.position.y > groundY + H * 0.6) {
      b.gone = true; Composite.remove(engine.world, b);
      Sfx.tone(700, 0.4, 'sine', 0.1, 0, 200);
      popText('わ〜！', Math.max(60, Math.min(W - 60, b.position.x)), H * 0.55, '#ff6fa8', 40);
      if (duo()) sendEv(3, ...toWorld(b.position.x, groundY + H * 0.2));
    }
    // ついた とき の おと（はじめて とまった とき）
    if (!landed.has(b) && !b.gone && performance.now() - b.born > 300 && b.speed < 0.8) {
      landed.add(b); Sfx.tone(200 + Math.random() * 80, 0.12, 'sine', 0.25, 0, 120); burst(b.position.x, b.bounds.max.y + cam, 8, 40);
      if (duo()) sendEv(4, ...toWorld(b.position.x, b.bounds.max.y));
    }
    b.wob = Math.min(1, Math.abs(b.angularVelocity) * 6 + (b.speed > 3 ? 0.5 : 0));
  }
  bodies = bodies.filter(b => !b.gone);

  // たかさ と きろく
  const h = role === 'oya' ? remote.h : height();
  curH = h;
  if (role === 'oya') { calmHeight = remote.calm; best = remote.best; } // 親は 子の きろくを みるだけ
  else {
    calmT = calm() && landed.size ? calmT + dt : 0;
    if (calmT > 0.6) calmHeight = h;
    if (calmT > 0.6 && h > best + 0.05) {
      if (h >= cheerAt) { cheerAt = h + 1; Sfx.chime(); popText('👑', W / 2, H * 0.3, '#ffd23f', 64); if (duo()) sendEv(1); } // きろく こうしん（1だん ぶん ごとに）
      best = h; try { localStorage.setItem(KEY, best.toFixed(2)); } catch (e) {}
    }
  }
  if (role === 'oya') { // とどいた いちへ なめらかに
    const k = Math.min(1, dt * 12), nw = performance.now();
    for (const [id, e] of remote.bodies) {
      if (nw - e.at > 700) { remote.bodies.delete(id); continue; }
      e.x += (e.tx - e.x) * k; e.y += (e.ty - e.y) * k; e.a += (e.ta - e.a) * k;
    }
  }
  if (duo()) { sendT += dt; if (sendT > 0.12) { sendT = 0; if (role === 'ko') sendState(); else Multi.send({ a: 'g', i: 1, k: hand ? ANIMALS.indexOf(hand.a) : 99, m: [craneWX()] }, 0); } }
  // カメラ: たかく なったら うえへ（クレーンと すきまを のこす）
  const topY = groundY - h * U;
  camT = Math.max(0, (craneY() + U * 3.2) - topY);
  cam += (camT - cam) * Math.min(1, dt * 2);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // そら: たかく つむほど ゆうがた → よる。とちゅうで 🐦 ✈️ 🌙 ⭐ に であう
  const night = Math.min(1, Math.max(0, (calmHeight - 6.5) / 3)); // たかく つむほど よるに なる
  if (night > 0) { ctx.fillStyle = `rgba(20,24,70,${night * 0.85})`; ctx.fillRect(0, 0, W, H); }
  for (let i = 0; i < 40 && night > 0.2; i++) { ctx.globalAlpha = night * (0.5 + 0.5 * Math.sin(t * 2 + i)); drawEmoji(ctx, '✨', (i * 97) % W, (i * 53 + cam * 0.2) % H, 12); }
  ctx.globalAlpha = 1;
  skyEvents(dt, t, W, H);
  // くも（すこし おそく ながれる）
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 5; i++) { const x = ((i * 0.27 + t * 0.008) % 1.3 - 0.15) * W, y = (i * 140 + cam * 0.3) % (H + 200) - 60; ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.arc(x + 30, y - 8, 34, 0, 7); ctx.arc(x + 62, y, 24, 0, 7); ctx.fill(); }
  ctx.save(); ctx.translate(0, cam);
  // じめん と だい
  ctx.fillStyle = '#7fbf4d'; ctx.fillRect(-10, groundY + 60, W + 20, H + 2000);
  ctx.fillStyle = '#a0683a'; ctx.beginPath(); ctx.roundRect(W / 2 - groundW / 2, groundY, groundW, 40, 10); ctx.fill();
  ctx.fillStyle = '#8a5a2e'; for (const f of fences) { ctx.beginPath(); ctx.roundRect(f.bounds.min.x, f.bounds.min.y, f.bounds.max.x - f.bounds.min.x, f.bounds.max.y - f.bounds.min.y + 4, 5); ctx.fill(); }
  ctx.fillStyle = '#7a4a24'; ctx.fillRect(W / 2 - groundW * 0.35, groundY + 38, 18, 30); ctx.fillRect(W / 2 + groundW * 0.35 - 18, groundY + 38, 18, 30);
  // きろくの せん
  if (best > 0.3) {
    const by = groundY - best * U;
    ctx.strokeStyle = 'rgba(255,190,0,.8)'; ctx.setLineDash([12, 10]); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, by); ctx.lineTo(W, by); ctx.stroke(); ctx.setLineDash([]);
    drawEmoji(ctx, '👑', W - 30, by - 18, 30);
  }
  // どうぶつ
  const drawBody = (emoji, x, y, ang, bw, bh, owner, wob, topY) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    if (duo()) { ctx.strokeStyle = `hsla(${ownHue(owner)}, 85%, 55%, .55)`; ctx.lineWidth = 5; ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, Math.min(bw, bh) * 0.18); ctx.stroke(); } // おとした ひとの いろで うすく ふちどり
    const s = Math.max(bw, bh);
    ctx.scale(bw / s * 1.12, bh / s * 1.12); // かたちに あわせて すこし のばす
    drawEmoji(ctx, emoji, 0, 0, s * 0.95);
    ctx.restore();
    if (wob) drawEmoji(ctx, '💦', x + bw * 0.45, topY + 4, 22); // ぐらぐら
  };
  for (const b of bodies) drawBody(b.emoji, b.position.x, b.position.y, b.angle, b.bw, b.bh, b.owner, b.wob > 0.35, b.bounds.min.y);
  if (role === 'oya') for (const e of remote.bodies.values()) {
    const [em, w, hh] = ANIMALS[e.kind]; const x = W / 2 + e.x * U, y = groundY + e.y * U;
    drawBody(em, x, y, e.a, w * U, hh * U, e.owner, e.wob, y - hh * U * 0.5);
  }
  ctx.restore();
  // クレーン
  const cx = W * (0.1 + crane * 0.8), cy = craneY();
  ctx.strokeStyle = '#8a929e'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(10, cy - 18); ctx.lineTo(W - 10, cy - 18); ctx.stroke();
  ctx.fillStyle = duo() ? `hsl(${ownHue(role === 'oya' ? 1 : 0)}, 90%, 58%)` : '#ffb300'; ctx.beginPath(); ctx.roundRect(cx - 22, cy - 30, 44, 24, 8); ctx.fill();
  if (duo()) { // あいての クレーン
    const ox = Math.max(10, Math.min(W - 10, W / 2 + oc.x * U));
    ctx.fillStyle = `hsl(${ownHue(role === 'oya' ? 0 : 1)}, 90%, 58%)`; ctx.beginPath(); ctx.roundRect(ox - 22, cy - 30, 44, 24, 8); ctx.fill();
    if (ANIMALS[oc.k]) {
      const [oe, ow, oh] = ANIMALS[oc.k], obw = ow * U, obh = oh * U, os = Math.max(obw, obh), oy = hangY(obh);
      ctx.strokeStyle = '#8a929e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(ox, cy - 6); ctx.lineTo(ox, oy); ctx.stroke();
      ctx.save(); ctx.translate(ox, oy + obh / 2); ctx.rotate(Math.sin(t * 3 + 1) * 0.08); ctx.scale(obw / os * 1.12, obh / os * 1.12); drawEmoji(ctx, oe, 0, 0, os * 0.95); ctx.restore();
    }
  }
  if (hand) {
    hand.t = Math.min(1, hand.t + dt * 5);
    const [e, w, hh] = hand.a, bw = w * U * (0.6 + 0.4 * hand.t), bh = hh * U * (0.6 + 0.4 * hand.t), s = Math.max(bw, bh);
    const hy = hangY(bh);
    ctx.strokeStyle = '#8a929e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, hy); ctx.stroke();
    ctx.save(); ctx.translate(cx, hy + bh / 2); ctx.rotate(Math.sin(t * 3) * 0.08); ctx.scale(bw / s * 1.12, bh / s * 1.12); drawEmoji(ctx, e, 0, 0, s * 0.95); ctx.restore();
    // おちる ところの めじるし
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.setLineDash([6, 10]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, hy + bh); ctx.lineTo(cx, groundY + cam); ctx.stroke(); ctx.setLineDash([]);
  }
  // つぎの どうぶつ
  if (next) { ctx.globalAlpha = 0.8; drawEmoji(ctx, next[0], W - 34, cy + 30, 30); ctx.globalAlpha = 1; }
  for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; ctx.fillStyle = `hsla(${p.hue}, 90%, 60%, ${Math.max(0, p.life * 1.5)})`; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill(); }
  sparks = sparks.filter(p => p.life > 0);
  requestAnimationFrame(loop);
})(last);
</script>
