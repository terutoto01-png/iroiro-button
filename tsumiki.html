<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>ひかりのつみき</title>
<link rel="stylesheet" href="common.css?v=9">
<style>
  body { background: linear-gradient(hsl(var(--h, 230), 60%, var(--l1, 22%)), hsl(calc(var(--h, 230) + 40), 55%, var(--l2, 45%))); transition: background 1s; }
  #fx, #fg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fx { pointer-events: none; }
  #fg { touch-action: none; }
  .big-btn { --c1: #29d3c8; --c2: #148a82; }
  .corner .big-btn { width: min(30vw, 160px); height: min(30vw, 160px); }
</style>
</head>
<body>
<canvas id="fg"></canvas>
<canvas id="fx"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">⬇️</span></button></div>
<script src="common.js?v=9"></script>
<script src="gpu-particles.js?v=3"></script>
<script src="game.js?v=2"></script>
<script>
// ひかりのつみき: ゆれている ブロックを ボタンで おとして つみあげる。はみだした ぶんは きれて おちる。
// ぜんぜん かさならないと ハートが へる。ぴったり だと ひかって すこし ひろがる。
const fg = document.getElementById('fg'), fgx = fg.getContext('2d'), btn = document.getElementById('btn');
const BH = 46;
let dpr = 1, stack = [], mover = null, falling = [], cam = 0, sys = null;

const L = () => ({ W: innerWidth, H: innerHeight, ground: innerHeight - 110 });
const baseW = () => Math.min(innerWidth * 0.5, 340);
const screenY = (level) => L().ground - level * BH + cam;

function reset() {
  stack = [{ x: innerWidth / 2, w: baseW(), hue: 190 }];
  falling = []; cam = 0; newMover();
}
function newMover() {
  const top = stack[stack.length - 1], lv = stack.length;
  mover = { w: top.w, hue: (top.hue + 18) % 360, phase: -Math.PI / 2, speed: Math.min(3.6, 1.3 + lv * 0.08) };
}
const game = Game.create('tsumiki', {
  onStart() { reset(); },
  onOver() { // タワーが くずれて ひかりに なる
    stack.forEach((b, i) => {
      falling.push({ x: b.x, y: screenY(i) - cam, w: b.w, hue: b.hue, vx: rand(-260, 260), vy: -rand(100, 500), rot: 0, vr: rand(-4, 4) });
      setTimeout(() => sparkle(b.x, screenY(i) - BH / 2, b.hue, 30, 1.2), i * 40);
    });
    stack = []; mover = null;
  },
});
const resize = () => { dpr = fitCanvas(fg, fgx); };
resize(); addEventListener('resize', resize);
reset();

function sparkle(x, y, hue, n, spread = 1, star = false) {
  if (!sys) return;
  const list = [];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(80, 420) * spread;
    const c = GPUParticles.hsv(((hue / 360) + rand(-0.05, 0.05) + 1) % 1, 0.6, 1);
    list.push({ x: x + rand(-20, 20), y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, r: c[0], g: c[1], b: c[2], life: rand(0.5, 1.2), size: rand(5, 11), shape: star || Math.random() < 0.25 ? 3 : 0 });
  }
  sys.emit(list);
}

function drop() {
  if (!mover) return;
  const top = stack[stack.length - 1], lv = stack.length;
  const x = mover.x, w = mover.w;
  const left = Math.max(x - w / 2, top.x - top.w / 2), right = Math.min(x + w / 2, top.x + top.w / 2);
  const overlap = right - left;
  const y = screenY(lv) - cam;
  if (overlap <= 4) { // ぜんぜん のってない
    falling.push({ x, y, w, hue: mover.hue, vx: (x - top.x) * 1.5, vy: 0, rot: 0, vr: (x > top.x ? 1 : -1) * rand(2, 4) });
    Sfx.tone(220, 0.3, 'triangle', 0.15, 0, 110);
    if (!game.hit()) newMover();
    return;
  }
  if (Math.abs(x - top.x) < 10) { // ぴったり！
    const nw = Math.min(baseW(), top.w + 8);
    stack.push({ x: top.x, w: nw, hue: mover.hue, flash: 1 });
    sparkle(top.x, screenY(lv) - BH, mover.hue, 50, 1, true);
    Sfx.chime();
    popText('ぴったり！', top.x, screenY(lv) - BH - 40, '#fff', 40);
    game.add(2);
  } else {
    const cx = (left + right) / 2;
    stack.push({ x: cx, w: overlap, hue: mover.hue, flash: 0.6 });
    // はみだした ぶんが きれて おちる
    const cutW = w - overlap, side = x > top.x ? 1 : -1;
    const cutX = side > 0 ? right + cutW / 2 : left - cutW / 2;
    falling.push({ x: cutX, y, w: cutW, hue: mover.hue, vx: side * rand(60, 160), vy: -60, rot: 0, vr: side * rand(1.5, 3.5) });
    sparkle(cutX, y + cam - BH / 2, mover.hue, 16, 0.7);
    Sfx.tone(400 + lv * 20, 0.12, 'square', 0.07);
    Sfx.noise(0.15, 0.4, 1500);
    game.add(1);
  }
  newMover();
}

btn.addEventListener('pointerdown', () => { if (!game.press()) drop(); });
fg.addEventListener('pointerdown', () => { if (!game.press()) drop(); }); // がめんの どこを おしても おとせる

function block(x, yTop, w, hue, flash = 0, alpha = 1) {
  fgx.save();
  fgx.globalAlpha = alpha;
  fgx.shadowColor = `hsla(${hue}, 100%, 65%, ${0.7 + flash * 0.3})`; fgx.shadowBlur = 18 + flash * 30;
  const g = fgx.createLinearGradient(0, yTop, 0, yTop + BH);
  g.addColorStop(0, `hsl(${hue}, 90%, ${72 + flash * 20}%)`); g.addColorStop(1, `hsl(${hue}, 85%, ${48 + flash * 20}%)`);
  fgx.fillStyle = g;
  fgx.beginPath(); fgx.roundRect(x - w / 2, yTop, w, BH - 4, 10); fgx.fill();
  fgx.shadowBlur = 0;
  fgx.fillStyle = 'rgba(255,255,255,.45)'; fgx.beginPath(); fgx.roundRect(x - w / 2 + 6, yTop + 4, Math.max(0, w - 12), 7, 4); fgx.fill();
  fgx.restore();
}

(async () => {
  sys = await GPUParticles.create(document.getElementById('fx'), { count: 20000 });
  sys.params.grav = [0, 400]; sys.params.drag = 0.7;
  let ambient = 0, last = performance.now();
  sys.start((dt, t) => {
    const { W, H, ground } = L();
    // うごく ブロック
    if (mover && game.state === 'play') {
      mover.phase += dt * mover.speed;
      mover.x = W / 2 + Math.sin(mover.phase) * W * 0.34;
    } else if (mover) { mover.phase += dt * 1.2; mover.x = W / 2 + Math.sin(mover.phase) * W * 0.3; }
    // カメラ（たかく なったら うえへ）
    const target = Math.max(0, stack.length * BH - H * 0.42);
    cam += (target - cam) * Math.min(1, dt * 3);
    // はいけいの いろ: たかく なるほど よぞら・うちゅうへ
    const hgt = stack.length;
    document.body.style.setProperty('--h', 230 + hgt * 4);
    document.body.style.setProperty('--l1', Math.max(4, 30 - hgt * 1.2) + '%');
    document.body.style.setProperty('--l2', Math.max(12, 55 - hgt * 1.5) + '%');
    // ふわふわ ひかる つぶ（たかいと ほしに）
    ambient += dt * (6 + hgt * 0.8);
    while (ambient > 1) {
      ambient--;
      const star = Math.random() < Math.min(0.8, hgt / 25);
      const c = GPUParticles.hsv(Math.random(), 0.3, 1);
      sys.emit([{ x: rand(0, W), y: rand(0, H), vx: rand(-10, 10), vy: -rand(5, 30) - 400 * 0, r: c[0] * 0.7, g: c[1] * 0.7, b: c[2] * 0.7, life: rand(2, 4), size: star ? rand(4, 8) : rand(3, 6), shape: star ? 3 : 0 }]);
    }

    fgx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fgx.clearRect(0, 0, W, H);
    // じめん
    const gy = ground + cam;
    if (gy < H + 40) { fgx.fillStyle = 'rgba(255,255,255,.12)'; fgx.fillRect(0, gy, W, H - gy); }
    stack.forEach((b, i) => { b.flash = Math.max(0, (b.flash || 0) - dt * 2); block(b.x, screenY(i + 1), b.w, b.hue, b.flash); });
    if (mover) {
      const yTop = screenY(stack.length + 1) - (game.state === 'play' ? 0 : 0);
      block(mover.x, yTop, mover.w, mover.hue, 0.2 + 0.2 * Math.sin(t * 6));
      // おちる ところの めじるし（うすい せん）
      fgx.strokeStyle = 'rgba(255,255,255,.25)'; fgx.setLineDash([6, 8]); fgx.lineWidth = 2;
      fgx.beginPath(); fgx.moveTo(mover.x - mover.w / 2, yTop + BH); fgx.lineTo(mover.x - mover.w / 2, screenY(stack.length)); fgx.moveTo(mover.x + mover.w / 2, yTop + BH); fgx.lineTo(mover.x + mover.w / 2, screenY(stack.length)); fgx.stroke();
      fgx.setLineDash([]);
    }
    for (const f of falling) {
      f.vy += 1400 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
      fgx.save(); fgx.translate(f.x, f.y + cam - BH / 2); fgx.rotate(f.rot); fgx.translate(-f.x, -(f.y + cam - BH / 2));
      block(f.x, f.y + cam - BH, f.w, f.hue, 0, 0.85);
      fgx.restore();
    }
    falling = falling.filter(f => f.y + cam < H + 200);
    // はじまるまえ: ゆびで あいず
    if (game.state !== 'play') {
      const r = btn.getBoundingClientRect();
      fgx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5);
      drawEmoji(fgx, '👉', r.left - 50 - Math.abs(Math.sin(t * 3)) * 20, r.top + r.height / 2, 60);
      fgx.globalAlpha = 1;
      if (!mover && game.state === 'over' && performance.now() > game.readyAt) { reset(); }
    }
  });
})();
</script>
</body>
</html>
