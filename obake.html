<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>おばけ</title>
<link rel="stylesheet" href="common.css?v=23">
<style>
  body { background: radial-gradient(circle at 50% 30%, #4a3a7a, #1a1230); }
  .big-btn { --c1: #b388ff; --c2: #6a3fc2; }
  .ghost { position: fixed; z-index: 5; font-size: 120px; line-height: 1; cursor: pointer; user-select: none;
           animation: peek .5s cubic-bezier(.3,1.8,.5,1); }
  .ghost span { display: inline-block; animation: float 1.6s ease-in-out infinite alternate; }
  @keyframes peek { from { scale: 0; rotate: -30deg; } }
  @keyframes float { to { translate: 0 -18px; } }
  .ghost.bye { transition: opacity .5s, scale .5s; opacity: 0; scale: 1.6; }
  .moon { position: fixed; right: 8%; top: 10%; font-size: 90px; opacity: .9; pointer-events: none; }
</style>
</head>
<body>
<div class="moon">🌙</div>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🏚️</span></button></div>
<script src="common.js?v=19"></script>
<script>
const GUESTS = [['👻', 'ばあ！'], ['👻', 'ばあ！'], ['👻', 'うらめしや〜'], ['🎃', 'とりっくおあとりーと！'], ['🦇', 'ぱたぱた'], ['🐈‍⬛', 'にゃお'], ['🧙', 'ちちんぷいぷい']];
const btn = document.getElementById('btn');

function spooky() {
  const c = Sfx.ac(), t = c.currentTime;
  const o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(rand(400, 600), t); o.frequency.linearRampToValueAtTime(rand(250, 350), t + 1.2);
  lfo.frequency.value = 6; lg.gain.value = 25; lfo.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.2); g.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
  o.connect(g).connect(Sfx.out()); o.start(t); lfo.start(t); o.stop(t + 1.4); lfo.stop(t + 1.4);
}

btn.addEventListener('pointerdown', () => {
  const [e, word] = pick(GUESTS);
  const g = document.createElement('div');
  g.className = 'ghost';
  g.innerHTML = `<span>${e}</span>`;
  const size = rand(80, 160);
  g.style.fontSize = size + 'px';
  g.style.left = rand(10, innerWidth - size - 10) + 'px';
  g.style.top = rand(60, innerHeight - size - 260) + 'px';
  document.body.appendChild(g);
  spooky();
  speak(word, 0.9, 1.6);
  // さわると にげる
  g.addEventListener('pointerdown', () => {
    g.classList.add('bye');
    Sfx.tone(600, 0.3, 'sine', 0.2, 0, 1600);
    setTimeout(() => g.remove(), 500);
  });
  const ghosts = document.querySelectorAll('.ghost:not(.bye)');
  if (ghosts.length > 12) ghosts[0].remove();
});
</script>
</body>
</html>
