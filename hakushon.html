<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>はっくしょん</title>
<link rel="stylesheet" href="common.css?v=22">
<style>
  body { background: linear-gradient(#fff3c9, #ffd9a8); }
  .big-btn { --c1: #ff9ec2; --c2: #c9608a; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🪶</span></button></div>
<script src="common.js?v=18"></script>
<script>
// はっくしょん: はねで こちょこちょ。むずむずが たまると「はっくしょん！」で まわりの ものが ぜんぶ ふきとぶ。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx);
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); });

const FACES = ['🙂', '😗', '😖', '😣', '🤧'];
const THINGS = ['🎈', '🍃', '🧢', '📄', '🍂', '🌸', '🧸', '🍎', '🐤', '🪁', '🧦', '🍩'];
let itch = 0, need = 0, tickle = 0, sneeze = 0, shake = 0, afterT = 0;
// ---- しかけ: かおを ちょくせつ さわると くすぐったくて くすくす。たまに とくだいの くしゃみで かおが くるくる とんでいく ----
let giggle = 0, spin = 0, sinceBig = 0;
let things = [], drops = [], winds = [];
function resetNeed() { need = Math.floor(rand(6, 11)); }
resetNeed();

const L = () => {
  const W = innerWidth, H = innerHeight;
  const bottom = btn.getBoundingClientRect().top;
  const fs = Math.min(W * 0.55, (bottom - 120) * 0.6, 320);
  return { W, H, fx: W / 2, fy: Math.max(120 + fs / 2, (bottom) * 0.48), fs, bottom };
};
function placeThings() {
  const { W, fx, fy, fs, bottom } = L();
  things = THINGS.map((e, i) => {
    const a = (i / THINGS.length) * Math.PI * 2 + 0.3;
    const rx = Math.min(W * 0.42, fs * 1.05), ry = Math.min((bottom - 80) * 0.42, fs * 0.95);
    const hx = fx + Math.cos(a) * rx, hy = fy + Math.sin(a) * ry;
    return { e, hx, hy, x: hx, y: hy, vx: 0, vy: 0, rot: 0, vr: 0, s: Math.min(60, fs * 0.22), state: 'home', t: 0 };
  });
}
placeThings();
addEventListener('resize', placeThings);

cv.addEventListener('pointerdown', (e) => { // かおを さわる → くすぐったい
  const { fx, fy, fs } = L();
  if (sneeze > 0 || Math.hypot(e.clientX - fx, e.clientY - fy) > fs * 0.5) return;
  giggle = 1;
  [0, 0.12, 0.24].forEach((w, i) => Sfx.tone(700 + i * 90, 0.08, 'triangle', 0.1, w, 900 + i * 90));
  popText(pick(['くすくす', 'うふふ', 'こちょこちょ〜']), e.clientX, fy - fs * 0.6, '#c9608a', 34);
});
btn.addEventListener('pointerdown', () => {
  if (sneeze > 0) return;
  itch++; tickle = 1;
  const { fx, fy, fs } = L();
  if (itch >= need) { // はっくしょん！
    const big = ++sinceBig >= 3 && Math.random() < 0.4; if (big) { sinceBig = 0; spin = 1; }
    sneeze = 1; shake = big ? 2 : 1; afterT = 0;
    itch = 0; resetNeed();
    Sfx.noise(0.9, 1.0, 2200); Sfx.noise(0.5, 0.6, 600, 0.05);
    Sfx.tone(520, 0.3, 'sawtooth', 0.1, 0, 180);
    speak(big ? 'はーっくしょーん！' : 'はっくしょん！', big ? 1.0 : 1.3, 1.5);
    if (big) { Sfx.noise(1.5, 1.0, 300, 0.1); Sfx.tone(80, 1.0, 'sine', 0.4, 0.05, 40); }
    popText('はっくしょん！', innerWidth / 2, fy - fs * 0.75, '#ff4d6d', Math.min(72, innerWidth * 0.12));
    for (const t of things) {
      const a = Math.atan2(t.y - fy, t.x - fx), sp = rand(900, 1500) * (big ? 1.6 : 1);
      t.vx = Math.cos(a) * sp; t.vy = Math.sin(a) * sp - 200; t.vr = rand(-14, 14); t.state = 'fly'; t.t = 0;
    }
    for (let i = 0; i < 60; i++) { const a = rand(-Math.PI, Math.PI), sp = rand(300, 1100); drops.push({ x: fx, y: fy + fs * 0.15, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.4, 0.9) }); }
    for (let i = 0; i < 18; i++) winds.push({ a: (i / 18) * Math.PI * 2, r: fs * 0.4, life: 0.6 });
  } else {
    // は… はっ… と だんだん おおきく
    const k = itch / need;
    Sfx.tone(300 + k * 500, 0.25, 'triangle', 0.08 + k * 0.08, 0, 400 + k * 700);
    Sfx.noise(0.12, 0.25, 4000, 0, 'highpass'); // こしょこしょ
    const word = k < 0.4 ? 'は…' : k < 0.75 ? 'はっ…' : 'はっ…はっ…';
    popText(word, fx + rand(-40, 40), fy - fs * 0.7, '#c9608a', 30 + k * 30);
  }
});

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const { W, H, fx, fy, fs } = L();
  const t = now / 1000;
  tickle = Math.max(0, tickle - dt * 3);
  shake = Math.max(0, shake - dt * 1.5);
  if (sneeze > 0) { sneeze = Math.max(0, sneeze - dt * 0.7); afterT += dt; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(Math.sin(t * 60) * shake * 14, Math.cos(t * 50) * shake * 10);

  // かぜの せん
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineCap = 'round';
  for (const w of winds) {
    w.life -= dt; w.r += 1600 * dt;
    ctx.globalAlpha = Math.max(0, w.life / 0.6); ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(fx, fy, w.r, w.a, w.a + 0.18); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  winds = winds.filter(w => w.life > 0);

  // まわりの もの
  for (const o of things) {
    o.t += dt;
    if (o.state === 'fly') {
      o.x += o.vx * dt; o.y += o.vy * dt; o.vx *= 0.985; o.vy *= 0.985; o.rot += o.vr * dt;
      if (o.t > 1.6) { o.state = 'back'; o.t = 0; o.x = o.hx; o.y = -80; o.rot = rand(-1, 1); }
    } else if (o.state === 'back') { // うえから ふわふわ もどってくる
      const k = Math.min(1, o.t / 1.2);
      o.x = o.hx + Math.sin(o.t * 5) * 30 * (1 - k); o.y = -80 + (o.hy + 80) * (1 - Math.pow(1 - k, 2)); o.rot *= 0.95;
      if (k >= 1) { o.state = 'home'; o.rot = 0; }
    } else {
      o.x = o.hx + Math.sin(t * 1.3 + o.hx) * 4 + tickle * rand(-3, 3); o.y = o.hy + Math.cos(t * 1.1 + o.hy) * 4;
    }
    ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.rot); drawEmoji(ctx, o.e, 0, 0, o.s); ctx.restore();
  }

  // かお
  const k = itch / need;
  let face = FACES[Math.min(FACES.length - 2, Math.floor(k * (FACES.length - 1)))];
  let scale = 1 + k * 0.12, lean = -k * 0.15;
  if (sneeze > 0) { face = afterT < 0.8 ? '🤧' : '😆'; scale = 1.15 - (1 - sneeze) * 0.15; lean = afterT < 0.3 ? 0.25 : 0; }
  else if (itch === 0 && afterT > 0 && afterT < 3) { face = '😆'; afterT += dt; }
  giggle = Math.max(0, giggle - dt * 1.2);
  if (giggle > 0 && sneeze <= 0) face = '🤭';
  const jig = tickle * Math.sin(t * 40) * 0.06 + giggle * Math.sin(t * 30) * 0.08;
  // とくだい くしゃみ: かおが うしろへ くるくる とんで もどる
  let sx = 0, sy = 0, sr = 0;
  if (spin > 0) { spin = Math.max(0, spin - dt * 0.6); const k2 = Math.sin((1 - spin) * Math.PI); sx = -k2 * fs * 0.25; sy = -k2 * fs * 0.6; sr = (1 - spin) * Math.PI * 4; }
  ctx.save(); ctx.translate(fx + sx, fy + sy); ctx.rotate(lean + jig + sr); ctx.scale(scale, scale);
  drawEmoji(ctx, face, 0, 0, fs);
  ctx.restore();

  // はね（こちょこちょ）
  const fxp = fx + fs * 0.42 + Math.sin(t * 25) * 14 * (0.3 + tickle), fyp = fy + fs * 0.12 + Math.cos(t * 19) * 8 * tickle;
  if (sneeze <= 0) {
    ctx.save(); ctx.translate(fxp, fyp); ctx.rotate(-0.9 + Math.sin(t * 25) * 0.25 * (0.3 + tickle));
    drawEmoji(ctx, '🪶', 0, 0, fs * 0.38); ctx.restore();
  }

  // しぶき
  ctx.fillStyle = 'rgba(160,210,255,.85)';
  for (const d of drops) {
    d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 600 * dt; d.life -= dt;
    ctx.beginPath(); ctx.arc(d.x, d.y, 5, 0, 7); ctx.fill();
  }
  drops = drops.filter(d => d.life > 0);
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
