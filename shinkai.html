<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>しんかい</title>
<link rel="stylesheet" href="common.css?v=22">
<style>
  body { background: linear-gradient(#0a2a55, #04122b 45%, #01040d); }
  .rays { position: fixed; inset: 0; pointer-events: none;
          background: repeating-linear-gradient(100deg, rgba(120,200,255,.06) 0 40px, transparent 40px 120px);
          mask-image: linear-gradient(#000, transparent 55%); -webkit-mask-image: linear-gradient(#000, transparent 55%);
          animation: sway 9s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: translateX(-30px) skewX(-4deg); } to { transform: translateX(30px) skewX(4deg); } }
  #fx, #fg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fx { pointer-events: none; }
  #fg { touch-action: none; }
  .big-btn { --c1: #3fa9ff; --c2: #1a5fb3; }
</style>
</head>
<body>
<div class="rays"></div>
<canvas id="fx"></canvas>
<canvas id="fg"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🪼</span></button></div>
<script src="common.js?v=18"></script>
<script src="gpu-particles.js?v=3"></script>
<script>
// しんかい: くらい うみに ひかる クラゲが ただよう。ボタンで みんな ふわっと ひかって およぎ、あたらしい クラゲも うまれる。
// がめんを さわると ひかりの つぶが ひろがって、ちかくの クラゲが にげる。
const fg = document.getElementById('fg'), fgx = fg.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(fg, fgx), sys = null;
addEventListener('resize', () => { dpr = fitCanvas(fg, fgx); });
let jellies = [];
const MAXJ = 10;

function newJelly(x, y) {
  const s = rand(40, 75) * Math.min(1.3, Math.max(0.7, innerWidth / 700));
  jellies.push({ x: x ?? rand(60, innerWidth - 60), y: y ?? innerHeight + 80, vx: rand(-15, 15), vy: -rand(15, 35), s, hue: pick([190, 280, 320, 160, 50, 210]), ph: rand(0, 6), pulse: 0, glow: 0.4, born: 0 });
}
for (let i = 0; i < 5; i++) newJelly(rand(60, innerWidth - 60), rand(innerHeight * 0.2, innerHeight * 0.8));

function sparkle(x, y, n, hue, sp = 200) {
  if (!sys) return;
  const list = [];
  for (let i = 0; i < n; i++) {
    const a = rand(0, 7), v = rand(20, sp), c = GPUParticles.hsv(((hue / 360) + rand(-0.05, 0.05) + 1) % 1, 0.55, 1);
    list.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: c[0], g: c[1], b: c[2], life: rand(1, 2.5), size: rand(3, 8), shape: Math.random() < 0.5 ? 1 : 0 });
  }
  sys.emit(list);
}

btn.addEventListener('pointerdown', () => {
  for (const j of jellies) { j.pulse = 1; j.glow = 1; j.vy -= rand(60, 110); j.vx += rand(-30, 30); sparkle(j.x, j.y, 30, j.hue, 140); }
  if (jellies.length < MAXJ) newJelly();
  // ポワーン
  const base = pick([392, 440, 523.25, 587.33]);
  [1, 1.5, 2].forEach((m, i) => Sfx.tone(base * m, 1.4, 'sine', 0.08, i * 0.05));
});
fg.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY;
  sparkle(x, y, 90, rand(150, 300), 320);
  Sfx.tone(rand(700, 1100), 0.6, 'sine', 0.07, 0, rand(1200, 1600));
  for (const j of jellies) {
    const d = Math.hypot(j.x - x, j.y - y);
    if (d < 220) { const k = (220 - d) / 220; j.vx += (j.x - x) / (d + 1) * 160 * k; j.vy += (j.y - y) / (d + 1) * 160 * k; j.pulse = 1; j.glow = Math.max(j.glow, 0.8); }
  }
});

function drawJelly(j, t) {
  const p = Math.sin(j.ph) * 0.5 + 0.5, squeeze = 1 - j.pulse * 0.25;
  const w = j.s * (1 + p * 0.08) * squeeze, h = j.s * 0.75 * (1 + (1 - squeeze) * 0.4);
  const a = 0.35 + j.glow * 0.5;
  fgx.save(); fgx.translate(j.x, j.y);
  fgx.rotate(Math.max(-0.4, Math.min(0.4, j.vx * 0.006)));
  // しょくしゅ
  fgx.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const ox = (i / 6 - 0.5) * w * 1.4, len = j.s * (1.6 + (i % 2) * 0.6);
    fgx.strokeStyle = `hsla(${j.hue}, 90%, 75%, ${a * 0.55})`; fgx.lineWidth = i % 2 ? 2 : 3;
    fgx.beginPath(); fgx.moveTo(ox, 0);
    for (let k = 1; k <= 10; k++) { const s = k / 10; fgx.lineTo(ox + Math.sin(t * 2.5 + j.ph + s * 4 + i) * 10 * s, s * len); }
    fgx.stroke();
  }
  // かさ
  fgx.globalCompositeOperation = 'lighter';
  const g = fgx.createRadialGradient(0, -h * 0.35, 2, 0, -h * 0.2, w);
  g.addColorStop(0, `hsla(${j.hue}, 100%, 92%, ${a})`); g.addColorStop(0.5, `hsla(${j.hue}, 95%, 65%, ${a * 0.6})`); g.addColorStop(1, `hsla(${j.hue}, 95%, 55%, 0)`);
  fgx.fillStyle = g; fgx.beginPath(); fgx.ellipse(0, 0, w, h, 0, Math.PI, 0); fgx.quadraticCurveTo(0, h * 0.25, -w, 0); fgx.fill();
  // そとの ひかり
  const g2 = fgx.createRadialGradient(0, -h * 0.3, 0, 0, -h * 0.3, w * 2.2);
  g2.addColorStop(0, `hsla(${j.hue}, 100%, 70%, ${0.12 + j.glow * 0.25})`); g2.addColorStop(1, `hsla(${j.hue}, 100%, 60%, 0)`);
  fgx.fillStyle = g2; fgx.beginPath(); fgx.arc(0, -h * 0.3, w * 2.2, 0, 7); fgx.fill();
  fgx.globalCompositeOperation = 'source-over';
  // にっこり（ちいさく）
  fgx.fillStyle = `rgba(255,255,255,${0.5 + j.glow * 0.4})`;
  fgx.beginPath(); fgx.arc(-w * 0.25, -h * 0.4, w * 0.06, 0, 7); fgx.arc(w * 0.25, -h * 0.4, w * 0.06, 0, 7); fgx.fill();
  fgx.restore();
}

(async () => {
  sys = await GPUParticles.create(document.getElementById('fx'), { count: 40000 });
  sys.params.grav = [0, -6]; sys.params.drag = 0.9; sys.params.turb = 14;
  let snow = 0;
  sys.start((dt, t) => {
    const W = innerWidth, H = innerHeight;
    // マリンスノー（ゆっくり しずむ ひかりの つぶ）
    snow += dt * 25;
    const list = [];
    while (snow > 1) { snow--; const c = GPUParticles.hsv(rand(0.5, 0.6), 0.25, 0.8); list.push({ x: rand(0, W), y: rand(-10, H), vx: rand(-5, 5), vy: rand(5, 20), r: c[0] * 0.5, g: c[1] * 0.5, b: c[2] * 0.5, life: rand(3, 6), size: rand(2, 4), shape: 1 }); }
    // クラゲ
    for (const j of jellies) {
      j.ph += dt * (2 + j.pulse * 6); j.pulse = Math.max(0, j.pulse - dt * 1.5); j.glow = Math.max(0.35, j.glow - dt * 0.5);
      j.vy += (-25 - j.vy) * dt * 0.6 + Math.sin(j.ph) * 8 * dt; j.vx *= Math.pow(0.6, dt);
      j.x += j.vx * dt; j.y += j.vy * dt;
      if (j.x < 30) j.vx += 60 * dt; if (j.x > W - 30) j.vx -= 60 * dt;
      if (j.y < -j.s * 3) { j.y = H + j.s * 2; j.x = rand(60, W - 60); }
      // しょくしゅの さきから ひかりが こぼれる
      if (Math.random() < dt * (6 + j.glow * 14)) { const c = GPUParticles.hsv(j.hue / 360, 0.6, 1); list.push({ x: j.x + rand(-j.s * 0.6, j.s * 0.6), y: j.y + j.s * rand(0.8, 2), vx: rand(-8, 8), vy: rand(10, 30), r: c[0], g: c[1], b: c[2], life: rand(1, 2), size: rand(3, 6), shape: 1 }); }
    }
    sys.emit(list);
    fgx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fgx.clearRect(0, 0, W, H);
    for (const j of jellies) drawJelly(j, t);
  });
})();
</script>
</body>
</html>
