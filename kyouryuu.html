<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>きょうりゅう</title>
<link rel="stylesheet" href="common.css?v=7">
<style>
  body { background: linear-gradient(#ffd59e, #ffb36b 55%, #8c6a3f 55%); }
  .big-btn { --c1: #4caf50; --c2: #2e7031; }
  .bottom-center { bottom: auto; top: 18px; }
  .bottom-center .big-btn { width: min(28vw, 140px); height: min(28vw, 140px); }
  #world { position: fixed; inset: 0; pointer-events: none; }
  #dino { position: fixed; bottom: 30%; font-size: min(45vw, 260px); line-height: 1; transition: left .35s ease-out; }
  #dino span { display: inline-block; }
  .foot { position: fixed; font-size: 40px; opacity: .5; pointer-events: none; transition: opacity 3s; }
  #volcano { position: fixed; right: 5%; bottom: 44%; font-size: min(30vw, 160px); opacity: .9; }
</style>
</head>
<body>
<div id="world"><div id="volcano">🌋</div><div id="dino"><span>🦖</span></div></div>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🦶</span></button></div>
<script src="common.js?v=7"></script>
<script>
const btn = document.getElementById('btn'), dino = document.getElementById('dino'), world = document.getElementById('world');
const face = dino.querySelector('span');
if (Math.random() < 0.4) face.textContent = '🦕';
let x = 0.1, dir = 1, steps = 0;

function place() {
  dino.style.left = `calc(${x * 100}vw - ${dino.offsetWidth / 2}px)`;
  face.style.transform = dir > 0 ? 'scaleX(-1)' : 'scaleX(1)'; // えもじは ひだりむき
}
function roar() {
  const c = Sfx.ac(), t = c.currentTime;
  const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = 'sawtooth'; o2.type = 'square';
  o.frequency.setValueAtTime(140, t); o.frequency.linearRampToValueAtTime(220, t + 0.3); o.frequency.linearRampToValueAtTime(90, t + 1.3);
  o2.frequency.setValueAtTime(70, t); o2.frequency.linearRampToValueAtTime(45, t + 1.3);
  f.type = 'lowpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.1); g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
  o.connect(f); o2.connect(f); f.connect(g).connect(Sfx.out());
  o.start(t); o2.start(t); o.stop(t + 1.5); o2.stop(t + 1.5);
  Sfx.noise(1.3, 0.3, 700);
}

btn.addEventListener('pointerdown', () => {
  steps++;
  x += dir * 0.12;
  if (x > 0.88) { x = 0.88; dir = -1; }
  if (x < 0.12) { x = 0.12; dir = 1; }
  place();
  // ずしん
  face.animate([{ translate: '0 0' }, { translate: '0 -40px' }, { translate: '0 0' }], { duration: 350, easing: 'ease-in' });
  setTimeout(() => {
    world.animate([{ translate: '0 0' }, { translate: '0 12px' }, { translate: '0 -6px' }, { translate: '0 0' }], { duration: 250 });
    Sfx.tone(70, 0.4, 'sine', 0.7, 0, 35);
    Sfx.noise(0.25, 0.6, 250);
    const f = document.createElement('div');
    f.className = 'foot'; f.textContent = '🐾';
    const r = dino.getBoundingClientRect();
    f.style.left = (r.left + r.width / 2 - 20) + 'px'; f.style.top = (r.bottom - 10) + 'px';
    document.body.appendChild(f);
    requestAnimationFrame(() => { f.style.opacity = 0; });
    setTimeout(() => f.remove(), 3100);
  }, 300);
  if (steps % 5 === 0 || Math.random() < 0.15) setTimeout(() => {
    roar();
    face.animate([{ scale: 1 }, { scale: 1.25 }, { scale: 1 }], { duration: 1200, easing: 'ease-out' });
    popText('がおー！', innerWidth / 2, innerHeight * 0.3, '#fff', 80);
  }, 450);
});
addEventListener('resize', place);
place();
</script>
</body>
</html>
