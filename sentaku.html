<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>せんたく</title>
<link rel="stylesheet" href="common.css?v=22">
<style>
  body { background: linear-gradient(#bfe6ff, #fff8e8 45%); }
  #cv { touch-action: none; }
  .big-btn { --c1: #4fc3f7; --c2: #1e88c7; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🧺</span></button></div>
<script src="common.js?v=18"></script>
<script>
// せんたく: ボタンで どろんこの ふくが せんたくきに ぽいっ。ぐるぐる まわって きれいに なったら、ものほしに ほす。
// ほした ふくを さわると ぱたぱた。まわっている せんたくきを さわると あわが あふれる。ときどき くつしたが とんでいって、🐱 が もってくる。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx), W = innerWidth, H = innerHeight;
const CLOTHES = ['👕', '👖', '🧦', '👗', '🧢', '🩳', '🧣', '👚'];
let M, lineY, slots, flying = [], drum = [], spinT = 0, shakeT = 0, hang = [], foam = [], cat = null, wind = 0;

function layout() {
  const m = Math.min(W * 0.48, 230, H * 0.32);
  M = { x: W > 600 ? W / 2 : W * 0.42, y: H - 40 - m * 0.65, s: m };
  lineY = Math.max(110, Math.min(H * 0.22, M.y - m * 1.2));
  slots = Math.max(3, Math.floor((W - 60) / 72));
}
layout();
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); W = innerWidth; H = innerHeight; layout(); });
const slotX = (i) => 30 + (W - 60) * (i + 0.5) / slots;
const door = () => ({ x: M.x, y: M.y + M.s * 0.08, r: M.s * 0.3 });

btn.addEventListener('pointerdown', () => {
  if (drum.length + flying.filter(f => f.to === 'drum').length >= 4) { shakeT = 0.3; return; }
  const e = pick(CLOTHES);
  flying.push({ e, to: 'drum', x: 30, y: M.y + M.s * 0.3, sx: 30, sy: M.y + M.s * 0.3, t: 0, dirty: true });
  Sfx.tone(500, 0.12, 'sine', 0.1, 0, 800);
});
cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY, d = door();
  if (Math.hypot(x - M.x, y - M.y) < M.s * 0.6) {
    if (spinT > 0) { shakeT = 0.8; for (let i = 0; i < 30; i++) foam.push({ x: d.x + rand(-d.r, d.r), y: d.y + rand(-d.r, d.r), vx: rand(-120, 120), vy: rand(-200, -40), r: rand(6, 16), life: 2 }); Sfx.noise(0.4, 0.15, 3000, 0, 'bandpass'); popText('あわあわ', d.x, d.y - M.s * 0.7, '#1e88c7', 36); }
    else { Sfx.tone(300, 0.08, 'triangle', 0.08); shakeT = 0.2; }
    return;
  }
  for (const h of hang) if (Math.abs(h.x - x) < 36 && y > lineY - 10 && y < lineY + 80) { h.flap = 1.2; Sfx.noise(0.25, 0.1, 2000, 0, 'bandpass'); }
});

function hangOne(e) {
  const used = new Set(hang.map(h => h.slot)); let slot = -1;
  for (let i = 0; i < slots; i++) if (!used.has(i)) { slot = i; break; }
  if (slot < 0) { const old = hang.shift(); flying.push({ e: old.e, to: 'away', x: old.x, y: lineY + 30, t: 0 }); slot = old.slot; }
  flying.push({ e, to: 'line', slot, x: door().x, y: door().y, sx: door().x, sy: door().y, t: 0 });
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
  shakeT = Math.max(0, shakeT - dt); wind = Math.max(0, wind - dt);
  for (const f of flying) {
    f.t += dt;
    if (f.to === 'drum') { const u = Math.min(1, f.t / 0.6), d = door(); f.x = f.sx + (d.x - f.sx) * u; f.y = f.sy + (d.y - f.sy) * u - Math.sin(u * Math.PI) * 120; if (u >= 1) { f.done = true; drum.push({ e: f.e, a: rand(0, 6) }); spinT = Math.max(spinT, 3); Sfx.noise(0.2, 0.15, 900); } }
    else if (f.to === 'line') { const u = Math.min(1, f.t / 0.7), tx = slotX(f.slot), ty = lineY + 26; f.x = f.sx + (tx - f.sx) * u; f.y = f.sy + (ty - f.sy) * u - Math.sin(u * Math.PI) * 80; if (u >= 1) { f.done = true; const h = { e: f.e, slot: f.slot, x: tx, flap: 0.6, ph: rand(0, 6) }; hang.push(h); Sfx.tone(900, 0.06, 'square', 0.05); maybeBlow(h); } }
    else if (f.to === 'away') { f.x += 260 * dt; f.y -= 60 * dt + Math.sin(f.t * 6) * 3; if (f.x > W + 60) f.done = true; }
    else if (f.to === 'sock') { f.x += 220 * dt; f.y += Math.sin(f.t * 5) * 80 * dt - 30 * dt; if (f.x > W + 60) { f.done = true; setTimeout(() => { cat = { x: W + 60, e: f.e, slot: f.slot, st: 'in', t: 0 }; }, 2500); } }
  }
  flying = flying.filter(f => !f.done);
  // せんたくき
  if (spinT > 0) {
    spinT -= dt;
    for (const c of drum) c.a += dt * 9;
    if (Math.random() < dt * 8) Sfx.noise(0.12, 0.04, 600);
    if (spinT <= 0) { // できあがり
      drum.forEach((c, i) => setTimeout(() => hangOne(c.e), i * 350)); drum = [];
      Sfx.chime(); popText('きれい！', door().x, door().y - M.s * 0.8, '#1e88c7', 40);
    }
  }
  for (const f of foam) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 300 * dt; if (f.y > H - 30) { f.y = H - 30; f.vy = 0; f.vx *= 0.9; } f.life -= dt * 0.5; }
  foam = foam.filter(f => f.life > 0);
  for (const h of hang) h.flap = Math.max(0, h.flap - dt);
  // ねこ
  if (cat) {
    cat.t += dt;
    const tx = slotX(cat.slot);
    if (cat.st === 'in') { cat.x -= 140 * dt; if (cat.x <= tx) { cat.st = 'give'; cat.t = 0; Sfx.tone(700, 0.25, 'sine', 0.12, 0, 950); popText('にゃ', tx, H - 150, '#ff7ab8', 34); } }
    else if (cat.st === 'give' && cat.t > 0.8) {
      if (hang.some(h => h.slot === cat.slot)) hangOne(cat.e);
      else flying.push({ e: cat.e, to: 'line', slot: cat.slot, x: cat.x, y: H - 90, sx: cat.x, sy: H - 90, t: 0 });
      cat.st = 'out'; Sfx.chime();
    }
    else if (cat.st === 'out') { cat.x += 160 * dt; if (cat.x > W + 60) cat = null; }
  }
  draw(t);
  requestAnimationFrame(loop);
}
function maybeBlow(h) {
  if (cat || Math.random() > 0.25 || hang.length < 2) return;
  setTimeout(() => {
    const i = hang.indexOf(h); if (i < 0) return;
    hang.splice(i, 1); wind = 1.2; flying.push({ e: h.e, to: 'sock', slot: h.slot, x: h.x, y: lineY + 26, t: 0 });
    Sfx.noise(0.8, 0.15, 900, 0, 'bandpass'); popText('あっ', h.x, lineY - 20, '#555', 36);
  }, 1500);
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#e8d3b0'; ctx.fillRect(0, H - 40, W, 40);
  // ものほし
  ctx.fillStyle = '#8a5a34'; ctx.fillRect(12, lineY - 10, 8, H - lineY - 30); ctx.fillRect(W - 20, lineY - 10, 8, H - lineY - 30);
  ctx.strokeStyle = '#666'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(16, lineY); ctx.quadraticCurveTo(W / 2, lineY + 14, W - 16, lineY); ctx.stroke();
  for (const h of hang) {
    const sw = Math.sin(t * 3 + h.ph) * 0.08 + Math.sin(t * 18) * h.flap * 0.4 + wind * 0.5;
    ctx.save(); ctx.translate(h.x, lineY + 4); ctx.rotate(sw); drawEmoji(ctx, h.e, 0, 26, 50); ctx.restore();
    ctx.fillStyle = '#ff7ab8'; ctx.fillRect(h.x - 3, lineY - 6, 6, 12);
  }
  // かご
  drawEmoji(ctx, '🧺', 34, M.y + M.s * 0.3, 52);
  // せんたくき
  const sx = Math.sin(t * 50) * (shakeT + (spinT > 0 ? 0.25 : 0)) * 5;
  ctx.save(); ctx.translate(sx, 0);
  const s = M.s, d = door();
  ctx.fillStyle = '#f4f7fb'; ctx.beginPath(); ctx.roundRect(M.x - s / 2, M.y - s * 0.6, s, s * 1.2, 18); ctx.fill();
  ctx.strokeStyle = '#c9d3df'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#dfe7f0'; ctx.fillRect(M.x - s / 2 + 10, M.y - s * 0.55, s - 20, s * 0.16);
  ctx.fillStyle = spinT > 0 ? '#2bb24c' : '#aaa'; ctx.beginPath(); ctx.arc(M.x + s * 0.32, M.y - s * 0.47, 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#9fb3c8'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r + 10, 0, 7); ctx.fill();
  ctx.fillStyle = spinT > 0 ? '#7fc8f5' : '#cfe9fb'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.clip();
  drum.forEach((c, i) => { const a = c.a + i * 1.6; drawEmoji(ctx, c.e, d.x + Math.cos(a) * d.r * 0.45, d.y + Math.sin(a) * d.r * 0.45, d.r * 0.7); });
  if (spinT > 0) for (let i = 0; i < 8; i++) { const a = t * 6 + i; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(d.x + Math.cos(a) * d.r * 0.7, d.y + Math.sin(a * 1.3) * d.r * 0.7, 6, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(d.x - d.r * 0.35, d.y - d.r * 0.4, d.r * 0.3, d.r * 0.15, -0.6, 0, 7); ctx.fill();
  ctx.restore(); ctx.restore();
  for (const f of foam) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, f.life)})`; ctx.strokeStyle = 'rgba(150,200,240,.6)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); ctx.stroke(); }
  for (const f of flying) {
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.to === 'away' || f.to === 'sock' ? f.t * 4 : 0);
    drawEmoji(ctx, f.e, 0, 0, 46);
    if (f.dirty) { ctx.fillStyle = 'rgba(110,70,30,.75)'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(Math.cos(i * 2) * 12, Math.sin(i * 3) * 10, 5, 0, 7); ctx.fill(); } }
    ctx.restore();
  }
  if (cat) { ctx.save(); ctx.translate(cat.x, H - 70 + Math.abs(Math.sin(cat.t * 8)) * -5); if (cat.st === 'out') ctx.scale(-1, 1); drawEmoji(ctx, '🐈', 0, 0, 60); ctx.restore(); if (cat.st !== 'out') drawEmoji(ctx, cat.e, cat.x - 26, H - 80, 30); }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
