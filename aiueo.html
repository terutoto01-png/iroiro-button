<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>あいうえお</title>
<link rel="stylesheet" href="common.css?v=23">
<style>
  body { background: linear-gradient(#fff6d8, #ffe3ec); }
  .stage { position: fixed; left: 50%; top: 47%; transform: translate(-50%, -50%); z-index: 10; }
  @media (orientation: landscape) { .stage { top: 51%; } }
  #btn { --c1: #ffffff; --c2: #f2a7c0; width: min(44vw, 38vh, 240px); height: min(44vw, 38vh, 240px); }
  #btn .emoji { font-size: min(20vw, 18vh, 112px); transition: transform .25s cubic-bezier(.3, 1.8, .5, 1); }
  #btn .emoji.out { transform: scale(0); transition: transform .12s; }
  #ov { z-index: 20; pointer-events: none; }
  #hero {
    position: fixed; left: 0; top: 0; z-index: 25;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 0; border: none; background: none; cursor: pointer; font-family: inherit;
    transform-origin: center center; will-change: transform, opacity;
  }
  #hero .orb {
    width: var(--hr, 128px); height: var(--hr, 128px); border-radius: 50%;
    background: #fff; border: 5px solid #ff8fb3;
    box-shadow: 0 8px 0 rgba(242, 140, 178, .45), 0 14px 28px rgba(0, 0, 0, .18), 0 0 36px rgba(255, 215, 110, .75);
    display: flex; align-items: center; justify-content: center;
  }
  #hero.special .orb {
    border-color: #ffb830;
    box-shadow: 0 8px 0 rgba(255, 160, 60, .45), 0 14px 32px rgba(255, 110, 170, .3), 0 0 48px rgba(255, 220, 90, .95);
  }
  #hero .em { font-size: calc(var(--hr, 128px) * 0.64); line-height: 1; pointer-events: none; }
  #hero .lbl {
    margin-top: -14px; padding: 4px 18px; border-radius: 999px;
    background: #ff6b9a; color: #fff; border: 3px solid #fff;
    font-size: max(18px, calc(var(--hr, 128px) * 0.22)); font-weight: bold;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .16); white-space: nowrap; pointer-events: none;
  }
  #hero.special .lbl { background: linear-gradient(90deg, #ff6b9a, #ff9f43, #ff6b9a); }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="stage"><button id="btn" class="big-btn"><span class="emoji" id="pic">🍎</span></button></div>
<canvas id="ov" class="full"></canvas>
<button id="hero" type="button" aria-label="うまれたことば"><span class="orb"><span class="em" id="heroEm"></span></span><span class="lbl" id="heroLbl"></span></button>
<script src="common.js?v=19"></script>
<script>
// あいうえお: えの ボタンを おすと その ことばの ひらがなが ぽん ぽん と とびだして よみあげる。
// とびだした もじは したに つもる。さわると その もじを よんで はねる。ゆびで はじいて なげられる。
// おちた もじを ひろって うえの わくに はめると、ことばが うまれて えもじが でてくる。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const ov = document.getElementById('ov'), octx = ov.getContext('2d');
const btn = document.getElementById('btn'), pic = document.getElementById('pic');
const heroEl = document.getElementById('hero'), heroEm = document.getElementById('heroEm'), heroLbl = document.getElementById('heroLbl');

// ちいさい「ゃ」「っ」や「ー」の ない ことば だけ（1もじずつ よんでも おなじ おとに なる）
const WORDS = [
  ['🍎', 'りんご'], ['🍓', 'いちご'], ['🍌', 'ばなな'], ['🍊', 'みかん'], ['🍇', 'ぶどう'], ['🍉', 'すいか'], ['🍑', 'もも'],
  ['🍒', 'さくらんぼ'], ['🍙', 'おにぎり'], ['🍞', 'ぱん'], ['🥚', 'たまご'], ['🍬', 'あめ'],
  ['🐶', 'いぬ'], ['🐱', 'ねこ'], ['🐰', 'うさぎ'], ['🐘', 'ぞう'], ['🦒', 'きりん'], ['🐵', 'さる'], ['🐼', 'ぱんだ'],
  ['🐸', 'かえる'], ['🐷', 'ぶた'], ['🐮', 'うし'], ['🐴', 'うま'], ['🐔', 'にわとり'], ['🐤', 'ひよこ'], ['🐧', 'ぺんぎん'],
  ['🐻', 'くま'], ['🦁', 'らいおん'], ['🐯', 'とら'], ['🐟', 'さかな'], ['🐙', 'たこ'], ['🦀', 'かに'], ['🐬', 'いるか'],
  ['🐳', 'くじら'], ['🐢', 'かめ'], ['🐜', 'あり'], ['🐝', 'はち'], ['🐞', 'てんとうむし'],
  ['🚗', 'くるま'], ['🚌', 'ばす'], ['🚢', 'ふね'], ['✈️', 'ひこうき'],
  ['⭐', 'ほし'], ['🌙', 'つき'], ['☀️', 'たいよう'], ['🌈', 'にじ'], ['🌸', 'はな'], ['🌳', 'き'], ['⛄', 'ゆきだるま'],
  ['☂️', 'かさ'], ['👟', 'くつ'], ['👒', 'ぼうし'], ['👓', 'めがね'], ['📖', 'ほん'], ['🔑', 'かぎ'], ['🥁', 'たいこ'],
  ['🎈', 'ふうせん'], ['👻', 'おばけ'], ['🍦', 'あいす'], ['🦷', 'は'], ['👀', 'め'], ['👂', 'みみ'],
].filter(w => !/[ゃゅょっー]/.test(w[1]));

const SPECIAL = ['🧒', 'かずき'];

// おちた もじを くみあわせて つくれる おまけの ことば（すべて fonts/iroemoji.woff2 の えもじ）
const EXTRA_WORDS = [
  ['🌊', 'うみ'], ['🌊', 'なみ'], ['🏠', 'いえ'], ['🏠', 'おうち'], ['🐦', 'とり'], ['🐿️', 'りす'],
  ['🐊', 'わに'], ['🦈', 'さめ'], ['🦑', 'いか'], ['🐚', 'かい'], ['🦆', 'あひる'], ['🐑', 'ひつじ'],
  ['🦊', 'きつね'], ['🐭', 'ねずみ'], ['🐨', 'こあら'], ['🦇', 'こうもり'], ['🐌', 'かたつむり'],
  ['🦔', 'はりねずみ'], ['🦩', 'ふらみんご'], ['🪲', 'むし'], ['🪶', 'はね'], ['🪰', 'はえ'],
  ['🍅', 'とまと'], ['🍖', 'にく'], ['🍡', 'だんご'], ['🥔', 'いも'], ['🥕', 'にんじん'], ['🧅', 'たまねぎ'],
  ['🫘', 'まめ'], ['🌾', 'こめ'], ['🌾', 'いね'], ['🍯', 'はちみつ'], ['🧊', 'こおり'], ['🦪', 'かき'],
  ['🌻', 'ひまわり'], ['🌹', 'ばら'], ['🌵', 'さぼてん'], ['🌲', 'もり'], ['🍂', 'おちば'], ['🪷', 'はす'], ['🪸', 'さんご'],
  ['💧', 'みず'], ['❄️', 'ゆき'], ['⚡', 'かみなり'], ['🌀', 'うず'], ['💦', 'あせ'], ['🫧', 'あわ'],
  ['🦶', 'あし'], ['🐾', 'あしあと'], ['🦴', 'ほね'],
  ['👑', 'おうかん'], ['👕', 'ふく'], ['🧦', 'くつした'], ['🎀', 'りぼん'], ['🎁', 'はこ'],
  ['🔔', 'すず'], ['💎', 'ほうせき'], ['🪣', 'ばけつ'], ['🪨', 'いし'], ['🎯', 'まと'], ['🎣', 'つり'],
  ['🗺️', 'ちず'], ['💊', 'くすり'], ['🧻', 'かみ'], ['🪙', 'おかね'], ['🪥', 'はぶらし'], ['🧩', 'ぱずる'],
  ['🪄', 'つえ'], ['🪐', 'どせい'], ['🦠', 'ばいきん'], ['🚦', 'しんごう'], ['🐉', 'たつ'],
  ['😴', 'ねむい'], ['🎉', 'おいわい'],
].filter(w => !/[ゃゅょっー]/.test(w[1]));

// ことば じしょ（2もじ いじょうで じどう ひょうじ）
const DICT = new Map();
for (const [emoji, word] of EXTRA_WORDS) DICT.set(word, { emoji, word, special: false });
for (const [emoji, word] of WORDS) DICT.set(word, { emoji, word, special: false });
DICT.set(SPECIAL[1], { emoji: SPECIAL[0], word: SPECIAL[1], special: true });

// もっと ながい ことばの あたまに なる ことば（れい:「ぱん」→「ぱんだ」）は すこし まってから はっどう
const PREFIXES = new Set();
for (const w of DICT.keys()) {
  const cs = [...w];
  for (let len = 2; len < cs.length; len++) PREFIXES.add(cs.slice(0, len).join(''));
}

let deck = [], cur = null, sinceSp = 0;
function nextWord() {
  if (!deck.length) { deck = WORDS.slice(); for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; } if (cur && deck[deck.length - 1] === cur) deck.unshift(deck.pop()); }
  // ときどき とくべつな ことば（3こ いじょう あいだを あける）
  sinceSp++;
  if (sinceSp > 3 && Math.random() < 0.16) { cur = SPECIAL; sinceSp = 0; }
  else cur = deck.pop();
  pic.textContent = cur[0];
}
nextWord();

// ---- もじの つぶ & うえの わく（スロット） ----
const HUES = [0, 30, 50, 130, 190, 220, 270, 320];
const SLOT_COUNT = 5;
const slots = new Array(SLOT_COUNT).fill(null);
let W = 0, H = 0, R = 40, SAB = 0, SAT = 0, letters = [], sparks = [];
let tray = { x: 0, y: 0, w: 0, h: 0, bottom: 0, r: 30, gap: 8, pts: [], clear: null };

function updateTray() {
  const wide = W >= 540;
  const maxW = wide ? Math.min(W - 168, 520) : W - 20;
  const padX = wide ? 18 : 10, padY = wide ? 10 : 8;
  const gap = wide ? Math.min(12, Math.max(6, Math.round(R * 0.22))) : 6;
  const sr = Math.min(R, Math.floor((maxW - padX * 2 - gap * (SLOT_COUNT - 1)) / (SLOT_COUNT * 2)));
  const tw = padX * 2 + SLOT_COUNT * sr * 2 + (SLOT_COUNT - 1) * gap;
  const th = sr * 2 + padY * 2;
  const tx = (W - tw) / 2;
  const ty = wide ? Math.max(10, SAT + 10) : Math.max(68, SAT + 68);
  const pts = [];
  for (let i = 0; i < SLOT_COUNT; i++) {
    pts.push({ x: tx + padX + sr + i * (sr * 2 + gap), y: ty + padY + sr });
  }
  const cr = Math.max(15, Math.min(20, Math.round(sr * 0.48)));
  const clear = wide
    ? { x: tx + tw + cr + 10, y: ty + th / 2, r: cr }
    : { x: Math.min(W - cr - 8, tx + tw - cr * 0.4), y: ty + th + cr * 0.55, r: cr };
  tray = { x: tx, y: ty, w: tw, h: th, bottom: ty + th, r: sr, gap, pts, clear };
}

function resize() {
  fitCanvas(cv, ctx); fitCanvas(ov, octx); W = innerWidth; H = innerHeight;
  R = Math.max(30, Math.min(48, Math.min(W, H) * 0.068));
  const cs = getComputedStyle(document.documentElement);
  SAB = parseFloat(cs.getPropertyValue('--sab')) || 0;
  SAT = parseFloat(cs.getPropertyValue('--sat')) || 0;
  updateTray();
}
addEventListener('resize', resize); resize();
const FONT = () => `bold ${Math.round(R * 1.15)}px "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", sans-serif`;

function btnCircle() {
  const r = btn.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 + 6, r: r.width / 2 + 4 };
}

function addLetter(ch, hue, x, y, vx, vy) {
  const L = { ch, hue, x, y, vx, vy, a: (Math.random() - 0.5) * 0.6, va: (Math.random() - 0.5) * 8, sq: 0, glow: 0, born: performance.now(), dead: 0, grab: null, slot: null, celebrate: null };
  letters.push(L);
  // おおすぎたら ふるい もじから ぱちんと きえる（わくに はまっている もじは けさない）
  const MAX = Math.floor(W * H / (R * R * 9));
  const alive = letters.filter(l => !l.dead && l.slot === null);
  if (alive.length > MAX) for (const l of alive.slice(0, alive.length - MAX)) if (!l.grab && !l.show) { l.dead = performance.now(); spark(l.x, l.y, l.hue, 6); }
  return L;
}

function spark(x, y, hue, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 260;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, t: 0, life: 0.5 + Math.random() * 0.4, hue: hue + (Math.random() - 0.5) * 40, r: 4 + Math.random() * 5 });
  }
}

// ---- おと ----
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
function popSound(i) { const f = PENTA[Math.min(i, PENTA.length - 1)]; Sfx.tone(f, 0.16, 'sine', 0.3, 0, f * 1.5); Sfx.tone(f * 2, 0.08, 'triangle', 0.06); }
function snapSound(i) { const f = PENTA[Math.min(i + 1, PENTA.length - 1)]; Sfx.tone(f, 0.14, 'triangle', 0.28, 0, f * 1.25); Sfx.tone(f * 1.5, 0.09, 'sine', 0.12); }

// ---- わくで ことばを つくる → えもじが うまれる！ ----
let pendingMatch = null; // { entry, idxs, triggerAt, key }
let hero = null;         // { emoji, word, special, x, y, t0, fadeAt, bounceAt }
let lastSlotIdx = 0;

function findSlotMatch() {
  let best = null;
  for (let start = 0; start < SLOT_COUNT; start++) {
    if (!slots[start] || slots[start].celebrate) continue;
    let str = '';
    for (let end = start; end < SLOT_COUNT; end++) {
      const l = slots[end];
      if (!l || l.celebrate) break;
      str += l.ch;
      if (end - start + 1 < 2) continue;
      const entry = DICT.get(str);
      if (!entry) continue;
      const len = end - start + 1;
      const hasRecent = lastSlotIdx >= start && lastSlotIdx <= end;
      if (!best || len > best.len || (len === best.len && hasRecent && !best.hasRecent)) {
        const idxs = [];
        for (let k = start; k <= end; k++) idxs.push(k);
        const canExtend = end + 1 < SLOT_COUNT && !slots[end + 1];
        best = { entry, idxs, len, hasRecent, waitPrefix: canExtend && PREFIXES.has(str), key: idxs.join(',') + ':' + str };
      }
    }
  }
  return best;
}

function scheduleSlotCheck(now = performance.now()) {
  const m = findSlotMatch();
  if (!m) { pendingMatch = null; return; }
  if (pendingMatch && pendingMatch.key === m.key) return;
  const delay = m.waitPrefix ? 850 : 280;
  pendingMatch = { ...m, triggerAt: now + delay };
}

function celebrateWord(m, now) {
  pendingMatch = null;
  const { entry, idxs } = m;
  const matched = idxs.map(i => slots[i]).filter(Boolean);
  if (matched.length !== idxs.length) return;
  // ボタンの ことばが ならんでいたら さきに おとす
  if (group && !group.dropped) dropGroup(group, now, 30);

  const dur = entry.special ? 2200 : 1550;
  matched.forEach((l, order) => {
    l.celebrate = { t0: now, order, n: matched.length, dropAt: now + dur + order * 65, special: entry.special };
    l.glow = 1; l.sq = 0.6;
    spark(l.x, l.y, l.hue, 12);
  });

  // うまれた えもじを わくの すぐ したに おおきく だす
  const cxRaw = (tray.pts[idxs[0]].x + tray.pts[idxs[idxs.length - 1]].x) / 2;
  const bc = btnCircle();
  const heroR = Math.max(46, Math.min(72, R * 1.45));
  const cx = Math.max(heroR + 18, Math.min(W - heroR - 18, cxRaw));
  const gapMid = (tray.bottom + (bc.y - bc.r)) / 2;
  const cy = Math.max(tray.bottom + heroR + 12, Math.min(bc.y - bc.r * 0.35, gapMid));

  hero = {
    emoji: entry.emoji, word: entry.word, special: entry.special,
    x: cx, y: cy, r: heroR, t0: now, bounceAt: now, fadeAt: now + (entry.special ? 4600 : 3600),
  };
  heroEm.textContent = entry.emoji;
  heroLbl.textContent = entry.word;
  heroEl.classList.toggle('special', !!entry.special);
  heroEl.style.setProperty('--hr', Math.round(heroR * 2) + 'px');
  heroEl.style.display = 'flex';

  speak(entry.word + '！', 0.85, entry.special ? 1.38 : 1.28);
  Sfx.chime();
  if (entry.special) {
    Sfx.yay();
    setTimeout(() => { if (hero && hero.word === entry.word) { speak(entry.word + '！', 0.95, 1.42); Sfx.yay(); } }, 650);
    for (let k = 0; k < 75; k++) sparks.push({ x: Math.random() * W, y: -10 - Math.random() * 80, vx: (Math.random() - 0.5) * 140, vy: 70 + Math.random() * 210, t: 0, life: 1.6 + Math.random() * 0.9, hue: Math.random() * 360, r: 5 + Math.random() * 6 });
  } else {
    setTimeout(() => Sfx.yay(), 180);
    for (let k = 0; k < 28; k++) {
      const a = Math.random() * Math.PI * 2, s = 140 + Math.random() * 260;
      sparks.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 90, t: 0, life: 0.7 + Math.random() * 0.5, hue: Math.random() * 360, r: 5 + Math.random() * 5 });
    }
  }
}

function updSlots(now) {
  if (pendingMatch) {
    // ゆびで つぎの もじを もっている あいだは まつ（ぱん→ぱんだ などを じゃましない）
    if (pendingMatch.waitPrefix && grabs.size > 0) pendingMatch.triggerAt = Math.max(pendingMatch.triggerAt, now + 500);
    else if (now >= pendingMatch.triggerAt) celebrateWord(pendingMatch, now);
  }
  for (let i = 0; i < SLOT_COUNT; i++) {
    const l = slots[i];
    if (!l || !l.celebrate) continue;
    if (now >= l.celebrate.dropAt) {
      slots[i] = null; l.slot = null; l.celebrate = null;
      l.vx = (i - (SLOT_COUNT - 1) / 2) * 70 + (Math.random() - 0.5) * 120;
      l.vy = -260 - Math.random() * 100;
      l.va = (Math.random() - 0.5) * 7;
      spark(l.x, l.y, l.hue, 6);
    }
  }
  if (hero && now > hero.fadeAt + 420) { hero = null; heroEl.style.display = 'none'; }
}

function ejectSlot(idx, dir = 0) {
  const old = slots[idx]; if (!old) return;
  slots[idx] = null; old.slot = null; old.celebrate = null;
  old.vx = dir * 140 + (Math.random() - 0.5) * 140;
  old.vy = 140 + Math.random() * 80;
  old.va = (Math.random() - 0.5) * 6;
}

function clearAllSlots() {
  let any = false;
  for (let i = 0; i < SLOT_COUNT; i++) {
    const l = slots[i];
    if (!l || l.celebrate) continue;
    any = true;
    slots[i] = null; l.slot = null;
    l.vx = (i - (SLOT_COUNT - 1) / 2) * 85 + (Math.random() - 0.5) * 90;
    l.vy = -180 - Math.random() * 90;
    l.va = (Math.random() - 0.5) * 8;
    spark(l.x, l.y, l.hue, 5);
  }
  if (any) { pendingMatch = null; Sfx.tone(760, 0.28, 'sine', 0.14, 0, 280); }
}

function findTargetSlot(x, y, preferEmpty = true) {
  const pad = tray.r * 1.15;
  const inBand = x >= tray.x - pad && x <= tray.x + tray.w + pad && y >= tray.y - pad && y <= tray.bottom + tray.r * 1.35;
  let best = -1, bd = Infinity;
  // まず すきな わくを さがす（あいている わく ゆうせん）
  for (let i = 0; i < SLOT_COUNT; i++) {
    if (slots[i] && slots[i].celebrate) continue;
    const p = tray.pts[i], d = Math.hypot(x - p.x, y - p.y);
    const maxD = inBand ? tray.r * 2.4 : tray.r * 1.65;
    if (d > maxD) continue;
    // うまっている わくは どまんなかに おいた ときだけ うわがき
    if (preferEmpty && slots[i] && d > tray.r * 0.95) continue;
    const score = d + (slots[i] ? tray.r * 0.55 : 0);
    if (score < bd) { bd = score; best = i; }
  }
  return best;
}

// ---- ボタン: ことばが とびだす → うえに ならんで とまる → よみあげ（ぴょこぴょこ）→ おちる ----
const FLY = 380, GAP = 150, WAVE = 190;
let group = null;
function startWord() {
  const [, word] = cur, chars = [...word], c = btnCircle(), n = chars.length, now = performance.now();
  const sp = Math.min(R * 2.6, (W - R * 2) / n);
  const gapMid = (tray.bottom + (c.y - c.r)) / 2;
  const y = Math.max(tray.bottom + R * 0.95, Math.min(c.y - c.r - R * 0.5, gapMid));
  const hue0 = HUES[Math.floor(Math.random() * HUES.length)];
  const special = cur === SPECIAL;
  if (hero) hero.fadeAt = Math.min(hero.fadeAt, now + 120);
  group = { special, word, n, t0: now, spokeAt: 0, dropAt: 0, letters: [], chars, c, hue0, sp, y, dropped: false };
}
function updGroup(now) {
  const g = group; if (!g) return;
  // じゅんばんに とびだす
  while (g.letters.length < g.n && now >= g.t0 + g.letters.length * GAP) {
    const i = g.letters.length, k = (g.n === 1 ? 0 : i / (g.n - 1) - 0.5);
    const sx = g.c.x + k * g.c.r * 0.9, sy = g.c.y - g.c.r * 0.35;
    const L = addLetter(g.chars[i], (g.hue0 + i * 45) % 360, sx, sy, 0, 0);
    if (g.special) L.hue = (i * 120 + 10) % 360;
    L.show = { i, sx, sy, tx: W / 2 + (i - (g.n - 1) / 2) * g.sp, ty: g.y, t0: now, sc: 1 };
    L.glow = 1; g.letters.push(L); popSound(i); spark(sx, sy, L.hue, 6);
  }
  // ぜんぶ ならんだら よむ
  if (!g.spokeAt && g.letters.length === g.n && now >= g.t0 + (g.n - 1) * GAP + FLY + 120) {
    g.spokeAt = now; speak(g.word + '！', 0.85, 1.25);
    g.dropAt = now + g.n * WAVE + 650;
