<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ころころ</title>
<link rel="stylesheet" href="common.css?v=4">
<style>
  body { background: #bfe9ff; }
  .big-btn { --c1: #ff4040; --c2: #b31d1d; width: min(30vw, 150px); height: min(30vw, 150px); }
</style>
</head>
<body>
<canvas id="cv" class="full"><button id="btn" class="big-btn"><span class="emoji">⚽</span></button></canvas>
<script src="common.js?v=4"></script>
<script>
// ころころ: HTML-in-Canvas で本物のボタンがボールになってはねる
const canvas = document.getElementById('cv');
const btn = document.getElementById('btn');
const ctx = canvas.getContext('2d');
HIC.attach(canvas, btn);
let dpr = fitCanvas(canvas, ctx);
addEventListener('resize', () => { dpr = fitCanvas(canvas, ctx); });

const ball = { x: innerWidth / 2, y: 100, vx: 120, vy: 0, rot: 0, squash: 0 };
const trail = [];
let last = performance.now();
const GROUND = () => innerHeight - 70;

canvas.addEventListener('pointerdown', (e) => {
  const r = btn.offsetWidth / 2;
  const dx = ball.x - e.clientX, dy = ball.y - e.clientY;
  if (Math.hypot(dx, dy) > r * 1.3) return;
  ball.vx += dx / r * 600 + rand(-150, 150);
  ball.vy = -rand(900, 1300);
  Sfx.tone(300, 0.12, 'square', 0.12, 0, 900);
  Sfx.noise(0.08, 0.4, 2000);
});

function frame() {
  const now = performance.now(), dt = Math.min(0.033, (now - last) / 1000); last = now;
  const W = innerWidth, H = innerHeight, r = btn.offsetWidth / 2, g = GROUND();

  ball.vy += 1800 * dt;
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.y > g - r) {
    if (ball.vy > 300) { ball.squash = Math.min(0.35, ball.vy / 3000); Sfx.tone(140, 0.15, 'sine', 0.3, 0, 60); }
    ball.y = g - r; ball.vy *= -0.65; ball.vx *= 0.985;
    if (Math.abs(ball.vy) < 60) ball.vy = 0;
  }
  if (ball.x < r) { ball.x = r; ball.vx = Math.abs(ball.vx) * 0.8; Sfx.tone(220, 0.08, 'sine', 0.2); }
  if (ball.x > W - r) { ball.x = W - r; ball.vx = -Math.abs(ball.vx) * 0.8; Sfx.tone(220, 0.08, 'sine', 0.2); }
  ball.rot += ball.vx / r * dt;
  ball.squash *= Math.pow(0.002, dt);

  trail.push({ x: ball.x, y: ball.y, rot: ball.rot });
  if (trail.length > 8) trail.shift();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // そら と くさ
  ctx.fillStyle = '#bfe9ff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#7ed957'; ctx.fillRect(0, g, W, H - g);
  ctx.fillStyle = '#5fbf3c'; ctx.fillRect(0, g, W, 8);
  // かげ
  const hgt = Math.max(0, g - r - ball.y);
  ctx.fillStyle = `rgba(0,0,0,${0.25 * Math.max(0.2, 1 - hgt / 600)})`;
  ctx.beginPath(); ctx.ellipse(ball.x, g + 4, r * Math.max(0.4, 1 - hgt / 800), 10, 0, 0, Math.PI * 2); ctx.fill();

  const w = btn.offsetWidth, h = btn.offsetHeight;
  // ざんぞう
  trail.forEach((t, i) => {
    if (i === trail.length - 1) return;
    ctx.save();
    ctx.globalAlpha = (i + 1) / trail.length * 0.25;
    ctx.translate(t.x, t.y); ctx.rotate(t.rot);
    HIC.draw(ctx, btn, -w / 2, -h / 2);
    ctx.restore();
  });
  // ほんもの
  ctx.save();
  ctx.translate(ball.x, ball.y + r * ball.squash);
  ctx.scale(1 + ball.squash, 1 - ball.squash);
  ctx.rotate(ball.rot);
  HIC.draw(ctx, btn, -w / 2, -h / 2);
  ctx.restore();
}
HIC.loop(canvas, frame);
</script>
</body>
</html>
