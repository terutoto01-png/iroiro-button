<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>スタンプ</title>
<link rel="stylesheet" href="common.css?v=22">
<style>
  body { background: #fffaf0; }
  #cv { touch-action: none; }
  .big-btn { --c1: #ff9f1c; --c2: #c47200; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji" id="cur">🐶</span></button></div>
<script src="common.js?v=18"></script>
<script>
// スタンプ: がめんを さわると ぽんっと スタンプ。ゆびを うごかすと ならんで おせる。ボタンで スタンプが かわる（ボタンに いまの スタンプが でる）。
// おした スタンプを さわると ぷるぷる。30こ おすと みんなで おどって、つぎの まっしろな かみに なる。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn'), curEl = document.getElementById('cur');
let dpr = fitCanvas(cv, ctx), W = innerWidth, H = innerHeight;
const ALL = ['🐶', '🐱', '🐰', '🐻', '🐼', '🐸', '🐷', '🐥', '🍎', '🍓', '🍌', '🍉', '🍩', '🍰', '🚗', '🚃', '🚀', '✈️', '🐟', '🐙', '🐳', '⭐', '🌙', '🌈', '❤️', '🌸', '🌻', '🦋', '🦖', '🎈'];
let cur = '🐶', stamps = [], drag = null, party = -1, count = 0, paperHue = 40, fly = [];
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); W = innerWidth; H = innerHeight; });
const pitch = (e) => 400 + (ALL.indexOf(e) % 8) * 70;

btn.addEventListener('pointerdown', () => {
  let n; do n = pick(ALL); while (n === cur);
  cur = n; curEl.textContent = cur;
  Sfx.tone(pitch(cur), 0.12, 'triangle', 0.1, 0, pitch(cur) * 1.5);
});
function stamp(x, y) {
  if (party >= 0 || y < 70) return;
  stamps.push({ e: cur, x, y, s: rand(54, 70), rot: rand(-0.3, 0.3), t: 0, wig: 0 });
  if (stamps.length > 160) stamps.shift();
  count++;
  Sfx.tone(pitch(cur), 0.1, 'sine', 0.2, 0, pitch(cur) * 0.6); Sfx.noise(0.05, 0.1, 1200);
  if (count % 30 === 0) { party = 0; Sfx.yay(); popText('じょうず！', W / 2, H * 0.3, '#ff7b00', 52); }
}
cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  drag = { id: e.pointerId, x, y };
  for (let i = stamps.length - 1; i >= 0; i--) { const s = stamps[i]; if (Math.hypot(s.x - x, s.y - y) < s.s * 0.45) { s.wig = 1; Sfx.tone(pitch(s.e) * 1.3, 0.15, 'triangle', 0.1, 0, pitch(s.e)); return; } }
  stamp(x, y);
});
cv.addEventListener('pointermove', (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 52) { drag.x = e.clientX; drag.y = e.clientY; stamp(drag.x, drag.y); }
});
const up = (e) => { if (drag && drag.id === e.pointerId) drag = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
  for (const s of stamps) { s.t += dt; s.wig = Math.max(0, s.wig - dt * 1.5); }
  if (party >= 0) {
    const p0 = party; party += dt;
    if (Math.floor(party * 4) !== Math.floor(p0 * 4) && party < 2.5) Sfx.tone([523, 659, 784, 1047][Math.floor(party * 4) % 4], 0.15, 'square', 0.05);
    if (party > 2.6 && p0 <= 2.6) { fly = stamps.map(s => ({ ...s, vx: rand(-200, 200), vy: rand(-700, -400) })); stamps = []; Sfx.noise(0.6, 0.15, 3000, 0, 'highpass'); }
    if (party > 3.4) { party = -1; paperHue = (paperHue + 70) % 360; Sfx.chime(); }
  }
  for (const f of fly) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 900 * dt; f.rot += dt * 5; }
  fly = fly.filter(f => f.y < H + 100);
  draw(t);
  requestAnimationFrame(loop);
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `hsl(${paperHue},80%,96%)`; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = `hsla(${paperHue},60%,70%,.35)`; ctx.lineWidth = 1;
  for (let y = 100; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (const s of stamps) {
    const pop = Math.min(1, s.t * 8), dance = party >= 0 && party < 2.6 ? Math.abs(Math.sin(party * 8 + s.x * 0.02)) * 20 : 0;
    ctx.save(); ctx.translate(s.x, s.y - dance); ctx.rotate(s.rot + Math.sin(s.wig * 25) * s.wig * 0.4 + (dance ? Math.sin(party * 8 + s.y) * 0.2 : 0));
    const k = pop < 1 ? 1.4 - 0.4 * pop : 1; ctx.scale(k, k);
    drawEmoji(ctx, s.e, 0, 0, s.s); ctx.restore();
  }
  if (!stamps.length && !fly.length && party < 0) { ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t * 3); drawEmoji(ctx, '👆', W / 2, H * 0.45 + Math.sin(t * 3) * 8, 70); ctx.globalAlpha = 1; } // まっしろな ときの ヒント
  for (const f of fly) { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); drawEmoji(ctx, f.e, 0, 0, f.s); ctx.restore(); }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
