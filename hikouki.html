<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>ひこうき</title>
<link rel="stylesheet" href="common.css?v=23">
<style>
  body { background: #74ccff; }
  #cv { touch-action: none; }
  .big-btn { --c1: #3ba6ff; --c2: #1466b8; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">✈️</span></button></div>
<script src="common.js?v=20"></script>
<script>
// ひこうき: ボタンで くるりん ちゅうがえり（にじの ひこうきぐも）。5かい すると 3き へんたいで だいパレード。
// そらを さわったり なぞったり すると そっちへ とぶ。くもを さわると ぽふっ、ふうせんを さわると ぱんっ、☀️/🌙 で あさ・ゆうがた・よる。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx), W = innerWidth, H = innerHeight;
const SKIES = [
  ['#4eb8ff', '#ccefff', '#79cf66'],
  ['#ff7e5f', '#ffd27f', '#5ea64e'],
  ['#131b4d', '#31428c', '#254a36'],
];
let skyMode = 0, skyT = 0, loops = 0, drag = null;
let plane = { x: W * 0.3, y: H * 0.42, vx: 220, vy: 0, ang: 0, loop: 0, loopR: 70, loopDir: 1, rainbow: 0, scale: 1 };
let trail = [], clouds = [], balloons = [], birds = [], puffs = [], sparks = [], parade = [], stars = [];

function initScene() {
  clouds = [];
  for (let i = 0; i < 6; i++) clouds.push(makeCloud(rand(0, W)));
  stars = [];
  for (let i = 0; i < 50; i++) stars.push({ x: Math.random() * W, y: Math.random() * H * 0.72, p: rand(0, 6), r: rand(1.2, 2.8) });
}
function makeCloud(x) { return iroTag({ x, y: rand(95, H * 0.56), s: rand(36, 62), v: rand(16, 36), pop: 0 }); }
function spawnBalloon() { balloons.push(iroTag({ x: rand(50, W - 50), y: H + 40, v: rand(45, 80), ph: rand(0, 6), hue: rand(0, 360) })); }
function spawnBird() { const d = Math.random() < 0.5 ? 1 : -1; birds.push({ e: Math.random() < 0.5 ? '🕊️' : '🐦', x: d > 0 ? -40 : W + 40, y: rand(100, H * 0.55), v: d * rand(75, 130), ph: rand(0, 6) }); }
initScene();
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); W = innerWidth; H = innerHeight; initScene(); });

function sunPos() { return { x: W - 76, y: 118 }; }

function doLoop() {
  if (plane.loop > 0) {
    plane.rainbow = 2.6;
    Sfx.tone(rand(700, 1000), 0.14, 'triangle', 0.12, 0, 1400);
    for (let i = 0; i < 8; i++) sparks.push({ x: plane.x, y: plane.y, vx: rand(-140, 140), vy: rand(-140, 140), life: 0.7, e: '✨', s: 22 });
    return;
  }
  plane.loop = 0.001;
  plane.loopR = Math.min(95, Math.min(W, H) * 0.17);
  const goUp = plane.y > Math.max(150, H * 0.34);
  plane.loopDir = (plane.vx >= 0 ? -1 : 1) * (goUp ? 1 : -1);
  plane.loopCx = plane.x;
  plane.loopCy = plane.y + (goUp ? -plane.loopR : plane.loopR);
  plane.loopStart = goUp ? Math.PI / 2 : -Math.PI / 2;
  plane.rainbow = 2.6;
  loops++;
  Sfx.noise(0.55, 0.16, 1400, 0, 'bandpass');
  [523, 659, 784, 1047].forEach((f, i) => Sfx.tone(f, 0.16, 'triangle', 0.1, i * 0.09));
  if (loops % 5 === 0) startParade();
}

function startParade() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const baseY = H * 0.34;
  const cols = ['#ff4f7b', '#ffd23f', '#4fc3f7'];
  for (let i = 0; i < 3; i++) {
    parade.push({ x: dir > 0 ? -70 - i * 60 : W + 70 + i * 60, y: baseY + (i - 1) * 58, dir, v: 360, c: cols[i], tr: [] });
  }
  Sfx.yay(); setTimeout(() => Sfx.chime(), 260);
  popText('すごい！', W / 2, H * 0.24, '#ffd23f', 54);
}

btn.addEventListener('pointerdown', doLoop);

cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY, sp = sunPos();
  if (Math.hypot(x - sp.x, y - sp.y) < 46) {
    skyMode = (skyMode + 1) % 3;
    Sfx.chime();
    popText(['あさ！', 'ゆうがた！', 'よる！'][skyMode], sp.x - 40, sp.y + 58, '#fff', 32);
    return;
  }
  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    if (Math.hypot(x - b.x, y - b.y) < 42) {
      balloons.splice(i, 1);
      Sfx.pop();
      for (let k = 0; k < 12; k++) sparks.push({ x: b.x, y: b.y, vx: rand(-180, 180), vy: rand(-180, 120), life: 0.8, c: `hsl(${rand(0, 360)},90%,60%)` });
      popText('ぱんっ', b.x, b.y - 20, '#fff', 32);
      return;
    }
  }
  for (let i = clouds.length - 1; i >= 0; i--) {
    const c = clouds[i];
    if (Math.hypot(x - c.x, y - c.y) < c.s * 1.1) {
      for (let k = 0; k < 10; k++) puffs.push({ x: c.x + rand(-25, 25), y: c.y + rand(-12, 12), vx: rand(-90, 90), vy: rand(-60, 40), r: rand(12, 26), life: 0.7 });
      if (Math.random() < 0.65) balloons.push(iroTag({ x: c.x, y: c.y, v: rand(55, 85), ph: rand(0, 6), hue: rand(0, 360) }));
      else spawnBird();
      clouds.splice(i, 1);
      clouds.push(makeCloud(-80));
      Sfx.noise(0.18, 0.14, 900); Sfx.tone(600, 0.1, 'sine', 0.1, 0, 900);
      return;
    }
  }
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  drag = { id: e.pointerId, x, y };
  Sfx.tone(520, 0.08, 'sine', 0.08, 0, 740);
});
// マルチ: なかまが おした ふうせん・くもを、この がめんでも おなじ ものとして おす
iroGrab(() => [...balloons, ...clouds], (o) => [o.x, o.y], 68);
cv.addEventListener('pointermove', (e) => { if (drag && drag.id === e.pointerId) { drag.x = e.clientX; drag.y = e.clientY; } });
const up = (e) => { if (drag && drag.id === e.pointerId) drag = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

let last = performance.now(), balT = 1.2, birdT = 2.5;
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
  skyT += dt;
  balT -= dt; if (balT < 0 && balloons.length < 6) { balT = rand(2.2, 4.2); spawnBalloon(); }
  birdT -= dt; if (birdT < 0 && birds.length < 3) { birdT = rand(3.5, 6.5); spawnBird(); }

  // ひこうきの うごき
  if (plane.loop > 0) {
    plane.loop += dt * 1.15;
    const a = plane.loopStart + plane.loop * Math.PI * 2 * plane.loopDir;
    plane.x = plane.loopCx + Math.cos(a) * plane.loopR;
    plane.y = plane.loopCy + Math.sin(a) * plane.loopR;
    plane.ang = a + (plane.loopDir > 0 ? Math.PI / 2 : -Math.PI / 2);
    if (plane.loop >= 1) {
      plane.loop = 0;
      const sp = 240;
      plane.vx = Math.cos(plane.ang) * sp; plane.vy = Math.sin(plane.ang) * sp;
    }
  } else {
    let tx, ty;
    if (drag) { tx = drag.x; ty = Math.min(H - 120, Math.max(75, drag.y)); }
    else {
      tx = plane.x + plane.vx * 0.5;
      ty = H * 0.36 + Math.sin(t * 1.3) * Math.min(80, H * 0.12);
    }
    const dx = tx - plane.x, dy = ty - plane.y, d = Math.hypot(dx, dy);
    if (drag && d > 18) {
      const sp = Math.min(380, Math.max(180, d * 2.2));
      plane.vx += (dx / d * sp - plane.vx) * Math.min(1, dt * 6);
      plane.vy += (dy / d * sp - plane.vy) * Math.min(1, dt * 6);
    } else if (!drag) {
      const targetVx = plane.vx >= 0 ? 220 : -220;
      plane.vx += (targetVx - plane.vx) * Math.min(1, dt * 2.5);
      plane.vy += ((ty - plane.y) * 2.2 - plane.vy) * Math.min(1, dt * 3);
    }
    plane.x += plane.vx * dt; plane.y += plane.vy * dt;
    plane.y = Math.max(70, Math.min(H - 115, plane.y));
    if (!drag) {
      if (plane.x > W + 55) plane.x = -55;
      if (plane.x < -55) plane.x = W + 55;
    } else {
      plane.x = Math.max(30, Math.min(W - 30, plane.x));
    }
    plane.ang = Math.atan2(plane.vy, plane.vx);
  }
  plane.rainbow = Math.max(0, plane.rainbow - dt);

  // ひこうきぐも
  const tailX = plane.x - Math.cos(plane.ang) * 26, tailY = plane.y - Math.sin(plane.ang) * 26;
  trail.push({ x: tailX, y: tailY, life: 1.5, hue: (t * 260) % 360, rb: plane.rainbow > 0 || !!drag });
  if (trail.length > 90) trail.shift();
  for (const p of trail) p.life -= dt;
  trail = trail.filter(p => p.life > 0);

  // ぶつかり（ふうせんを わる）
  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i]; b.y -= b.v * dt; b.x += Math.sin(t * 2 + b.ph) * 25 * dt;
    if (Math.hypot(b.x - plane.x, b.y - plane.y) < 42) {
      balloons.splice(i, 1); Sfx.pop();
      for (let k = 0; k < 10; k++) sparks.push({ x: b.x, y: b.y, vx: rand(-160, 160), vy: rand(-160, 120), life: 0.7, c: `hsl(${rand(0, 360)},90%,60%)` });
    }
  }
  balloons = balloons.filter(b => b.y > -60);

  for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 110) { c.x = -110; c.y = rand(95, H * 0.56); } }
  for (const b of birds) { b.x += b.v * dt; b.y += Math.sin(t * 5 + b.ph) * 24 * dt; }
  birds = birds.filter(b => b.x > -80 && b.x < W + 80);

  for (const p of parade) {
    p.x += p.dir * p.v * dt;
    p.tr.push({ x: p.x - p.dir * 24, y: p.y, life: 1.2 });
    for (const q of p.tr) q.life -= dt;
    p.tr = p.tr.filter(q => q.life > 0);
  }
  parade = parade.filter(p => (p.dir > 0 ? p.x < W + 240 : p.x > -240) || p.tr.length);

  for (const p of puffs) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  puffs = puffs.filter(p => p.life > 0);
  for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 260 * dt; s.life -= dt; }
  sparks = sparks.filter(s => s.life > 0);

  draw(t);
  requestAnimationFrame(loop);
}

function drawCloud(x, y, s, night) {
  ctx.fillStyle = night ? 'rgba(180,200,240,.35)' : 'rgba(255,255,255,.92)';
  for (const [dx, dy, r] of [[0, 0, 0.55], [-0.48, 0.14, 0.4], [0.5, 0.14, 0.42], [0.15, -0.2, 0.36]]) {
    ctx.beginPath(); ctx.arc(x + s * dx, y + s * dy, s * r, 0, Math.PI * 2); ctx.fill();
  }
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [c1, c2, hill] = SKIES[skyMode], night = skyMode === 2;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (night) {
    for (const s of stars) {
      ctx.fillStyle = `rgba(255,255,215,${0.4 + 0.6 * Math.sin(t * 2.5 + s.p)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
  }
  const sp = sunPos();
  drawEmoji(ctx, night ? '🌙' : '☀️', sp.x, sp.y + Math.sin(t * 2) * 3, 56);

  for (const c of clouds) drawCloud(c.x, c.y, c.s, night);

  // したの おか と き
  ctx.fillStyle = hill;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 24) ctx.lineTo(x, H - 56 - Math.sin(x / 120) * 18);
  ctx.lineTo(W + 20, H); ctx.fill();
  for (let x = 36; x < W - 120; x += 95) drawEmoji(ctx, '🌲', x, H - 58 - Math.sin(x / 120) * 14, 34);

  // パレードの けむり と ひこうき
  for (const p of parade) {
    for (let i = 1; i < p.tr.length; i++) {
      const a = p.tr[i - 1], b = p.tr[i];
      ctx.strokeStyle = p.c; ctx.globalAlpha = Math.max(0, b.life / 1.2) * 0.85;
      ctx.lineWidth = 10 * (b.life / 1.2); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate((p.dir > 0 ? 0 : Math.PI) + Math.PI / 4);
    drawEmoji(ctx, '✈️', 0, 0, 48); ctx.restore();
  }

  for (const b of birds) {
    ctx.save(); ctx.translate(b.x, b.y); if (b.v > 0) ctx.scale(-1, 1);
    drawEmoji(ctx, b.e, 0, 0, 36); ctx.restore();
  }
  for (const b of balloons) drawEmoji(ctx, '🎈', b.x, b.y, 48);

  // ひこうきぐも
  for (let i = 1; i < trail.length; i++) {
    const a = trail[i - 1], b = trail[i];
    if (Math.hypot(a.x - b.x, a.y - b.y) > 90) continue;
    const k = Math.max(0, b.life / 1.5);
    ctx.strokeStyle = b.rb ? `hsla(${b.hue},95%,62%,${k * 0.9})` : `rgba(255,255,255,${k * 0.8})`;
    ctx.lineWidth = (b.rb ? 14 : 9) * k + 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // メインの ひこうき（✈️ の はなは みぎうえ -45° なので +π/4 まわす）
  ctx.save(); ctx.translate(plane.x, plane.y); ctx.rotate(plane.ang + Math.PI / 4);
  if (night) {
    ctx.fillStyle = `rgba(255,245,150,${0.35 + 0.25 * Math.sin(t * 14)})`;
    ctx.beginPath(); ctx.arc(0, 0, 42, 0, 7); ctx.fill();
  }
  drawEmoji(ctx, '✈️', 0, 0, 68);
  ctx.restore();

  for (const p of puffs) { ctx.fillStyle = `rgba(255,255,255,${p.life / 0.7})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.life / 0.7), 0, 7); ctx.fill(); }
  for (const s of sparks) {
    if (s.e) { ctx.globalAlpha = s.life; drawEmoji(ctx, s.e, s.x, s.y, s.s); ctx.globalAlpha = 1; }
    else { ctx.fillStyle = s.c; ctx.globalAlpha = s.life; ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
