<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>たまご</title>
<link rel="stylesheet" href="common.css?v=21">
<style>
  body { background: radial-gradient(circle at 50% 70%, #fff6d8, #ffd98a); display: flex; align-items: center; justify-content: center; }
  #egg { position: relative; width: min(55vw, 260px); height: min(72vw, 340px); border: none; padding: 0; cursor: pointer;
         border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 35% 30%, #fff 0 10%, #fffaf0 30%, #f3e2c4);
         box-shadow: inset -14px -18px 0 rgba(0,0,0,.06), 0 18px 0 -6px rgba(0,0,0,.12); }
  #egg svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #egg.wobble { animation: wob .35s; }
  @keyframes wob { 25% { rotate: -9deg; } 75% { rotate: 9deg; } }
  #egg.hatch { animation: hatch .5s forwards; }
  @keyframes hatch { to { scale: 1.3; opacity: 0; } }
  #baby { position: fixed; left: 50%; top: 50%; font-size: min(50vw, 260px); pointer-events: none;
          transform: translate(-50%, -50%) scale(0); transition: transform .5s cubic-bezier(.3,1.7,.5,1); }
  #baby.show { transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<button id="egg" aria-label="たまご"><svg viewBox="0 0 100 130" id="cracks"></svg></button>
<div id="baby"></div>
<script src="common.js?v=17"></script>
<script>
const BABIES = [
  ['🐣', 'ひよこ'], ['🐥', 'ひよこ'], ['🐧', 'ぺんぎん'], ['🐢', 'かめ'], ['🐊', 'わに'],
  ['🦖', 'きょうりゅう'], ['🦕', 'きょうりゅう'], ['🐍', 'へび'], ['🦜', 'いんこ'], ['🦆', 'あひる'],
  ['🐉', 'どらごん'], ['🦄', 'ゆにこーん'], ['🐸', 'かえる'], ['🦩', 'ふらみんご'],
];
const egg = document.getElementById('egg'), cracks = document.getElementById('cracks'), baby = document.getElementById('baby');
let hits = 0, need = 0, state = 'egg';

function reset() {
  hits = 0; need = Math.floor(rand(5, 9)); state = 'egg';
  cracks.innerHTML = '';
  egg.className = ''; egg.style.visibility = 'visible';
  baby.className = '';
}
function addCrack() {
  // ジグザグの ひび
  let x = rand(25, 75), y = rand(25, 95);
  let d = `M${x} ${y}`;
  for (let i = 0; i < 5; i++) { x += rand(-12, 12); y += rand(-10, 10); d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; }
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#7a5a2a');
  p.setAttribute('stroke-width', '1.6'); p.setAttribute('stroke-linejoin', 'round');
  cracks.appendChild(p);
}

egg.addEventListener('pointerdown', () => {
  if (state === 'baby') { reset(); Sfx.pop(); return; }
  if (state !== 'egg') return;
  hits++;
  addCrack();
  egg.classList.remove('wobble'); void egg.offsetWidth; egg.classList.add('wobble');
  Sfx.noise(0.06, 0.8, 4000, 0, 'highpass');                // ぴしっ
  Sfx.tone(800 + hits * 80, 0.06, 'square', 0.06);
  if (hits >= need) {
    state = 'hatching';
    setTimeout(() => {
      egg.classList.add('hatch');
      const [e, name] = pick(BABIES);
      baby.textContent = e;
      baby.classList.add('show');
      Sfx.noise(0.3, 0.8, 2500);
      Sfx.yay();
      speak(`うまれた！ ${name}だ！`);
      setTimeout(() => { egg.style.visibility = 'hidden'; state = 'baby'; }, 500);
    }, 250);
  }
});
// あかちゃんが でたあとは どこを おしても つぎの たまご
document.body.addEventListener('pointerdown', (e) => { if (state === 'baby' && e.target === document.body) { reset(); Sfx.pop(); } });
reset();
</script>
</body>
</html>
