<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>にげるボタン</title>
<link rel="stylesheet" href="common.css?v=18">
<style>
  body { background: #fff0c9; }
  #btn { position: fixed; left: 0; top: 0; --c1: #8e44ff; --c2: #5a1fc2;
         width: min(30vw, 150px); height: min(30vw, 150px);
         transition: left .35s cubic-bezier(.3,1.4,.5,1), top .35s cubic-bezier(.3,1.4,.5,1), transform .06s, box-shadow .06s; }
  #btn.caught { animation: spin .7s ease-out; }
  @keyframes spin { from { rotate: 0deg; scale: 1.4; } to { rotate: 720deg; scale: 1; } }
  .star { position: fixed; font-size: 36px; pointer-events: none; z-index: 30; transition: transform .9s ease-out, opacity .9s; }
</style>
</head>
<body>
<button id="btn" class="big-btn"><span class="emoji">🐰</span></button>
<script src="common.js?v=15"></script>
<script>
const btn = document.getElementById('btn');
let wait = 1400, timer;

function moveAway() {
  const s = btn.offsetWidth;
  const sat = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  const topMargin = Math.max(80, sat + 60); // .back/.vol エリアを避ける
  const sideMargin = 10;
  btn.style.left = rand(sideMargin, innerWidth - s - sideMargin) + 'px';
  btn.style.top = rand(topMargin, innerHeight - s - 20) + 'px';
  Sfx.tone(rand(600, 900), 0.08, 'sine', 0.12, 0, 1500);
  clearTimeout(timer);
  timer = setTimeout(moveAway, wait);
}

btn.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'star'; s.textContent = pick(['⭐', '✨', '🌟', '💖']);
    s.style.left = cx - 18 + 'px'; s.style.top = cy - 18 + 'px';
    document.body.appendChild(s);
    const a = i / 12 * Math.PI * 2;
    requestAnimationFrame(() => { s.style.transform = `translate(${Math.cos(a) * 160}px, ${Math.sin(a) * 160}px) scale(1.5)`; s.style.opacity = 0; });
    setTimeout(() => s.remove(), 1000);
  }
  btn.classList.remove('caught'); void btn.offsetWidth; btn.classList.add('caught');
  btn.querySelector('.emoji').textContent = pick(['🐰', '🐿️', '🐹', '🦊', '🐥', '🐭']);
  Sfx.yay();
  wait = Math.max(450, wait - 120); // だんだん すばやく
  clearTimeout(timer);
  timer = setTimeout(moveAway, 700);
});

// マウスが ちかづくと にげる（ときどき）
addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const r = btn.getBoundingClientRect();
  const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
  if (d < r.width * 0.9 && Math.random() < 0.04) moveAway();
});

btn.style.left = (innerWidth - btn.offsetWidth) / 2 + 'px';
btn.style.top = (innerHeight - btn.offsetHeight) / 2 + 'px';
timer = setTimeout(moveAway, 2000);
</script>
</body>
</html>
