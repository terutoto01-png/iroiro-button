<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>てじな</title>
<link rel="stylesheet" href="common.css?v=18">
<style>
  body { background: radial-gradient(ellipse at 50% 35%, #7a3fc2, #2b1050 75%); }
  #cv { touch-action: none; }
  .big-btn { --c1: #9b5cff; --c2: #5a2bb3; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="bottom-center"><button id="btn" class="big-btn"><span class="emoji">🪄</span></button></div>
<script src="common.js?v=15"></script>
<script>
// てじな: ボタンを おすと ぼうしが ぶるぶるして、なにかが でてくる（🐰、🕊️、はなふぶき、ほし、ふうせん。ごくまれに 🐘）。
// ぼうしから ハンカチの はしっこが でている ときは、つまんで ひっぱると どこまでも つながって でてくる。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx), W = innerWidth, H = innerHeight;
const SCARF = ['#ff4f7b', '#ffd23f', '#4fc3f7', '#6be36b', '#ff9f1c', '#b388ff'];
let hat, shake = 0, pending = null, things = [], bunnies = [], parts = [], scarfPeek = true, rope = null, ropeFly = [], stretch = 0;

function layout() {
  const bt = btn.getBoundingClientRect().top;
  const hw = Math.min(W * 0.46, 250);
  hat = { x: W / 2, y: Math.min(H * 0.5, bt - hw * 0.85), w: hw, ch: hw * 0.7 };
}
layout();
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); W = innerWidth; H = innerHeight; layout(); });

btn.addEventListener('pointerdown', () => {
  if (pending) return;
  shake = 0.6; pending = 0.6;
  for (let i = 0; i < 10; i++) Sfx.tone(300 + i * 25, 0.05, 'triangle', 0.06, i * 0.055);
});

function reveal() {
  const r = Math.random(), o = { x: hat.x, y: hat.y };
  Sfx.tone(700, 0.1, 'sine', 0.15, 0, 1400); Sfx.noise(0.25, 0.15, 3000, 0, 'highpass');
  for (let i = 0; i < 14; i++) parts.push({ x: o.x + rand(-30, 30), y: o.y, vx: rand(-150, 150), vy: rand(-300, -100), life: 0.8, e: '✨', s: 22 });
  if (r < 0.05) { // ぞう！
    stretch = 1; things.push({ e: '🐘', x: o.x, y: o.y, t: 0, kind: 'big' }); Sfx.tone(200, 0.6, 'sawtooth', 0.1, 0.3, 500); popText('ええっ！', W / 2, hat.y - hat.w * 1.3, '#ffd23f', 52);
  } else if (r < 0.32) {
    things.push({ e: '🐰', x: o.x, y: o.y, t: 0, kind: 'bunny' }); popText('ぴょん！', W / 2, hat.y - 160, '#fff', 40);
  } else if (r < 0.5) {
    for (let i = 0; i < 3; i++) things.push({ e: '🕊️', x: o.x, y: o.y, t: -i * 0.15, kind: 'dove', dir: i % 2 ? 1 : -1, vy: rand(-220, -150) });
    Sfx.noise(0.4, 0.1, 1800, 0.1, 'bandpass');
  } else if (r < 0.66) {
    for (let i = 0; i < 40; i++) parts.push({ x: o.x, y: o.y, vx: rand(-260, 260), vy: rand(-650, -300), life: 2.2, e: pick(['🌸', '🌼', '🌷', '💐']), s: 30, g: 500 });
    Sfx.chime();
  } else if (r < 0.82) {
    for (let i = 0; i < 30; i++) parts.push({ x: o.x, y: o.y, vx: rand(-300, 300), vy: rand(-700, -350), life: 2, e: pick(['⭐', '🌟', '✨']), s: 28, g: 600 });
    Sfx.yay();
  } else {
    for (let i = 0; i < 5; i++) things.push({ e: '🎈', x: o.x + (i - 2) * 30, y: o.y, t: -i * 0.1, kind: 'balloon', vx: (i - 2) * 25 });
    Sfx.tone(500, 0.3, 'sine', 0.1, 0, 900);
  }
  if (!scarfPeek && Math.random() < 0.35) scarfPeek = true;
}

// ハンカチ（ロープの ように つながる）
cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY;
  if (Math.abs(x - hat.x) < hat.w * 0.55 && Math.abs(y - hat.y) < 70) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (scarfPeek) {
      scarfPeek = false;
      rope = { id: e.pointerId, fx: x, fy: y, links: [{ x: hat.x, y: hat.y, px: hat.x, py: hat.y, c: SCARF[0] }], pulled: 0, lx: x, ly: y };
      Sfx.tone(600, 0.1, 'sine', 0.1, 0, 800);
    } else { shake = 0.3; Sfx.tone(400, 0.1, 'triangle', 0.08); }
  }
  // でてきた うさぎを さわると ぴょん
  for (const b of bunnies) if (Math.hypot(b.x - x, b.y - y) < 40) { b.hop = 1; Sfx.boing(); }
});
cv.addEventListener('pointermove', (e) => {
  if (!rope || rope.id !== e.pointerId) return;
  rope.pulled += Math.hypot(e.clientX - rope.lx, e.clientY - rope.ly); rope.lx = e.clientX; rope.ly = e.clientY;
  rope.fx = e.clientX; rope.fy = e.clientY;
  while (rope.pulled > 24 && rope.links.length < 120) {
    rope.pulled -= 24;
    rope.links.unshift({ x: hat.x, y: hat.y, px: hat.x, py: hat.y + 2, c: SCARF[rope.links.length % SCARF.length] });
    if (rope.links.length % 3 === 0) Sfx.tone(500 + (rope.links.length % 12) * 40, 0.05, 'sine', 0.06);
  }
});
const letGo = (e) => {
  if (!rope || rope.id !== e.pointerId) return;
  if (rope.links.length > 15) { popText('ながーい！', W / 2, H * 0.2, '#ffd23f', 48); Sfx.yay(); }
  ropeFly.push({ links: rope.links, t: 0 }); rope = null;
};
cv.addEventListener('pointerup', letGo); cv.addEventListener('pointercancel', letGo);

function simRope(links, dt, pinA, pinB, g) {
  for (const l of links) { const vx = (l.x - l.px) * 0.98, vy = (l.y - l.py) * 0.98; l.px = l.x; l.py = l.y; l.x += vx; l.y += vy + g * dt * dt; }
  for (let it = 0; it < 8; it++) {
    for (let i = 1; i < links.length; i++) {
      const a = links[i - 1], b = links[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, k = (d - 22) / d / 2;
      a.x += dx * k; a.y += dy * k; b.x -= dx * k; b.y -= dy * k;
    }
    if (pinA) { links[0].x = pinA.x; links[0].y = pinA.y; }
    if (pinB) { const l = links[links.length - 1]; l.x = pinB.x; l.y = pinB.y; }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
  shake = Math.max(0, shake - dt); stretch = Math.max(0, stretch - dt * 0.4);
  if (pending !== null) { pending -= dt; if (pending <= 0) { pending = null; reveal(); } }
  for (const o of things) {
    o.t += dt; if (o.t < 0) continue;
    if (o.kind === 'bunny') { o.y = hat.y - Math.sin(Math.min(1, o.t / 0.6) * Math.PI) * 140 - 10; o.x = hat.x + Math.min(1, o.t / 0.6) * (bunnies.length % 2 ? -1 : 1) * hat.w * (0.75 + 0.18 * Math.floor(bunnies.length / 2)); if (o.t >= 0.6) { o.done = true; bunnies.push({ x: o.x, y: hat.y + hat.ch * 0.5, hop: 0, t: 0 }); if (bunnies.length > 4) bunnies.shift(); Sfx.boing(); } }
    else if (o.kind === 'dove') { o.x += o.dir * 200 * dt; o.y += o.vy * dt; o.vy += 60 * dt; if (o.y < -60 || o.x < -60 || o.x > W + 60) o.done = true; }
    else if (o.kind === 'balloon') { o.y -= 150 * dt; o.x += o.vx * dt + Math.sin(t * 2 + o.x) * 20 * dt; if (o.y < -80) o.done = true; }
    else if (o.kind === 'big') { o.y = hat.y - Math.min(1, o.t / 0.8) * hat.w * 0.9; if (o.t > 3.2) { o.y -= (o.t - 3.2) * 900; if (o.y < -300) o.done = true; } }
  }
  things = things.filter(o => !o.done);
  for (const b of bunnies) { b.t += dt; b.hop = Math.max(0, b.hop - dt * 2.5); }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 300) * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (rope) simRope(rope.links, dt, { x: hat.x, y: hat.y }, { x: rope.fx, y: rope.fy }, 900);
  for (const f of ropeFly) { f.t += dt; simRope(f.links, dt, null, null, -300); }
  ropeFly = ropeFly.filter(f => f.t < 4);
  draw(t);
  requestAnimationFrame(loop);
}

function drawRope(links, a = 1) {
  ctx.globalAlpha = a;
  for (let i = 1; i < links.length; i++) {
    const p = links[i - 1], q = links[i], ang = Math.atan2(q.y - p.y, q.x - p.x);
    ctx.save(); ctx.translate((p.x + q.x) / 2, (p.y + q.y) / 2); ctx.rotate(ang + Math.PI / 4);
    ctx.fillStyle = q.c; ctx.fillRect(-11, -11, 22, 22); ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  // テーブル
  const ty = hat.y + hat.ch;
  ctx.fillStyle = '#c0392b'; ctx.fillRect(hat.x - hat.w * 1.5, ty, hat.w * 3, 26);
  ctx.fillStyle = '#ffd23f'; for (let x = hat.x - hat.w * 1.5; x < hat.x + hat.w * 1.5; x += 30) { ctx.beginPath(); ctx.moveTo(x, ty + 26); ctx.lineTo(x + 15, ty + 40); ctx.lineTo(x + 30, ty + 26); ctx.fill(); }
  for (const b of bunnies) drawEmoji(ctx, '🐰', b.x, ty - 26 - Math.sin(b.hop * Math.PI) * 50 + Math.sin(b.t * 3) * 2, 52);
  for (const o of things) if (o.kind === 'big' && o.t >= 0) drawEmoji(ctx, o.e, o.x, o.y, hat.w * 1.1);
  // ぼうし（さかさま。あなが うえ）
  const sx = Math.sin(t * 60) * shake * 10;
  ctx.save(); ctx.translate(hat.x + sx, hat.y);
  const sw = hat.w * (1 + stretch * 0.3);
  ctx.fillStyle = '#1b1b24'; ctx.beginPath(); ctx.moveTo(-sw * 0.38, 0); ctx.lineTo(sw * 0.38, 0); ctx.lineTo(sw * 0.34, hat.ch); ctx.lineTo(-sw * 0.34, hat.ch); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8394a'; ctx.fillRect(-sw * 0.37, hat.ch * 0.15, sw * 0.74, hat.ch * 0.16);
  ctx.fillStyle = '#2b2b36'; ctx.beginPath(); ctx.ellipse(0, 0, sw * 0.5, sw * 0.12, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(0, 0, sw * 0.36, sw * 0.07, 0, 0, 7); ctx.fill();
  if (scarfPeek && !rope) { ctx.fillStyle = SCARF[0]; ctx.save(); ctx.translate(sw * 0.1, -6 - Math.abs(Math.sin(t * 3)) * 6); ctx.rotate(Math.PI / 4 + Math.sin(t * 3) * 0.2); ctx.fillRect(-12, -12, 24, 24); ctx.restore(); }
  ctx.restore();
  for (const o of things) if (o.kind !== 'big' && o.t >= 0) { ctx.save(); ctx.translate(o.x, o.y); if (o.dir > 0) ctx.scale(-1, 1); drawEmoji(ctx, o.e, 0, 0, o.kind === 'balloon' ? 50 : 56); ctx.restore(); }
  if (rope) drawRope(rope.links);
  for (const f of ropeFly) drawRope(f.links, Math.max(0, 1 - f.t / 4));
  for (const p of parts) drawEmoji(ctx, p.e, p.x, p.y, p.s);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
