<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>たいこ</title>
<link rel="stylesheet" href="common.css?v=6">
<style>
  body { background: #2a0f0f; display: flex; align-items: center; justify-content: center; }
  .big-btn { --c1: #f5e6c8; --c2: #8b2e1a; width: min(70vw, 320px); height: min(70vw, 320px);
             border: 14px solid #c0392b; color: #8b2e1a; }
  .big-btn .emoji { font-size: min(30vw, 140px); }
  .ring { position: fixed; z-index: 1; border-radius: 50%; border: 8px solid #ffcc33; pointer-events: none;
          transform: translate(-50%, -50%); animation: ring .6s ease-out forwards; }
  @keyframes ring { from { width: 280px; height: 280px; opacity: 1; } to { width: 900px; height: 900px; opacity: 0; } }
  body.don { animation: don .15s; }
  @keyframes don { 50% { background: #5a1a10; } }
</style>
</head>
<body>
<button id="btn" class="big-btn"><span class="emoji">🥁</span></button>
<script src="common.js?v=6"></script>
<script>
const btn = document.getElementById('btn');
let lastHit = 0, combo = 0;

function don() { // どん
  const c = Sfx.ac(), t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.35);
  g.gain.setValueAtTime(1.0, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  o.connect(g).connect(Sfx.out()); o.start(t); o.stop(t + 0.55);
  Sfx.noise(0.08, 0.5, 800);
}
function ka() { // かっ（ふちを たたいた）
  Sfx.noise(0.06, 0.8, 3500, 0, 'bandpass');
  Sfx.tone(1200, 0.05, 'square', 0.1);
}

btn.addEventListener('pointerdown', (e) => {
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const d = Math.hypot(e.clientX - cx, e.clientY - cy) / (r.width / 2);
  const edge = d > 0.8;
  edge ? ka() : don();
  const now = performance.now();
  combo = now - lastHit < 500 ? combo + 1 : 1; lastHit = now;
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.style.left = cx + 'px'; ring.style.top = cy + 'px';
  ring.style.borderColor = edge ? '#33ccff' : `hsl(${40 - Math.min(combo, 20) * 2}, 100%, 60%)`;
  document.body.appendChild(ring); setTimeout(() => ring.remove(), 650);
  document.body.classList.remove('don'); void document.body.offsetWidth; document.body.classList.add('don');
  popText(edge ? 'かっ' : 'どん', e.clientX, e.clientY - 40, edge ? '#33ccff' : '#ffcc33', 44 + Math.min(combo, 15) * 3);
});
</script>
</body>
</html>
