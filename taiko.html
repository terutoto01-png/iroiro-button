<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>たいこ</title>
<link rel="stylesheet" href="common.css?v=23">
<style>
  body { background: var(--bg, #2a0f0f); display: flex; align-items: center; justify-content: center; transition: background .4s; }
  .stage { position: relative; }
  #btn { --c1: #f5e6c8; --c2: #8b2e1a; width: min(70vw, 320px); height: min(70vw, 320px);
         border: 14px solid var(--rim, #c0392b); color: #8b2e1a; }
  #btn .emoji { font-size: min(30vw, 140px); }
  /* がっきを かえる ボタン: おおきい ボタンの みぎした */
  #swap { position: absolute; right: max(-6vw, -40px); bottom: max(-6vw, -40px); width: min(22vw, 104px); height: min(22vw, 104px);
          font-size: min(6vw, 28px); --c1: #ffffff; --c2: #b9c3cf; z-index: 12; }
  .ring { position: fixed; z-index: 1; border-radius: 50%; border: 8px solid #ffcc33; pointer-events: none;
          transform: translate(-50%, -50%); animation: ring .6s ease-out forwards; }
  @keyframes ring { from { width: 280px; height: 280px; opacity: 1; } to { width: 900px; height: 900px; opacity: 0; } }
  body.don { animation: don .15s; }
  @keyframes don { 50% { filter: brightness(1.4); } }
</style>
</head>
<body>
<div class="stage"><button id="btn" class="big-btn"><span class="emoji">🥁</span></button><button id="swap" class="big-btn"><span class="emoji">🎹</span></button></div>
<script src="common.js?v=20"></script>
<script>
// がっき: おおきい ボタンを たたく（まんなか と ふち で おとが ちがう）。みぎしたの ボタンで がっきが かわる（つぎの がっきの えが でている）。
const btn = document.getElementById('btn'), swap = document.getElementById('swap');
let lastHit = 0, combo = 0, inst = 0;

// ---- おとを つくる ----
function osc(type, f, t, dur, vol, slideTo) {
  const c = Sfx.ac(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(Sfx.out()); o.start(t); o.stop(t + dur + 0.05);
}
const now = () => Sfx.ac().currentTime;
// ペンタトニック（どの じゅんでも きれいに きこえる）
const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0];
let pi = 3;
const CHORDS = [[261.63, 329.63, 392.0, 523.25], [196.0, 246.94, 293.66, 392.0], [220.0, 261.63, 329.63, 440.0], [174.61, 220.0, 261.63, 349.23]];
let ci = 0;
const FANFARE = [392.0, 523.25, 659.25, 783.99];
let fi = 0;

const INST = [
  { e: '🥁', bg: '#2a0f0f', c1: '#f5e6c8', c2: '#8b2e1a', rim: '#c0392b', ring: ['#ffcc33', '#33ccff'], word: ['どん', 'かっ'],
    play(edge) {
      if (edge) { Sfx.noise(0.06, 0.8, 3500, 0, 'bandpass'); Sfx.tone(1200, 0.05, 'square', 0.1); return; }
      osc('sine', 160, now(), 0.5, 1.0, 50); Sfx.noise(0.08, 0.5, 800);
    } },
  { e: '🎹', bg: '#14213d', c1: '#ffffff', c2: '#9aa5b5', rim: '#222831', ring: ['#9ad0ff', '#ffd6f0'], word: ['ぽろん', 'ぴろん'],
    play(edge) {
      pi = Math.max(0, Math.min(PENTA.length - 1, pi + pick([-2, -1, 1, 1, 2])));
      const f = PENTA[pi] * (edge ? 2 : 1), t = now();
      osc('triangle', f, t, 1.3, 0.35); osc('sine', f * 2, t, 0.8, 0.08); osc('sine', f * 3, t, 0.4, 0.03);
    } },
  { e: '🎺', bg: '#3d2a05', c1: '#ffd34d', c2: '#a87a00', rim: '#e0a800', ring: ['#ffe066', '#ff9f43'], word: ['ぷっぷー', 'パパパー'],
    play(edge) {
      const c = Sfx.ac(), t = now();
      const horn = (f, at, dur) => {
        const o = c.createOscillator(), fl = c.createBiquadFilter(), g = c.createGain();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(f * 0.97, at); o.frequency.linearRampToValueAtTime(f, at + 0.04);
        fl.type = 'lowpass'; fl.frequency.setValueAtTime(600, at); fl.frequency.linearRampToValueAtTime(2600, at + 0.06);
        g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.22, at + 0.03); g.gain.setValueAtTime(0.18, at + dur * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        o.connect(fl).connect(g).connect(Sfx.out()); o.start(at); o.stop(at + dur + 0.05);
      };
      if (edge) { horn(FANFARE[0], t, 0.12); horn(FANFARE[0], t + 0.14, 0.12); horn(FANFARE[0], t + 0.28, 0.12); horn(FANFARE[2], t + 0.42, 0.5); return; }
      horn(FANFARE[fi], t, 0.18); horn(FANFARE[(fi + 1) % 4], t + 0.2, 0.45); fi = (fi + 1) % 4;
    } },
  { e: '🔔', bg: '#0f2a2a', c1: '#fff4c2', c2: '#c9a227', rim: '#f2c94c', ring: ['#fff6a8', '#a8fff0'], word: ['しゃらん', 'りんりん'],
    play(edge) {
      const t = now(), base = pick([1046.5, 1174.66, 1318.5, 1567.98]);
      const bell = (f, at, v) => { osc('sine', f, at, 1.6, v); osc('sine', f * 2.76, at, 0.7, v * 0.35); osc('sine', f * 5.4, at, 0.3, v * 0.15); };
      if (edge) { for (let i = 0; i < 5; i++) bell(base * 1.5 + rand(-40, 40), t + i * 0.06, 0.08); return; }
      bell(base, t, 0.2); for (let i = 0; i < 4; i++) Sfx.noise(0.12, 0.08, 9000, i * 0.05, 'highpass');
    } },
  { e: '🎸', bg: '#2b1a3d', c1: '#ffb36b', c2: '#a8581c', rim: '#7a3e12', ring: ['#ff9ff3', '#feca57'], word: ['じゃーん', 'ぴーん'],
    play(edge) {
      const t = now();
      const pluck = (f, at, v) => { osc('triangle', f, at, 1.4, v); osc('sawtooth', f, at, 0.25, v * 0.25); osc('sine', f * 2, at, 0.6, v * 0.2); };
      if (edge) { pluck(pick([659.25, 783.99, 880.0]), t, 0.3); return; }
      CHORDS[ci].forEach((f, i) => pluck(f, t + i * 0.025, 0.18)); ci = (ci + 1) % CHORDS.length;
    } },
];

function setInst(i) {
  inst = i % INST.length;
  const I = INST[inst], N = INST[(inst + 1) % INST.length];
  btn.querySelector('.emoji').textContent = I.e;
  btn.style.setProperty('--c1', I.c1); btn.style.setProperty('--c2', I.c2); btn.style.setProperty('--rim', I.rim);
  btn.style.color = I.c2;
  document.body.style.setProperty('--bg', I.bg);
  swap.querySelector('.emoji').textContent = N.e;
}
setInst(0);
swap.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  setInst(inst + 1);
  INST[inst].play(false); // あたらしい がっきの おとを ちょっと
  btn.animate([{ scale: 0.85 }, { scale: 1.08 }, { scale: 1 }], { duration: 350, easing: 'ease-out' });
});

btn.addEventListener('pointerdown', (e) => {
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const d = Math.hypot(e.clientX - cx, e.clientY - cy) / (r.width / 2);
  const edge = d > 0.8, I = INST[inst];
  I.play(edge);
  const t = performance.now();
  combo = t - lastHit < 500 ? combo + 1 : 1; lastHit = t;
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.style.left = cx + 'px'; ring.style.top = cy + 'px';
  ring.style.borderColor = edge ? I.ring[1] : I.ring[0];
  document.body.appendChild(ring); setTimeout(() => ring.remove(), 650);
  document.body.classList.remove('don'); void document.body.offsetWidth; document.body.classList.add('don');
  popText(edge ? I.word[1] : I.word[0], e.clientX, e.clientY - 40, edge ? I.ring[1] : I.ring[0], 44 + Math.min(combo, 15) * 3);
});
</script>
</body>
</html>
