<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b9a">
<title>イルカショー</title>
<link rel="stylesheet" href="common.css?v=22">
<style>
  body { background: #87d8ff; }
  #cv { touch-action: none; }
  .big-btn { --c1: #66dcff; --c2: #1484bd; }
</style>
</head>
<body>
<canvas id="cv" class="full"></canvas>
<div class="corner"><button id="btn" class="big-btn"><span class="emoji">🐬</span></button></div>
<script src="common.js?v=18"></script>
<script>
// イルカショー: ボタンで ピッピー！ イルカが ジャンプして わくぐり・ボールタッチ！5かい すると 3とう どうじの にじジャンプ。
// そらを さわると さかなを なげて イルカが ぱくっ。うみを さわると クジラが しおふき！ ボールも さわると ゆれる。
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), btn = document.getElementById('btn');
let dpr = fitCanvas(cv, ctx), W = innerWidth, H = innerHeight;
let waterY, hoop, ball, tricks = 0, rainbowT = 0;
let swimmers = [], jumpers = [], treats = [], splashes = [], sparks = [], bubbles = [], whale = null;

function layout() {
  waterY = H * 0.62;
  hoop = { x: W * 0.5, y: Math.max(150, waterY - Math.min(185, H * 0.25)), r: Math.min(54, W * 0.12), glow: 0 };
  ball = { x: Math.min(W - 95, W * 0.76), y: Math.max(125, waterY - Math.min(230, H * 0.3)), sway: 0, v: 0, spin: 0 };
}
layout();
addEventListener('resize', () => { dpr = fitCanvas(cv, ctx); W = innerWidth; H = innerHeight; layout(); });

for (let i = 0; i < 3; i++) swimmers.push({ e: i === 2 ? '🦭' : '🐬', x: rand(60, W - 60), y: waterY + rand(45, 130), dir: i % 2 ? 1 : -1, sp: rand(55, 95), ph: rand(0, 6) });

function splash(x, power = 1) {
  for (let i = 0; i < Math.round(14 * power); i++) {
    splashes.push({ x: x + rand(-18, 18), y: waterY, vx: rand(-140, 140) * power, vy: rand(-280, -110) * power, r: rand(4, 9), life: rand(0.5, 0.9) });
  }
  Sfx.noise(0.32, 0.18 * power, 1200);
}

function whistle() {
  Sfx.tone(2200, 0.08, 'sine', 0.1, 0, 2600);
  Sfx.tone(2400, 0.16, 'sine', 0.1, 0.11, 2900);
}

function launchDolphin(tx, ty, kind = 'hoop', delay = 0) {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const span = Math.min(W * 0.42, 220);
  const sx = Math.max(50, Math.min(W - 50, tx - dir * span * 0.6));
  const ex = Math.max(50, Math.min(W - 50, tx + dir * span * 0.6));
  jumpers.push({ sx, ex, tx, ty, dir, t: -delay, dur: 1.25, kind, hit: false, splashed: false, e: '🐬' });
}

btn.addEventListener('pointerdown', () => {
  whistle();
  tricks++;
  if (tricks % 5 === 0) {
    rainbowT = 3.2;
    launchDolphin(W * 0.32, hoop.y + 10, 'show', 0);
    launchDolphin(W * 0.5, hoop.y - 25, 'hoop', 0.22);
    launchDolphin(W * 0.68, hoop.y + 10, 'show', 0.44);
    setTimeout(() => { Sfx.yay(); popText('すごい！', W / 2, hoop.y - 80, '#ffd23f', 54); }, 350);
  } else if (tricks % 3 === 0) {
    launchDolphin(ball.x, ball.y + 20, 'ball', 0);
  } else {
    launchDolphin(hoop.x, hoop.y, 'hoop', 0);
  }
});

cv.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY;
  // ボール
  if (Math.hypot(x - ball.x, y - ball.y) < 42) {
    ball.v += (x < ball.x ? 1 : -1) * 5;
    Sfx.boing();
    return;
  }
  // うみを タップ → クジラの しおふき
  if (y > waterY - 10) {
    splash(x, 0.8);
    if (!whale) {
      whale = { x: Math.max(70, Math.min(W - 70, x)), t: 0, spouted: false };
      Sfx.tone(180, 0.3, 'sine', 0.2, 0, 280);
    }
    return;
  }
  // そらを タップ → さかなを なげて イルカが ぱくっ
  if (y > 70) {
    const tr = { x, y, life: 3, eaten: false };
    treats.push(tr);
    Sfx.tone(720, 0.08, 'sine', 0.1, 0, 1050);
    launchDolphin(x, y, 'treat', 0);
  }
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000), t = now / 1000; last = now;
  hoop.glow = Math.max(0, hoop.glow - dt * 2);
  rainbowT = Math.max(0, rainbowT - dt);
  ball.v += (-ball.sway * 18 - ball.v * 2.4) * dt;
  ball.sway += ball.v * dt;
  ball.spin += ball.v * dt * 2;

  for (const s of swimmers) {
    s.x += s.dir * s.sp * dt;
    if (s.x > W + 50) s.dir = -1;
    if (s.x < -50) s.dir = 1;
    if (Math.random() < dt * 1.5) bubbles.push({ x: s.x, y: s.y, r: rand(3, 7), v: rand(30, 60) });
  }
  for (const b of bubbles) b.y -= b.v * dt;
  bubbles = bubbles.filter(b => b.y > waterY + 4);

  for (const j of jumpers) {
    j.t += dt;
    if (j.t < 0) continue;
    if (!j.splashed) { j.splashed = true; splash(j.sx, 1); }
    const u = j.t / j.dur;
    const peak = waterY - j.ty;
    j.x = j.sx + (j.ex - j.sx) * u;
    j.y = waterY - 4 * peak * u * (1 - u);
    const dx = (j.ex - j.sx) / j.dur;
    const dy = -4 * peak * (1 - 2 * u) / j.dur;
    j.ang = Math.atan2(dy, dx);
    if (!j.hit && u >= 0.45) {
      j.hit = true;
      if (j.kind === 'hoop') {
        hoop.glow = 1; Sfx.chime();
        for (let k = 0; k < 14; k++) sparks.push({ x: hoop.x, y: hoop.y, vx: rand(-180, 180), vy: rand(-180, 120), life: 0.9, c: `hsl(${rand(0, 360)},95%,60%)` });
      } else if (j.kind === 'ball') {
        ball.v = j.dir * 8; Sfx.boing(); Sfx.tone(880, 0.16, 'triangle', 0.12);
        popText('ナイス！', ball.x, ball.y - 45, '#ffd23f', 36);
        for (let k = 0; k < 12; k++) sparks.push({ x: ball.x, y: ball.y, vx: rand(-160, 160), vy: rand(-160, 80), life: 0.8, c: '#ffd23f' });
      } else if (j.kind === 'treat') {
        const tr = treats.find(q => !q.eaten && Math.hypot(q.x - j.tx, q.y - j.ty) < 40);
        if (tr) { tr.eaten = true; Sfx.pop(); popText('ぱくっ！', tr.x, tr.y - 30, '#fff', 34); for (let k = 0; k < 10; k++) sparks.push({ x: tr.x, y: tr.y, vx: rand(-120, 120), vy: rand(-140, 60), life: 0.7, c: '#ffd23f' }); }
      }
    }
    if (u >= 1) { j.done = true; splash(j.ex, 1.1); }
  }
  jumpers = jumpers.filter(j => !j.done);
  treats = treats.filter(tr => { tr.life -= dt; return !tr.eaten && tr.life > 0; });

  if (whale) {
    whale.t += dt;
    if (whale.t > 0.55 && !whale.spouted) {
      whale.spouted = true;
      Sfx.noise(0.55, 0.2, 2200, 0, 'highpass');
      Sfx.tone(520, 0.25, 'sine', 0.14, 0, 920);
      popText('ぷしゅー！', whale.x, waterY - 125, '#fff', 36);
      for (let i = 0; i < 24; i++) {
        splashes.push({ x: whale.x, y: waterY - 40, vx: rand(-90, 90), vy: rand(-340, -180), r: rand(4, 8), life: rand(0.7, 1.1) });
      }
    }
    if (whale.t > 2.4) whale = null;
  }

  for (const p of splashes) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 650 * dt; p.life -= dt; }
  splashes = splashes.filter(p => p.life > 0);
  for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 320 * dt; s.life -= dt; }
  sparks = sparks.filter(s => s.life > 0);

  draw(t);
  requestAnimationFrame(loop);
}

function drawDolphin(x, y, ang, dir, size) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  if (dir < 0) ctx.scale(1, -1);
  // 🐬 の えもじは ひだりうえ むきなので よこに そろえる
  ctx.scale(-1, 1);
  drawEmoji(ctx, '🐬', 0, 0, size);
  ctx.restore();
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, waterY);
  g.addColorStop(0, '#5cc8ff'); g.addColorStop(1, '#d8f4ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, waterY);

  // にじ（トリプルショー）
  if (rainbowT > 0) {
    const a = Math.min(1, rainbowT);
    const cols = ['#ff4f7b', '#ff9f1c', '#ffd23f', '#66bb44', '#4fc3f7', '#9b5cff'];
    ctx.globalAlpha = a * 0.55;
    cols.forEach((c, i) => {
      ctx.strokeStyle = c; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(W / 2, waterY + 20, Math.min(W * 0.44, 280) - i * 10, Math.PI, 0); ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  // おひさま と はた
  drawEmoji(ctx, '☀️', 74, 114, 54);
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 56); ctx.quadraticCurveTo(W / 2, 92, W, 56); ctx.stroke();
  const fc = ['#ff4f7b', '#ffd23f', '#4fc3f7', '#66bb44', '#ff9f1c'];
  for (let i = 1; i < 10; i++) {
    const u = i / 10, fx = W * u, fy = 56 + 4 * 36 * u * (1 - u);
    ctx.fillStyle = fc[i % fc.length];
    ctx.beginPath(); ctx.moveTo(fx - 10, fy); ctx.lineTo(fx + 10, fy); ctx.lineTo(fx, fy + 20); ctx.fill();
  }

  // うしろの わっか（半分）
  ctx.strokeStyle = hoop.glow > 0 ? '#ffd23f' : '#ff5a5a'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.ellipse(hoop.x, hoop.y, hoop.r * 0.36, hoop.r, 0, -Math.PI / 2, Math.PI / 2); ctx.stroke();

  // ぶらさがる ボール
  const bx = ball.x + Math.sin(ball.sway) * 26, by = ball.y + Math.abs(Math.sin(ball.sway)) * 8;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ball.x, 0); ctx.lineTo(bx, by); ctx.stroke();
  ctx.save(); ctx.translate(bx, by); ctx.rotate(ball.spin);
  drawEmoji(ctx, '🏀', 0, 0, 46); ctx.restore();

  // さかな（えさ）
  for (const tr of treats) drawEmoji(ctx, '🐟', tr.x, tr.y + Math.sin(t * 8) * 5, 36);

  // ジャンプちゅうの イルカ
  for (const j of jumpers) if (j.t >= 0) drawDolphin(j.x, j.y, j.ang, j.dir, 72);

  // まえの わっか（半分: イルカが くぐって みえる）
  ctx.strokeStyle = hoop.glow > 0 ? '#fff59d' : '#ff8a00'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.ellipse(hoop.x, hoop.y, hoop.r * 0.36, hoop.r, 0, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
  if (hoop.glow > 0) drawEmoji(ctx, '✨', hoop.x, hoop.y - hoop.r - 12, 34);

  // クジラ
  if (whale) {
    const pop = whale.t < 0.4 ? whale.t / 0.4 : whale.t > 1.9 ? Math.max(0, (2.4 - whale.t) / 0.5) : 1;
    drawEmoji(ctx, '🐳', whale.x, waterY + 45 - pop * 64, 92);
  }

  // すいそう（うみ）
  const wg = ctx.createLinearGradient(0, waterY, 0, H);
  wg.addColorStop(0, 'rgba(30,175,235,.82)'); wg.addColorStop(1, 'rgba(12,92,168,.95)');
  ctx.fillStyle = wg;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, waterY + Math.sin(x / 40 + t * 3) * 6);
  ctx.lineTo(W + 20, H); ctx.fill();

  // うみの なかの いきもの と あわ
  ctx.globalAlpha = 0.72;
  for (const s of swimmers) {
    ctx.save(); ctx.translate(s.x, s.y + Math.sin(t * 3 + s.ph) * 8);
    if (s.dir > 0) ctx.scale(-1, 1);
    drawEmoji(ctx, s.e, 0, 0, 56); ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke(); }

  // なみの しろい せん
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 4;
  ctx.beginPath();
  for (let x = 0; x <= W + 20; x += 20) { const wy = waterY + Math.sin(x / 40 + t * 3) * 6; x ? ctx.lineTo(x, wy) : ctx.moveTo(x, wy); }
  ctx.stroke();

  for (const p of splashes) { ctx.fillStyle = `rgba(225,248,255,${Math.min(1, p.life)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  for (const s of sparks) { ctx.fillStyle = s.c; ctx.globalAlpha = Math.min(1, s.life); ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
