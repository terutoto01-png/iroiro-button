<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ぶんしん</title>
<link rel="stylesheet" href="common.css">
<style>
  body { background: linear-gradient(#ffe3f1, #e3f0ff); }
  .big-btn { --c1: #ff5fa2; --c2: #c2306f; }
</style>
</head>
<body>
<canvas id="cv" class="full"><button id="btn" class="big-btn"><span class="emoji">👯</span></button></canvas>
<script src="common.js"></script>
<script>
// ぶんしん: HTML-in-Canvas で本物のボタンを何こも描く
const canvas = document.getElementById('cv');
const btn = document.getElementById('btn');
const ctx = canvas.getContext('2d');
HIC.attach(canvas, btn);
let dpr = fitCanvas(canvas, ctx);
let sprite = null; // ボタンの写し（色ちがい入り）
const HUES = [0, 45, 90, 135, 180, 225, 270, 315];
addEventListener('resize', () => { dpr = fitCanvas(canvas, ctx); sprite = null; });

const main = { x: innerWidth / 2, y: innerHeight / 2, s: 1, squash: 0 };
let clones = [], sparks = [];
let last = performance.now();

function size() { return { w: btn.offsetWidth, h: btn.offsetHeight }; }

function spawnClones() {
  const n = 10;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rand(-0.2, 0.2);
    const sp = rand(350, 650);
    clones.push({
      x: main.x, y: main.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      rot: 0, vr: rand(-6, 6), s: rand(0.35, 0.6), tint: Math.floor(rand(0, HUES.length)), life: 6,
    });
  }
  if (clones.length > 40) clones.splice(0, clones.length - 40);
  main.squash = 1;
  [0, 3, 7, 10, 14].forEach((s, i) => Sfx.tone(440 * Math.pow(2, s / 12), 0.15, 'square', 0.07, i * 0.04));
  Sfx.tone(200, 0.4, 'sine', 0.2, 0, 1600);
}

function popClone(c) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(100, 400);
    sparks.push({ x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.7, hue: HUES[c.tint] });
  }
  Sfx.pop();
}

canvas.addEventListener('pointerdown', (e) => {
  const { w } = size();
  const x = e.clientX, y = e.clientY;
  // ぶんしんに あたった？（うえにあるものから）
  for (let i = clones.length - 1; i >= 0; i--) {
    const c = clones[i];
    if (Math.hypot(c.x - x, c.y - y) < w * c.s / 2) { popClone(c); clones.splice(i, 1); return; }
  }
  if (Math.hypot(main.x - x, main.y - y) < w * main.s / 2) spawnClones();
});

function frame() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  const W = innerWidth, H = innerHeight, { w, h } = size();
  if (!sprite) sprite = HIC.capture(ctx, canvas, btn, dpr, HUES);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // ぶんしん
  for (const c of clones) {
    c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; c.life -= dt;
    const r = w * c.s / 2;
    if (c.x < r) { c.x = r; c.vx = Math.abs(c.vx); }
    if (c.x > W - r) { c.x = W - r; c.vx = -Math.abs(c.vx); }
    if (c.y < r) { c.y = r; c.vy = Math.abs(c.vy); }
    if (c.y > H - r) { c.y = H - r; c.vy = -Math.abs(c.vy); }
  }
  clones = clones.filter(c => c.life > 0);
  if (sprite) for (const c of clones) {
    // ぶんしんは写しの画像で描く（軽い）
    ctx.save();
    ctx.globalAlpha = Math.min(1, c.life);
    ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.scale(c.s, c.s);
    ctx.drawImage(sprite.tints[c.tint], -w / 2, -h / 2, w, h);
    ctx.restore();
  }


  // きらきら
  for (const s of sparks) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; s.life -= dt;
    ctx.fillStyle = `hsla(${s.hue + 330}, 90%, 60%, ${Math.max(0, s.life / 0.7)})`;
    ctx.fillRect(s.x - 4, s.y - 4, 8, 8);
  }
  if (sparks.length > 400) sparks.splice(0, sparks.length - 400);
  sparks = sparks.filter(s => s.life > 0);

  // ほんもの（さいごに描くので、ここが押せる場所になる）
  main.x = W / 2; main.y = H / 2 + Math.sin(now / 400) * 10;
  main.squash *= Math.pow(0.02, dt);
  const sq = Math.sin(main.squash * 20) * main.squash * 0.25;
  ctx.save();
  ctx.translate(main.x, main.y); ctx.scale(1 + sq, 1 - sq);
  HIC.draw(ctx, btn, -w / 2, -h / 2);
  ctx.restore();
}
HIC.loop(canvas, frame);
</script>
</body>
</html>
